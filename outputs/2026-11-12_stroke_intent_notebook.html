<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stroke Intent Notebook</title><style>*{box-sizing:border-box}body{margin:0;background:#1d1020;color:#fff4ec;font:16px/1.5 system-ui,sans-serif}main{max-width:1060px;margin:auto;padding:28px}.tag{color:#ffbc8f;font-size:13px;letter-spacing:.08em}h1{font-size:clamp(42px,8vw,76px);line-height:.9;margin:12px 0}.muted{color:#d7b9c7}.grid{display:grid;grid-template-columns:1fr 320px;gap:16px}.card{background:#32192f;border:1px solid #71415f;border-radius:18px;padding:18px}canvas{width:100%;height:auto;display:block;border-radius:13px;background:linear-gradient(135deg,#392241,#0d4053);touch-action:none;cursor:crosshair}button{cursor:pointer;border:0;border-radius:11px;padding:10px 13px;margin:3px;background:#ffc09b;color:#3a1524;font-weight:800}.seg{display:flex;gap:5px;flex-wrap:wrap}.seg button.on{background:#9affd6}.log{font:13px/1.55 ui-monospace;max-height:280px;overflow:auto}.badge{display:inline-block;padding:3px 8px;border-radius:99px;background:#542945;color:#ffc4d0;font-size:12px}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><span class="tag">派生・自作 / ストロークを意図として残す</span><h1>Stroke Intent<br>Notebook</h1><p class="muted">Interactive Segmenter の「画像を固定してから正・負のストロークを重ねる」操作を参考に、推論前の意図だけを短く記録・再生する派生試作です。ここではマスク推論は行いません。</p><section class="grid"><section class="card"><div class="seg"><button id="positive" class="on">＋ 選びたい領域</button><button id="negative">− 除きたい領域</button><button id="undo">ひとつ戻す</button><button id="clear">リセット</button></div><p><span class="badge" id="mode">POSITIVE</span> キャンバスをドラッグすると、正規化座標のストロークを保存します。</p><canvas id="c" width="720" height="450"></canvas></section><aside class="card"><h2>意図の履歴</h2><p id="count">0 strokes</p><div class="log" id="log">まだストロークはありません。</div><p class="muted">次に足すなら、固定画像と実際の <code>segment(strokes)</code> を接続し、返った mask を表示したら速やかに解放する流れです。</p></aside></section><script>const $=id=>document.getElementById(id),c=$('c'),x=c.getContext('2d');let strokes=[],mode=1,active=null;function paint(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#112f40';x.fillRect(0,0,c.width,c.height);x.fillStyle='#226679';for(let i=0;i<18;i++)x.beginPath(),x.arc((i*97)%720,70+(i*71)%350,25+(i%4)*12,0,7),x.fill();strokes.forEach(s=>{x.strokeStyle=s.mode===1?'#8fffd5':'#ff91a8';x.lineWidth=7;x.lineCap='round';x.beginPath();s.points.forEach((p,i)=>i?x.lineTo(p.x*c.width,p.y*c.height):x.moveTo(p.x*c.width,p.y*c.height));x.stroke()})}function update(){ $('count').textContent=strokes.length+' strokes';$('log').innerHTML=strokes.length?strokes.map((s,i)=>`${String(i+1).padStart(2,'0')} ${s.mode===1?'＋ POSITIVE':'− NEGATIVE'}  ${s.points.length} points`).reverse().join('<br>'):'まだストロークはありません。';paint()}function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);active={mode,points:[point(e)]};strokes.push(active);update()};c.onpointermove=e=>{if(active){active.points.push(point(e));paint()}};c.onpointerup=()=>{active=null;update()};function setMode(m){mode=m;$('positive').classList.toggle('on',m===1);$('negative').classList.toggle('on',m===2);$('mode').textContent=m===1?'POSITIVE':'NEGATIVE'};$('positive').onclick=()=>setMode(1);$('negative').onclick=()=>setMode(2);$('undo').onclick=()=>{strokes.pop();update()};$('clear').onclick=()=>{strokes=[];update()};paint();</script></main></html>
