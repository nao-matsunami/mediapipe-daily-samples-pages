<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confidence Hysteresis Stage</title>
<style>
:root{color-scheme:dark;--ink:#eaf4ff;--muted:#9ab0c7;--line:#294663;--mint:#72efc0;--amber:#ffcb66;--bg:#07121f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#193b52,var(--bg) 55%);font:15px/1.5 ui-sans-serif,system-ui;color:var(--ink)}main{max-width:980px;margin:auto;padding:28px}h1{margin:0;font-size:clamp(28px,5vw,48px)}p{color:var(--muted)}.grid{display:grid;grid-template-columns:1.35fr .8fr;gap:18px}@media(max-width:720px){.grid{grid-template-columns:1fr}}canvas,.panel{background:#091a29;border:1px solid var(--line);border-radius:16px}.panel{padding:18px}canvas{width:100%;height:380px}label{display:block;margin:14px 0 4px;color:var(--muted)}input{width:100%;accent-color:var(--mint)}button{border:1px solid var(--mint);background:#102f36;color:var(--ink);border-radius:10px;padding:10px 13px;cursor:pointer}button+button{margin-left:8px}.metric{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}strong{color:var(--mint)}code{color:var(--amber)}.note{font-size:13px}
</style>
<main><p>自作・合成入力のみ / MediaPipe Web Tasks の実APIは呼びません</p><h1>Confidence Hysteresis Stage</h1><p>フレームごとに揺れる存在確信度を、開始・継続の二つの閾値で受け止める小さな検証面です。スライダーを動かすか、波を再生してください。</p><div class="grid"><canvas id="stage" width="760" height="380" aria-label="confidence timeline"></canvas><section class="panel"><button id="play">再生</button><button id="burst">揺れを追加</button><label>開始閾値 <output id="enterOut"></output><input id="enter" type="range" min=".35" max=".9" value=".68" step=".01"></label><label>継続閾値 <output id="keepOut"></output><input id="keep" type="range" min=".1" max=".75" value=".48" step=".01"></label><div class="metric"><span>現在の confidence</span><strong id="score">—</strong></div><div class="metric"><span>出力状態</span><strong id="state">待機</strong></div><div class="metric"><span>切替回数</span><strong id="switches">0</strong></div><p class="note">開始は高め、継続は少し低めにすると、境界付近の点滅を減らせます。実装では presence・tracking・アプリ固有の時間条件を別々に記録します。</p></section></div></main>
<script>
const c=document.querySelector('#stage'),x=c.getContext('2d'),enter=document.querySelector('#enter'),keep=document.querySelector('#keep');let t=0,on=false,playing=false,changes=0,noise=0;
const el=id=>document.querySelector(id);function v(){let s=.58+.27*Math.sin(t*.14)+.11*Math.sin(t*.61)+noise*(Math.random()-.5);return Math.max(.02,Math.min(.98,s))}function draw(){let a=+enter.value,b=Math.min(+keep.value,a-.01);keep.value=b;el('#enterOut').textContent=a.toFixed(2);el('#keepOut').textContent=b.toFixed(2);x.clearRect(0,0,c.width,c.height);x.fillStyle='#091a29';x.fillRect(0,0,c.width,c.height);for(let i=0;i<6;i++){let y=35+i*55;x.strokeStyle='#17354c';x.beginPath();x.moveTo(0,y);x.lineTo(c.width,y);x.stroke();x.fillStyle='#7894ac';x.fillText((1-i*.2).toFixed(1),8,y-5)}function line(y,col,name){x.strokeStyle=col;x.setLineDash([7,7]);x.beginPath();x.moveTo(0,350-y*300);x.lineTo(c.width,350-y*300);x.stroke();x.setLineDash([]);x.fillStyle=col;x.fillText(name,650,345-y*300)}line(a,'#ffcb66','開始');line(b,'#72efc0','継続');let prev=null;for(let i=0;i<75;i++){let q=.58+.27*Math.sin((t-75+i)*.14)+.11*Math.sin((t-75+i)*.61);q=Math.max(.02,Math.min(.98,q));let px=i*10.3,py=350-q*300;if(prev){x.strokeStyle='#9fd8ff';x.lineWidth=2;x.beginPath();x.moveTo(prev[0],prev[1]);x.lineTo(px,py);x.stroke()}prev=[px,py]}let s=v();if(!on&&s>=a){on=true;changes++}else if(on&&s<b){on=false;changes++}x.fillStyle=on?'#72efc0':'#ff7184';x.beginPath();x.arc(700,350-s*300,10,0,7);x.fill();el('#score').textContent=s.toFixed(2);el('#state').textContent=on?'追跡を維持':'待機 / 再検出';el('#switches').textContent=changes;t++;noise*=.93;if(playing)requestAnimationFrame(draw)}function start(){if(!playing){playing=true;draw()}}el('#play').onclick=()=>{playing=!playing;el('#play').textContent=playing?'停止':'再生';if(playing)draw()};el('#burst').onclick=()=>{noise=.36;start()};[enter,keep].forEach(q=>q.oninput=()=>{draw()});draw();
</script>
</html>
