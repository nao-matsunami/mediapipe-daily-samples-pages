<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIMD Capability Gate Lab</title>
<style>*{box-sizing:border-box}body{margin:0;background:#08101d;color:#edf5ff;font:16px/1.55 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:28px}.tag{color:#99dcff;border:1px solid #35617d;border-radius:99px;padding:4px 10px;font-size:12px}h1{font-size:clamp(34px,7vw,64px);line-height:1;margin:14px 0}.sub{color:#b8c8d9;max-width:720px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:24px 0}.card{background:#101d2f;border:1px solid #29455f;border-radius:18px;padding:17px}.card strong{display:block;color:#abebff}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#ffbe74;margin-right:8px}.ok .dot{background:#8df0bd}.bad .dot{background:#ff8d9b}button{border:0;border-radius:11px;padding:11px 16px;background:#8ce7ff;color:#062031;font-weight:800;cursor:pointer}input{accent-color:#8ce7ff}.route{min-height:180px;border-radius:22px;padding:24px;background:radial-gradient(circle at 20% 20%,#21557b,#101a2c 52%,#080d17);border:1px solid #315a77}.route h2{margin:0;color:#d9f8ff}.big{font-size:34px;margin:8px 0;color:#9bf0c4}.note{color:#a9bed0}.bar{height:14px;background:#07101d;border-radius:99px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#64d7ff,#8affbd);transition:.35s}@media(max-width:640px){.grid{grid-template-columns:1fr}}</style>
<main><span class="tag">自作・ブラウザ内の互換性ルート可視化</span><h1>SIMD Capability<br>Gate Lab</h1><p class="sub">MediaPipe Tasks Web がSIMD前提のWASM配布へ寄る時、起動前に「この端末で何を出せるか」を説明可能にする小さな試作です。実モデルは読み込みません。</p>
<section class="grid"><label class="card"><strong>SIMD が使える（検出結果）</strong><span class="dot"></span><input id="simd" type="checkbox" checked> WebAssembly SIMD</label><label class="card"><strong>分離済みコンテキスト</strong><span class="dot"></span><input id="iso" type="checkbox"> cross-origin isolated</label><label class="card"><strong>GPU委譲を希望</strong><span class="dot"></span><input id="gpu" type="checkbox" checked> GPU route</label><label class="card"><strong>ネットワーク品質</strong><input id="net" type="range" min="1" max="3" value="3"><span id="netV">良好</span></label></section>
<p><button id="check">起動ルートを判定</button> <button id="demo">現環境のヒントを読む</button></p><section class="route"><h2 id="title">判定待ち</h2><div class="big" id="state">—</div><div class="bar"><i id="meter"></i></div><p id="body" class="note">トグルを変えて、読み込み前の説明と代替導線がどう変わるか確認します。</p></section><p class="note">次に足すなら: 実際のWASM初期化時間、モデルのダウンロード進捗、そして端末別の失敗理由を匿名の集計に分けて記録する。</p></main>
<script>const $=x=>document.getElementById(x);const names=['低速','標準','良好'];function run(){const s=$('simd').checked,i=$('iso').checked,g=$('gpu').checked,n=+$('net').value;for(const e of ['simd','iso','gpu'])e&&($(e).parentElement.classList.toggle('ok',$(e).checked),$(e).parentElement.classList.toggle('bad',!$(e).checked));$('netV').textContent=names[n-1];let t,st,b,w;if(!s){t='互換性の案内';st='WASM SIMD が必要';b='このビルドはSIMDを前提にします。静止画の説明版、対応ブラウザへの案内、またはサーバー処理を明示的な選択肢として出します。';w=22}else if(g&&!i){t='安全な既定ルート';st='SIMD + CPU で開始';b='SIMD は利用できますが、分離条件を要求する高度な共有メモリ経路は選びません。GPU要求は初回推論の成功後に段階的に提案します。';w=61}else{t='推論を開始できる';st=g?'SIMD + GPU を試行':'SIMD + CPU を選択';b=n===1?'回線が遅いため、モデル取得前に容量と再試行を示します。':'WASM とモデルを読み込み、失敗時は理由を保ったままCPUへ戻します。';w=g?92:76}$('title').textContent=t;$('state').textContent=st;$('body').textContent=b;$('meter').style.width=w+'%'}$('check').onclick=run;$('net').oninput=run;$('demo').onclick=()=>{const supported=typeof WebAssembly==='object';$('simd').checked=supported; $('iso').checked=!!crossOriginIsolated;run()};run();</script></html>
