<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mask Lease Frame Lab</title><style>:root{color-scheme:dark;--bg:#07111a;--panel:#0e2130;--line:#28506b;--ink:#ebf7ff;--mut:#9ab6c6;--a:#77f4c6;--warn:#ffd06b;--bad:#ff8d99}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#153e4c,var(--bg) 58%);font:15px/1.5 ui-monospace,monospace;color:var(--ink)}main{max-width:1080px;margin:auto;padding:28px}h1{margin:0;font-size:clamp(25px,4vw,42px)}.lead,small{color:var(--mut)}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:20px}@media(max-width:750px){.grid{grid-template-columns:1fr}}.card{background:#0a1c29d9;border:1px solid var(--line);border-radius:18px;padding:16px}canvas{width:100%;aspect-ratio:16/9;background:#030a10;border:1px solid var(--line);border-radius:12px;display:block}button{cursor:pointer;border:0;border-radius:9px;padding:10px 12px;margin:9px 6px 0 0;font-weight:800;background:var(--a)}button.alt{background:#24465c;color:var(--ink)}label{display:block;color:var(--mut);margin-top:13px}input{width:100%;accent-color:var(--a)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.stat{border:1px solid var(--line);border-radius:10px;padding:10px}.num{font-size:28px;color:var(--a)}.bar{height:12px;background:#041017;border-radius:8px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--warn));width:0;transition:.18s}.row{border-left:3px solid var(--a);margin:7px 0;padding:7px 9px;background:#071620}.row.warn{border-color:var(--warn)}.row.bad{border-color:var(--bad)}#log{height:185px;overflow:auto}</style><body><main><h1>Mask Lease Frame Lab</h1><p class="lead">MediaPipe Tasks の結果マスクを「次のフレームへ持ち越さない短い lease」として扱うための自作シミュレータ。実カメラ・実モデルは使わず、連続フレームの同期、copy、解放判断だけを操作します。</p><div class="grid"><section class="card"><canvas id="cv" width="800" height="450"></canvas><button id="step">1フレーム処理</button><button id="run" class="alt">連続実行</button><button id="reset" class="alt">リセット</button><p class="lead">緑: 結果を同フレーム内で描画して解放。黄: 次フレームへ copy。赤: lease を超えた参照。次に足すなら、実際の <code>ImageSegmenter</code> callback と <code>getAsImageBitmap()</code> の計測を差し込みます。</p></section><section class="card"><label>1フレームの予算 <output id="bo">16 ms</output></label><input id="budget" type="range" min="8" max="40" value="16"><label>mask を次フレームへ copy <output id="co">off</output></label><input id="copy" type="range" min="0" max="1" value="0"><label>擬似 inference 負荷 <output id="lo">11 ms</output></label><input id="load" type="range" min="4" max="35" value="11"><div class="bar"><i id="fill"></i></div><div class="stats"><div class="stat"><small>解放済み</small><div class="num" id="released">0</div></div><div class="stat"><small>copy 済み</small><div class="num" id="copied">0</div></div><div class="stat"><small>期限切れ参照</small><div class="num" id="expired">0</div></div><div class="stat"><small>描画遅延</small><div class="num" id="late">0</div></div></div><div id="log"></div></section></div></main><script>const $=x=>document.getElementById(x),c=$('cv'),x=c.getContext('2d');let f=0,old=false,r=0,cp=0,ex=0,late=0,timer=0;function settings(){let b=+$('budget').value,l=+$('load').value,co=+$('copy').value;$('bo').value=b+' ms';$('lo').value=l+' ms';$('co').value=co?'on':'off';$('fill').style.width=Math.min(100,l/b*100)+'%'}function log(msg,k=''){let d=document.createElement('div');d.className='row '+k;d.innerHTML='<small>frame '+f+' · </small>'+msg;$('log').prepend(d)}function draw(load,wasOld){let t=f*.17;x.clearRect(0,0,c.width,c.height);x.fillStyle='#07121c';x.fillRect(0,0,c.width,c.height);for(let i=0;i<14;i++){x.fillStyle=`hsla(${180+i*6},80%,65%,.12)`;x.beginPath();x.arc(80+i*58,225+Math.sin(t+i)*80,55,0,7);x.fill()}x.fillStyle=wasOld?'#ff8d99':'#77f4c6';x.beginPath();x.ellipse(390+Math.sin(t)*170,225,130,92,0,0,7);x.fill();x.fillStyle='#ebf7ff';x.font='18px ui-monospace';x.fillText(wasOld?'EXPIRED MASK REFERENCE':'frame-local mask lease',24,38);x.fillStyle='#9ab6c6';x.fillText('simulated inference '+load+' ms',24,416)}function step(){f++;let b=+$('budget').value,l=+$('load').value,co=+$('copy').value;let wasOld=old;old=false;if(wasOld){ex++;log('前フレームの lease を越えて参照しようとした','bad')}if(l>b){late++;log('inference '+l+' ms が予算 '+b+' ms を超過','warn')}if(co){cp++;old=true;log('mask を独立コピーし、次フレーム用途へ移管','warn')}else{r++;log('mask をこのフレームで描画して解放')}draw(l,wasOld);$('released').textContent=r;$('copied').textContent=cp;$('expired').textContent=ex;$('late').textContent=late}['budget','load','copy'].forEach(i=>$(i).oninput=settings);$('step').onclick=step;$('run').onclick=()=>{if(timer){clearInterval(timer);timer=0;$('run').textContent='連続実行';return}timer=setInterval(step,480);$('run').textContent='停止'};$('reset').onclick=()=>{f=r=cp=ex=late=0;old=false;$('log').innerHTML='';step()};settings();step();</script></body></html>
