<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boundary Dwell Latch</title><style>:root{color-scheme:dark;--bg:#0a101b;--card:#101d31;--line:#35466d;--ink:#f1f5ff;--muted:#aab6d1;--violet:#c2a8ff;--mint:#9dffd0;--amber:#ffcf8d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 5% 0,#302153,transparent 35%),var(--bg);color:var(--ink);font:16px/1.5 system-ui}main{max-width:980px;margin:auto;padding:28px}.tag{font:700 12px ui-monospace;letter-spacing:.14em;color:var(--violet)}h1{font-size:clamp(38px,7vw,70px);line-height:.9;margin:12px 0}.lead,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:255px 1fr;gap:16px}.card{background:#101d31d9;border:1px solid var(--line);border-radius:20px;padding:17px}label{display:block;margin:16px 0;font:13px ui-monospace;color:#cbd5ec}input{width:100%;accent-color:var(--violet)}canvas{touch-action:none;width:100%;height:auto;display:block;border-radius:14px;background:#080d17}.stat{font:700 24px ui-monospace;color:var(--mint)}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main><div class="tag">ORIGINAL / DERIVATIVE INTERACTION STUDY</div><h1>Boundary<br>Dwell Latch</h1><p class="lead">境界を一瞬またいだだけの認識結果を操作に変えないための派生試作です。円の内側にポインタを留めると、短い滞在時間を経て初めてアクションが確定します。</p><section class="grid"><aside class="card"><label>確定までの滞在 <output id="dwellO">420</output> ms<input id="dwell" type="range" min="80" max="1300" value="420"></label><label>境界の余白 <output id="marginO">26</output> px<input id="margin" type="range" min="0" max="90" value="26"></label><p class="stat" id="state">OUTSIDE</p><p class="muted" id="note">速く横切ると確定せず、内側に留めるとラッチされます。</p></aside><section class="card"><canvas id="view" width="650" height="420"></canvas><p class="muted">次に足すなら、Hand Landmarker の指先座標・presence・前フレーム速度を使い、手ぶれ量に応じて余白と滞在時間を可変にします。</p></section></section><script>const $=s=>document.querySelector(s),c=$('#view'),g=c.getContext('2d');let p={x:-99,y:-99},entered=null,latched=false,count=0;
function release(){p={x:-99,y:-99};entered=null;latched=false}
function move(e){const r=c.getBoundingClientRect();p={x:(e.clientX-r.left)*650/r.width,y:(e.clientY-r.top)*420/r.height}}
c.addEventListener('pointermove',move);c.addEventListener('pointerdown',move);
c.addEventListener('pointerleave',release);c.addEventListener('pointercancel',release);
c.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')release()});
addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{if(document.hidden)release()});
function draw(t){if(document.hidden){requestAnimationFrame(draw);return}let d=+$('#dwell').value,m=+$('#margin').value;$('#dwellO').textContent=d;$('#marginO').textContent=m;let cx=325,cy=210,r=112,dist=Math.hypot(p.x-cx,p.y-cy),inside=dist<r-m;if(!inside){entered=null;latched=false}else if(entered===null)entered=t;let elapsed=entered===null?0:t-entered;if(inside&&elapsed>=d&&!latched){latched=true;count++}let pct=Math.min(1,elapsed/d);g.fillStyle='#080d17';g.fillRect(0,0,650,420);g.strokeStyle='#35466d';g.lineWidth=2;g.beginPath();g.arc(cx,cy,r,0,7);g.stroke();g.strokeStyle='#c2a8ff';g.setLineDash([5,7]);g.beginPath();g.arc(cx,cy,r-m,0,7);g.stroke();g.setLineDash([]);g.fillStyle=latched?'#9dffd0':'#c2a8ff';g.globalAlpha=.16+(.5*pct);g.beginPath();g.arc(cx,cy,r-m,0,7);g.fill();g.globalAlpha=1;g.fillStyle='#f1f5ff';g.font='700 16px ui-monospace';g.textAlign='center';g.fillText(latched?'LATCHED':'DWELL TO ACT',cx,cy-6);g.fillStyle='#aab6d1';g.font='13px ui-monospace';g.fillText(latched?'move out to reset':Math.round(pct*100)+'%',cx,cy+19);g.textAlign='start';g.fillStyle='#9dffd0';g.fillRect(26,370,598*pct,12);g.strokeStyle='#35466d';g.strokeRect(26,370,598,12);g.fillStyle='#aab6d1';g.fillText('confirmed actions: '+count,26,400);g.fillStyle='#ffcf8d';g.beginPath();g.arc(p.x,p.y,9,0,7);g.fill();$('#state').textContent=latched?'LATCHED':inside?'DWELLING':'OUTSIDE';$('#state').style.color=latched?'#9dffd0':inside?'#c2a8ff':'#ffcf8d';requestAnimationFrame(draw)}requestAnimationFrame(draw);</script></main></html>
