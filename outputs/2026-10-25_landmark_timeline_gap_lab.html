<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Landmark Timeline Gap Lab</title>
<style>
  :root{color-scheme:dark;--ink:#e8f0ff;--muted:#8ea0bb;--panel:#151d2d;--line:#2b3955;--hot:#7cceff;--warn:#ffbd6d;--good:#79e8ae}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,sans-serif}.wrap{max-width:980px;margin:auto;padding:28px 18px}h1{font-size:clamp(26px,5vw,44px);margin:0 0 6px}p{color:var(--muted);margin:4px 0 20px}.grid{display:grid;grid-template-columns:300px 1fr;gap:16px}@media(max-width:720px){.grid{grid-template-columns:1fr}}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}label{display:block;margin:0 0 15px;color:#cbd8ee}input{width:100%;accent-color:var(--hot)}output{float:right;color:var(--hot);font-variant-numeric:tabular-nums}button{border:1px solid #3d6695;background:#1b3452;color:var(--ink);border-radius:8px;padding:9px 12px;cursor:pointer}button+button{margin-left:7px}.canvas{height:250px;position:relative;overflow:hidden;border-radius:10px;background:linear-gradient(135deg,#0c1425,#111f37)}.timeline{position:absolute;inset:40px 22px 45px;border-bottom:2px solid #53627c}.tick{position:absolute;bottom:-8px;width:1px;height:16px;background:#53627c}.dot{position:absolute;width:13px;height:13px;border-radius:50%;transform:translate(-50%,50%);border:2px solid #0c1425}.dot.live{background:var(--good);box-shadow:0 0 15px #79e8ae}.dot.held{background:var(--warn);box-shadow:0 0 14px #ffbd6d}.dot.off{background:#53627c}.band{position:absolute;bottom:0;background:#ffbd6d22;border-left:1px dashed var(--warn);border-right:1px dashed var(--warn)}.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.metric{padding:10px;border:1px solid var(--line);border-radius:9px;color:var(--muted)}.metric b{display:block;color:var(--ink);font-size:18px}.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);margin:12px 0 0}.key{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px}.note{margin-top:16px;padding:12px;border-left:3px solid var(--hot);background:#10213a;color:#b9cce9}.log{font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;color:#b5c7e4;min-height:96px}
</style>
<body><main class="wrap"><h1>Landmark Timeline Gap Lab</h1><p>合成ランドマーク結果の「欠損」を、即座に消すか、短時間だけ保持するかを比較する自作の時系列検証面です。MediaPipe APIやモデルは読み込みません。</p><div class="grid"><section class="panel"><label>保持猶予 <output id="holdOut">260 ms</output><input id="hold" type="range" min="0" max="800" step="20" value="260"></label><label>欠損の長さ <output id="gapOut">420 ms</output><input id="gap" type="range" min="120" max="1100" step="20" value="420"></label><label>再生速度 <output id="speedOut">1.0×</output><input id="speed" type="range" min="0.5" max="2" step="0.1" value="1"></label><button id="play">再生 / 停止</button><button id="restart">先頭へ</button><div class="note">保持は表示の連続性に役立ちますが、古い結果を「現在」と誤認させないよう、年齢を可視化して上限で停止します。</div></section><section class="panel"><div class="canvas" id="canvas"><div class="timeline" id="timeline"></div></div><div class="readout"><div class="metric"><b id="state">LIVE</b>出力状態</div><div class="metric"><b id="age">0 ms</b>最後の結果の年齢</div><div class="metric"><b id="events">0 / 0</b>受信 / 欠損</div></div><div class="legend"><span><i class="key" style="background:#79e8ae"></i>LIVE: 新規結果</span><span><i class="key" style="background:#ffbd6d"></i>HOLD: 最終結果を明示保持</span><span><i class="key" style="background:#53627c"></i>OFF: 表示停止</span></div><div class="log" id="log"></div></section></div></main><script>
const $=id=>document.getElementById(id), inputs=['hold','gap','speed'];let playing=true,t=0,last=0,raf,received=0,missing=0,prev='';
function val(id){return +$(id).value}function labels(){ $('holdOut').textContent=val('hold')+' ms';$('gapOut').textContent=val('gap')+' ms';$('speedOut').textContent=val('speed').toFixed(1)+'×'}inputs.forEach(id=>$(id).oninput=labels);labels();
function sequence(time){const cycle=1900, p=time%cycle, start=720, end=start+val('gap');return !(p>=start&&p<end)}
function render(){const holder=$('timeline');holder.innerHTML='';const duration=1900, gapStart=720, gapEnd=gapStart+val('gap');const band=document.createElement('i');band.className='band';band.style.left=(gapStart/duration*100)+'%';band.style.width=((gapEnd-gapStart)/duration*100)+'%';holder.append(band);for(let i=0;i<=10;i++){const tick=document.createElement('i');tick.className='tick';tick.style.left=(i*10)+'%';holder.append(tick)}for(let x=0;x<=duration;x+=100){const fresh=!(x>=gapStart&&x<gapEnd), age=fresh?0:Math.min(x-gapStart,999), c=document.createElement('i');c.className='dot '+(fresh?'live':age<=val('hold')?'held':'off');c.style.left=(x/duration*100)+'%';c.style.bottom=(fresh?56:age<=val('hold')?42:26)+'px';holder.append(c)}}
function frame(now){if(!frame.last)frame.last=now;let dt=(now-frame.last)*val('speed');frame.last=now;if(playing){t+=dt;const fresh=sequence(t);if(fresh){last=t;received++}else missing++;const age=Math.round(t-last);const state=fresh?'LIVE':age<=val('hold')?'HOLD':'OFF';$('state').textContent=state;$('state').style.color=state==='LIVE'?'#79e8ae':state==='HOLD'?'#ffbd6d':'#8ea0bb';$('age').textContent=age+' ms';$('events').textContent=received+' / '+missing;if(state!==prev){$('log').textContent=`t=${Math.round(t)}ms  ${state}\n`+$('log').textContent;prev=state}render()}raf=requestAnimationFrame(frame)}
$('play').onclick=()=>playing=!playing;$('restart').onclick=()=>{t=0;last=0;received=missing=0;prev='';$('log').textContent='';};requestAnimationFrame(frame);
</script></body></html>
