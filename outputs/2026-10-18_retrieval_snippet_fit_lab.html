<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retrieval Snippet Fit Lab</title><style>:root{color-scheme:dark;--b:#08111e;--p:#102038;--l:#304a68;--i:#eaf5ff;--m:#9db0c7;--a:#9ec9ff;--g:#84f2c4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#18375f,var(--b) 58%);color:var(--i);font:15px/1.5 system-ui,sans-serif}.w{max-width:1000px;margin:auto;padding:28px}h1{margin:0;font-size:clamp(25px,4vw,40px)}.lead{color:var(--m);max-width:75ch}.g{display:grid;grid-template-columns:.8fr 1.2fr;gap:16px;margin-top:20px}@media(max-width:740px){.g{grid-template-columns:1fr}}.c{background:#0d1c30dd;border:1px solid var(--l);padding:17px;border-radius:17px}label{display:block;margin:13px 0 3px;color:var(--m)}input{width:100%;accent-color:var(--g)}.row{border:1px solid var(--l);border-radius:12px;padding:12px;margin:9px 0}.row b{color:var(--g)}.tag{float:right;color:#9ec9ff;font:12px ui-monospace,monospace}.meter{height:10px;background:#182b46;border-radius:9px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;background:linear-gradient(90deg,#9ec9ff,#84f2c4)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.s{border:1px solid var(--l);padding:10px;border-radius:10px}.n{font-size:24px;color:var(--g)}code{color:#ffda87}</style><body><main class="w"><h1>Retrieval Snippet Fit Lab</h1><p class="lead">MediaPipe v1.1.1 の Retrieval SDK コード例更新を手掛かりにした、検索候補を LLM や UI に渡す前の「収まり」を確かめる自作ミニ試作です。top-K と一件あたりの要約長を変え、関連度と文脈予算の折り合いを見ます。</p><div class="g"><section class="c"><label>context budget <output id="bo">420 tokens</output></label><input id="budget" type="range" min="120" max="900" step="20" value="420"><label>候補数 top-K <output id="ko">4</output></label><input id="k" type="range" min="1" max="7" value="4"><label>圧縮率 <output id="co">58%</output></label><input id="compress" type="range" min="25" max="100" value="58"><div class="stats"><div class="s"><small>採用</small><div class="n" id="take">0</div></div><div class="s"><small>使用量</small><div class="n" id="used">0</div></div><div class="s"><small>平均関連度</small><div class="n" id="rel">—</div></div></div><p class="lead">次に足すなら: <code>SemanticRetriever</code> の実際の score / citation と、クリックした根拠を IndexedDB に残す評価画面へ接続します。</p></section><section class="c"><div id="list"></div></section></div></main><script>const $=x=>document.getElementById(x);const data=[['姿勢の timestamp と補間',.94,190],['presence が低い landmark の扱い',.91,150],['GPU delegate のウォームアップ',.87,220],['mask の ROI だけ更新する設計',.84,175],['privacy 同意と metrics の境界',.79,205],['embedding の多様性 rerank',.76,165],['結果表示の説明可能性',.72,140]];['budget','k','compress'].forEach(i=>$(i).oninput=draw);function draw(){let b=+$('budget').value,k=+$('k').value,c=+$('compress').value/100;$('bo').value=b+' tokens';$('ko').value=k;$('co').value=Math.round(c*100)+'%';let use=0,chosen=[];data.slice(0,k).forEach((d,i)=>{let n=Math.ceil(d[2]*c);if(use+n<=b){use+=n;chosen.push([d,n])}});$('take').textContent=chosen.length;$('used').textContent=use;$('rel').textContent=chosen.length?(chosen.reduce((a,z)=>a+z[0][1],0)/chosen.length).toFixed(2):'—';$('list').innerHTML=data.slice(0,k).map((d,i)=>{let n=Math.ceil(d[2]*c),on=chosen.some(z=>z[0]===d);return `<article class="row" style="opacity:${on?1:.35}"><span class="tag">${on?'採用':'予算外'} · ${n} tok</span><b>#${i+1} ${d[0]}</b><div class="meter"><i style="width:${d[1]*100}%"></i></div><small>関連度 ${d[1].toFixed(2)} / 元の長さ ${d[2]} tokens</small></article>`}).join('')}draw();</script></body></html>
