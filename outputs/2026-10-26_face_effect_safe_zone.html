<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Face Effect Safe Zone</title>
<style>:root{color-scheme:dark;--bg:#080d18;--card:#121b2d;--line:#2c3b55;--ink:#e9f2ff;--muted:#9aacc6;--cyan:#76d7ff;--mint:#79efba;--warn:#ffbd6d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 15%,#153359,transparent 38%),var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui}.wrap{max-width:1060px;margin:auto;padding:28px 18px}h1{font-size:clamp(27px,5vw,46px);margin:0}p{color:var(--muted);margin:6px 0 22px}.grid{display:grid;grid-template-columns:275px 1fr;gap:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}}.panel{background:#121b2de8;border:1px solid var(--line);border-radius:16px;padding:16px}label{display:block;margin:0 0 17px}output{float:right;color:var(--cyan);font-variant-numeric:tabular-nums}input{width:100%;accent-color:var(--cyan)}button{border:1px solid #40709d;border-radius:9px;padding:9px 12px;background:#173758;color:var(--ink);cursor:pointer}.stage{height:370px;position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(145deg,#0a1426,#142946)}.gridline{position:absolute;inset:0;background:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:32px 32px}.safe{position:absolute;left:18%;right:18%;top:12%;bottom:12%;border:1px dashed #76d7ff77;border-radius:20px}.safe:after{content:'safe effect zone';position:absolute;top:7px;left:10px;color:#76d7ffaa;font-size:12px}.face{position:absolute;width:142px;height:178px;border:2px solid var(--mint);border-radius:48% 48% 43% 43%;transform:translate(-50%,-50%);box-shadow:0 0 35px #79efba33;transition:border-color .15s,opacity .15s}.eye{position:absolute;top:65px;width:18px;height:11px;border:2px solid var(--ink);border-radius:50%}.eye.l{left:32px}.eye.r{right:32px}.nose{position:absolute;top:88px;left:64px;height:22px;border-left:2px solid var(--ink);transform:skew(-14deg)}.mouth{position:absolute;left:45px;top:125px;width:48px;height:13px;border-bottom:2px solid var(--ink);border-radius:50%}.fx{position:absolute;left:48px;top:16px;width:46px;height:46px;border:2px solid var(--cyan);border-radius:50%;box-shadow:0 0 20px #76d7ff;transition:opacity .15s}.fx:after{content:'✦';font-size:28px;position:absolute;left:8px;top:2px;color:var(--cyan)}.tag{position:absolute;left:12px;bottom:12px;padding:6px 9px;background:#07101de0;border:1px solid var(--line);border-radius:7px;font:12px ui-monospace,monospace}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.stat{border:1px solid var(--line);padding:10px;border-radius:10px;color:var(--muted)}.stat b{display:block;color:var(--ink);font-size:19px}.note{margin-top:16px;padding:12px;border-left:3px solid var(--warn);background:#2c251d;color:#ffd8a2}.log{margin-top:12px;font:12px/1.5 ui-monospace,monospace;color:#b7c9e7;min-height:36px}</style>
<body><main class="wrap"><h1>Face Effect Safe Zone</h1><p>顔ランドマークの変換行列を受け取った想定で、推論値の質・画面端・結果年齢を別々に判定してエフェクト表示を抑制する自作の最小検証面です。MediaPipe APIやカメラは使用しません。</p><div class="grid"><section class="panel"><label>presence の最低値 <output id="presenceOut"></output><input id="presence" type="range" min="0.2" max="0.95" step=".05" value=".6"></label><label>tracking の最低値 <output id="trackingOut"></output><input id="tracking" type="range" min="0.2" max="0.95" step=".05" value=".55"></label><label>許容する結果年齢 <output id="ageOut"></output><input id="ageLimit" type="range" min="80" max="900" step="20" value="340"></label><label>顔の横移動 <output id="xOut"></output><input id="x" type="range" min="0" max="100" value="50"></label><button id="pulse">古い結果を1回注入</button><div class="note">エフェクトの表示可否は「顔がある」だけで決めず、信頼度・画面内の余白・結果の鮮度を別条件としてUIに出します。</div></section><section class="panel"><div class="stage" id="stage"><div class="gridline"></div><div class="safe"></div><div class="face" id="face"><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="mouth"></i><i class="fx" id="fx"></i></div><div class="tag" id="tag"></div></div><div class="stats"><div class="stat"><b id="pVal">—</b>presence</div><div class="stat"><b id="tVal">—</b>tracking</div><div class="stat"><b id="aVal">—</b>結果年齢</div></div><div class="log" id="log"></div></section></div></main><script>
const $=x=>document.getElementById(x), ids=['presence','tracking','ageLimit','x'];let tick=0,oldUntil=0,lastReason='';function n(id){return +$(id).value}function labels(){$('presenceOut').textContent=n('presence').toFixed(2);$('trackingOut').textContent=n('tracking').toFixed(2);$('ageOut').textContent=n('ageLimit')+' ms';$('xOut').textContent=n('x')+'%'}ids.forEach(id=>$(id).oninput=labels);labels();$('pulse').onclick=()=>oldUntil=performance.now()+900;
function frame(now){tick+=.035;const p=.58+.3*Math.sin(tick*1.13)+.06*Math.sin(tick*4.4),tr=.59+.28*Math.sin(tick*.77+1.7),age=now<oldUntil?510:Math.round(68+55*(1+Math.sin(tick*2.1)));const x=n('x'),y=51+Math.sin(tick*.8)*5;const margin=x>18&&x<82,quality=p>=n('presence')&&tr>=n('tracking'),fresh=age<=n('ageLimit'),ok=margin&&quality&&fresh;const reason=!margin?'画面端':!quality?'低信頼度':!fresh?'古い結果':'表示可';const face=$('face');face.style.left=x+'%';face.style.top=y+'%';face.style.transform=`translate(-50%,-50%) rotate(${Math.sin(tick)*9}deg) scale(${.92+p*.12})`;face.style.borderColor=ok?'#79efba':'#ffbd6d';face.style.opacity=quality?1:.48;$('fx').style.opacity=ok?1:.08;$('pVal').textContent=p.toFixed(2);$('tVal').textContent=tr.toFixed(2);$('aVal').textContent=age+' ms';$('tag').textContent=`matrix → x ${x.toFixed(0)}%, y ${y.toFixed(0)}% · ${reason}`;if(reason!==lastReason){$('log').textContent=`${new Date().toLocaleTimeString('ja-JP')}  ${reason}${ok?'：エフェクトを描画':'：枠だけを残す'}\n`+$('log').textContent;lastReason=reason}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
