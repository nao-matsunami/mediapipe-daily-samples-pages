<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gesture Action Guard</title>
<style>*{box-sizing:border-box}body{margin:0;background:#071a1a;color:#e9fbf8;font:16px/1.55 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:28px}.tag{color:#90eee1;border:1px solid #397d78;border-radius:99px;padding:3px 10px;font-size:12px}h1{font-size:clamp(35px,7vw,65px);line-height:.96;margin:16px 0}.sub,.muted{color:#afd2cd}.controls{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0}button{border:0;border-radius:13px;padding:11px 14px;background:#17433f;color:#dcfffa;font-weight:750;cursor:pointer}button:hover,button.sel{background:#8aeedc;color:#07302e}.board{background:#0d2b2a;border:1px solid #27605c;border-radius:19px;padding:20px}.meter{height:17px;background:#061312;border-radius:99px;overflow:hidden;margin:11px 0 19px}.meter i{display:block;height:100%;background:linear-gradient(90deg,#e59e70,#8cefdc);width:0;transition:.3s}.state{font-size:30px;color:#98f3e4;margin:4px 0}.log{min-height:90px;background:#061614;border-radius:13px;padding:13px;color:#bce3dc}.pill{display:inline-block;margin-right:8px;padding:3px 9px;border-radius:99px;background:#163c39;color:#a1eee3;font-size:13px}@media(max-width:600px){main{padding:20px}}</style>
<main><span class="tag">自作・ジェスチャーを即実行しない</span><h1>Gesture Action<br>Guard</h1><p class="sub">Gesture Recognizerの分類結果を、直接コマンドにせず「信頼度・連続フレーム・クールダウン」を通してから作用させる派生試作です。ボタンで仮想的な推論結果を流します。</p><div class="controls" id="controls"><button data-g="👍" data-c=".91">👍 再生</button><button data-g="✌️" data-c=".83">✌️ 次へ</button><button data-g="✊" data-c=".58">✊ 低信頼</button><button data-g="—" data-c="0">手なし</button><button id="reset">リセット</button></div><section class="board"><span class="pill">必要な連続数: 2</span><span class="pill">閾値: 0.75</span><span class="pill">クールダウン: 1.4秒</span><div class="state" id="state">待機中</div><div class="meter"><i id="meter"></i></div><div class="log" id="log">同じジェスチャーを続けて2回送ると、アクション候補になります。</div></section><p class="muted">次に足すなら: 実TaskのcategoryName・score・timestampをこのガードへ接続し、確認UI、手の左右、アクセシビリティ用の代替操作を加える。</p></main>
<script>const $=x=>document.getElementById(x);let last='',streak=0,coolUntil=0;function receive(g,c){const now=performance.now(),ok=c>=.75&&g!=='—';if(!ok){last='';streak=0;$('state').textContent='保留: 信頼度または手が不足';$('meter').style.width=(c*100)+'%';$('log').textContent=`${g} / ${Math.round(c*100)}% は実行しません。分類結果は入力であり、操作命令ではありません。`;return}streak=g===last?streak+1:1;last=g;$('meter').style.width=(streak/2*100)+'%';if(now<coolUntil){$('state').textContent='クールダウン中';$('log').textContent=`${g} は認識しましたが、連続実行を防ぐため待機します。`;return}if(streak<2){$('state').textContent='確認中: もう一度';$('log').textContent=`${g} / ${Math.round(c*100)}%。同じ結果をもう1フレーム確認します。`;return}coolUntil=now+1400;streak=0;$('state').textContent=`実行: ${g} の安全なアクション`;$('log').textContent=`二回連続・閾値通過・クールダウン外を満たしたため、ここで初めてUIアクションを発火できます。`;setTimeout(()=>{$('state').textContent='待機中';$('meter').style.width='0'},1450)}$('controls').onclick=e=>{const b=e.target.closest('[data-g]');if(b)receive(b.dataset.g,+b.dataset.c)};$('reset').onclick=()=>{last='';streak=0;coolUntil=0;$('state').textContent='待機中';$('meter').style.width='0';$('log').textContent='状態を初期化しました。'};</script></html>
