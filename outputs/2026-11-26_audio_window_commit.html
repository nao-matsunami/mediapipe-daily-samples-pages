<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Window Commit</title><style>:root{color-scheme:dark;--b:#10121c;--c:#202542;--l:#505a88;--t:#f3f4ff;--m:#b9bdd4;--a:#73efd0;--q:#f5b574;--r:#ff91ad}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#3d2f70,transparent 38%),var(--b);color:var(--t);font:16px/1.5 system-ui}main{max-width:1050px;margin:auto;padding:30px}.tag,label{font:700 12px ui-monospace;letter-spacing:.1em;color:var(--a)}h1{font-size:clamp(40px,7vw,70px);line-height:.9;margin:12px 0}.lead,.note{color:var(--m)}.grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.card{padding:18px;background:#202542e8;border:1px solid var(--l);border-radius:20px}label{display:block;margin:13px 0}input{width:100%;accent-color:var(--a)}button{width:100%;margin:5px 0;padding:11px;border:1px solid var(--l);border-radius:10px;background:#333c69;color:var(--t);font-weight:800;cursor:pointer}.state{font:800 17px ui-monospace;color:var(--a)}canvas{display:block;width:100%;height:auto;background:#10121c;border-radius:14px}.log{height:85px;overflow:auto;margin-top:12px;padding-top:8px;border-top:1px solid var(--l);font:12px/1.55 ui-monospace;color:var(--m)}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><div class="tag">ORIGINAL / AUDIO CHUNK BOUNDARY POLICY</div><h1>Audio Window<br>Commit</h1><p class="lead">連続音声を、十分な長さと静かな終端の両方が揃った時だけ確定します。短いノイズや区切りの悪い音を、そのまま命令にしないための派生試作です。</p><section class="grid"><aside class="card"><label>最短区間 <output id="mo">420</output> ms<input id="min" type="range" min="160" max="1000" step="20" value="420"></label><label>静音しきい値 <output id="to">0.22</output><input id="threshold" type="range" min=".05" max=".7" step=".01" value=".22"></label><button id="noise">短いノイズを追加</button><button id="phrase">音声フレーズを追加</button><button id="stop">静音を追加</button><button id="reset">RESET</button><p class="state" id="state">LISTENING · 0 ms</p></aside><section class="card"><canvas id="view" width="740" height="390"></canvas><div class="log" id="log"></div><p class="note">次に足すなら、実Audio Classifierまたは音声対応LLMの入力区間、VAD、音量/語境界、取消操作を接続し、確定した断片だけを字幕・コマンド・生成キューへ渡します。</p></section></section><script>const $=s=>document.querySelector(s),c=$('#view'),g=c.getContext('2d');let samples=[],commits=0,logs=[];function log(s){logs.unshift(new Date().toLocaleTimeString('ja-JP')+' '+s);logs=logs.slice(0,6);$('#log').innerHTML=logs.join('<br>')}function add(type){let n=type==='noise'?7:type==='phrase'?22:9;for(let i=0;i<n;i++){let v=type==='noise'?.35+Math.random()*.55:type==='phrase'?.35+Math.abs(Math.sin(i*.44))*.62:.03+Math.random()*.05;samples.push(v)}log(type==='stop'?'静音候補を追加':type==='noise'?'短いノイズを追加':'音声フレーズを追加');check()}function check(){let min=+$('#min').value,th=+$('#threshold').value,duration=samples.length*40,last=samples.slice(-5).reduce((a,b)=>a+b,0)/Math.min(5,samples.length);if(duration>=min&&last<th){commits++;log('COMMIT #'+commits+'：'+duration+'ms、終端 '+last.toFixed(2));samples=[]}else if(duration>=min)log('待機：終端 '+last.toFixed(2)+' > '+th.toFixed(2))}function draw(){let min=+$('#min').value,th=+$('#threshold').value,d=samples.length*40;$('#mo').textContent=min;$('#to').textContent=th.toFixed(2);$('#state').textContent='LISTENING · '+d+' ms · commits '+commits;g.fillStyle='#10121c';g.fillRect(0,0,740,390);g.strokeStyle='#505a88';g.lineWidth=1;g.beginPath();g.moveTo(25,285-th*190);g.lineTo(715,285-th*190);g.stroke();g.fillStyle='#b9bdd4';g.font='12px ui-monospace';g.fillText('silence threshold '+th.toFixed(2),28,278-th*190);samples.forEach((v,i)=>{let x=28+i*7,y=285-v*190;g.strokeStyle=v<th?'#73efd0':'#f5b574';g.lineWidth=4;g.beginPath();g.moveTo(x,285);g.lineTo(x,y);g.stroke()});g.fillStyle='#f3f4ff';g.font='700 18px ui-monospace';g.fillText(d>=min?'MIN WINDOW MET':'COLLECTING',28,46);g.fillStyle='#b9bdd4';g.font='13px ui-monospace';g.fillText('40ms blocks · no microphone is opened',28,72);g.fillStyle='#ff91ad';g.fillRect(28,330,Math.min(680,d/min*680),9);g.fillStyle='#b9bdd4';g.fillText('minimum window '+min+'ms',28,360);requestAnimationFrame(draw)}$('#noise').onclick=()=>add('noise');$('#phrase').onclick=()=>add('phrase');$('#stop').onclick=()=>add('stop');$('#reset').onclick=()=>{samples=[];commits=0;log('reset: buffered audio cleared')};requestAnimationFrame(draw);</script></main></html>
