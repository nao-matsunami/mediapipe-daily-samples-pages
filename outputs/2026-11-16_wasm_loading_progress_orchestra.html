<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WASM Loading Progress Orchestra</title><style>
:root{color-scheme:dark;--ink:#07141d;--card:#0d2635;--mint:#98f7c9;--sky:#82d5ff;--dim:#9ab6c4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 6%,#17495e,#07141d 58%);color:#edfbff;font:16px/1.5 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:28px}.tag{font:700 12px ui-monospace;color:var(--mint);letter-spacing:.12em}h1{font-size:clamp(39px,7vw,74px);line-height:.9;margin:12px 0}.lead{max-width:760px;color:#b8d2de}.grid{display:grid;grid-template-columns:300px 1fr;gap:16px}.card{background:#0c2433d9;border:1px solid #285b70;border-radius:20px;padding:18px}button{border:0;border-radius:10px;padding:10px 13px;margin:3px;background:var(--mint);color:#08212b;font-weight:800;cursor:pointer}button.alt{background:#1a4052;color:#e5f9ff}.meter{height:16px;background:#06131d;border-radius:9px;overflow:hidden;margin:18px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--sky));transition:width .18s}.row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #245064;font:13px ui-monospace}.stage{height:294px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(circle,#143f54,#06131d 68%);border-radius:14px}.orb{width:138px;height:138px;border:2px solid var(--mint);border-radius:50%;box-shadow:0 0 35px #8cf5d066;position:relative}.orb:after{content:"";position:absolute;inset:17px;border:2px solid var(--sky);border-radius:50%;animation:spin 2.2s linear infinite}.orb.pause:after{animation-play-state:paused}.pulse{position:absolute;border:1px solid #88e8ff55;border-radius:50%;animation:out 1.8s ease-out infinite}.pulse:nth-child(2){animation-delay:.6s}.pulse:nth-child(3){animation-delay:1.2s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes out{from{width:60px;height:60px;opacity:1}to{width:390px;height:390px;opacity:0}}.hint{font-size:14px;color:var(--dim)}@media(max-width:720px){.grid{grid-template-columns:1fr}}
</style><main><div class="tag">ORIGINAL / WEB TASKS STARTUP CONTRACT</div><h1>Loading Progress<br>Orchestra</h1><p class="lead">Web Tasks の WASM・モデル読み込みを「待機」だけにせず、何を待っているかを段階と進捗で見せる最小試作です。実装時は公式 SDK の進捗コールバックに置き換えます。</p><section class="grid"><aside class="card"><b>起動を演奏する</b><p><button id="start">読み込み開始</button><button class="alt" id="slow">低速回線</button><button class="alt" id="fail">失敗を試す</button></p><div class="meter"><div class="bar" id="bar"></div></div><div class="row"><span>phase</span><b id="phase">IDLE</b></div><div class="row"><span>progress</span><b id="pct">0%</b></div><div class="row"><span>next UI</span><b id="next">開始可能</b></div><p class="hint" id="note">モデルの取得と初期化を別々に見せると、再試行対象と待ち時間の意味が明確になります。</p></aside><section class="card"><div class="stage"><i class="pulse"></i><i class="pulse"></i><i class="pulse"></i><div class="orb pause" id="orb"></div></div><p class="hint">これは自作の状態機械可視化です。MediaPipe のネットワークやモデルは読み込みません。</p></section></section><script>
const $=s=>document.querySelector(s),bar=$('#bar'),phase=$('#phase'),pct=$('#pct'),next=$('#next'),note=$('#note'),orb=$('#orb');let timer,rate=4;const steps=[['FETCH_WASM',28,'WASM を取得中'],['COMPILE',53,'実行環境を初期化中'],['FETCH_MODEL',82,'モデルを取得中'],['READY',100,'カメラを開始可能']];function stop(){clearInterval(timer);orb.classList.add('pause')}function paint(n,label){bar.style.width=n+'%';pct.textContent=n+'%';phase.textContent=label;next.textContent=label==='READY'?'推論を開始':label==='ERROR'?'再試行':'待機'}function start(){stop();let n=0,i=0;orb.classList.remove('pause');paint(0,'FETCH_WASM');timer=setInterval(()=>{n+=rate;if(i<steps.length&&n>=steps[i][1]){n=steps[i][1];paint(n,steps[i][0]);note.textContent=steps[i][2];i++;if(i===steps.length){stop();note.textContent='準備完了。ここで createFromOptions とカメラ開始を安全に分けられます。'}}else paint(n,steps[Math.max(0,i)][0])},180)}$('#start').onclick=()=>{rate=4;start()};$('#slow').onclick=()=>{rate=1;start();note.textContent='低速回線: 進捗を隠さず、キャンセルや再試行の余地を残します。'};$('#fail').onclick=()=>{stop();paint(64,'ERROR');note.textContent='失敗は曖昧なスピナーで終えず、WASMかモデルかを示して再試行へつなげます。'};
</script></main></html>
