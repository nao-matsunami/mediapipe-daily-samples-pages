<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timestamp Admission Gate</title><style>*{box-sizing:border-box}body{margin:0;background:#071821;color:#e9fbff;font:16px/1.5 system-ui,sans-serif}main{max-width:1060px;margin:auto;padding:28px}.tag{color:#92e9ff;font-size:13px;letter-spacing:.08em}h1{font-size:clamp(42px,8vw,76px);line-height:.9;margin:12px 0}.muted{color:#a7c5ce}.grid{display:grid;grid-template-columns:330px 1fr;gap:16px}.card{background:#0d2632;border:1px solid #1e5365;border-radius:18px;padding:18px}button{cursor:pointer;border:0;border-radius:11px;padding:10px 13px;margin:3px;background:#8fe8ff;color:#06202a;font-weight:800}.stage{position:relative;height:370px;overflow:hidden;border-radius:14px;background:radial-gradient(circle at 60% 38%,#1c6073,#09202b 57%,#051218)}.gate{position:absolute;left:50%;top:0;bottom:0;width:4px;background:#ffcf70;box-shadow:0 0 26px #ffcf70}.frame{position:absolute;width:78px;height:56px;border:2px solid #74e6fe;border-radius:12px;background:#153c4c;display:grid;place-items:center;font:700 12px ui-monospace;transition:.6s}.frame.reject{border-color:#ff8d9f;background:#482332;color:#ffd9df}.frame.accept{border-color:#82f4c8;background:#12483d;color:#d9ffed}.meter{height:10px;border-radius:999px;background:#06141a;overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#82f4c8,#8fe8ff);transition:.3s}.rows{display:grid;gap:8px}.row{display:flex;justify-content:space-between;background:#091b24;border-radius:9px;padding:8px 10px;font:13px ui-monospace}.log{min-height:100px;font:13px/1.55 ui-monospace;color:#aed3dd}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><span class="tag">自作 / VIDEO の時刻受理を可視化</span><h1>Timestamp<br>Admission Gate</h1><p class="muted">MediaPipe Tasks Web の VIDEO 呼び出しで使う単調増加タイムスタンプを、到着順と分けて考える最小試作です。カメラ・モデルなしで「古いフレームを通さない」ルールを触れます。</p><section class="grid"><aside class="card"><h2>入力列</h2><p><button id="next">次のフレーム</button><button id="late">古いフレームを混ぜる</button></p><label><input id="strict" type="checkbox" checked> 単調増加ゲートを有効にする</label><div class="rows" style="margin-top:18px"><div class="row"><span>最後に受理した時刻</span><b id="last">—</b></div><div class="row"><span>受理 / 破棄</span><b><i id="ok">0</i> / <i id="drop">0</i></b></div></div><p class="muted">実装では video.currentTime の変化を確認し、<code>performance.now()</code> などの一方向に進む時刻を渡すのが基本です。</p></aside><section class="card"><div class="stage" id="stage"><div class="gate"></div></div><div class="meter"><i id="meter"></i></div><p class="log" id="log">フレームを送ると、ゲートが時刻を検査します。</p></section></section><script>const $=id=>document.getElementById(id);let t=1000,accepted=-1,ok=0,drop=0,n=0;function send(stamp){n++;const pass=!$('strict').checked||stamp>accepted;const f=document.createElement('div');f.className='frame '+(pass?'accept':'reject');f.textContent=stamp+' ms';f.style.left='8%';f.style.top=(35+(n%5)*58)+'px';$('stage').append(f);requestAnimationFrame(()=>f.style.left=pass?'57%':'37%');if(pass){accepted=stamp;ok++;$('last').textContent=stamp+' ms'}else drop++;$('ok').textContent=ok;$('drop').textContent=drop;$('meter').style.width=Math.min(100,ok*9)+'%';$('log').textContent=`frame ${n}: ${stamp} ms → ${pass?'受理。推論へ進む':'破棄。既に '+accepted+' ms を受理済み'}${$('strict').checked?'':'（ゲートOFF）'}`;setTimeout(()=>f.remove(),2400)}$('next').onclick=()=>{t+=Math.round(20+Math.random()*35);send(t)};$('late').onclick=()=>send(Math.max(0,t-Math.round(35+Math.random()*120)));</script></main></html>
