<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gesture Consensus Gate</title><style>:root{color-scheme:dark;--bg:#08111f;--card:#102038;--line:#385172;--ink:#f2f7ff;--muted:#a9bbd4;--violet:#bda7ff;--mint:#99ffd1;--amber:#ffd28b;--rose:#ff9eb8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,#263665,transparent 38%),var(--bg);color:var(--ink);font:16px/1.5 system-ui}main{max-width:1000px;margin:auto;padding:28px}.tag{font:700 12px ui-monospace;letter-spacing:.14em;color:var(--violet)}h1{font-size:clamp(38px,7vw,72px);line-height:.9;margin:12px 0}.lead,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:250px 1fr;gap:16px}.card{background:#102038df;border:1px solid var(--line);border-radius:20px;padding:17px}label{display:block;margin:15px 0;font:13px ui-monospace;color:#d1ddf4}input{width:100%;accent-color:var(--violet)}button{width:100%;margin-top:8px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#182d4d;color:var(--ink);font:700 13px ui-monospace;cursor:pointer}canvas{touch-action:none;width:100%;height:auto;display:block;border-radius:14px;background:#07101c}.state{font:700 23px ui-monospace;margin:.5em 0;color:var(--mint)}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main><div class="tag">ORIGINAL / GESTURE RECOGNIZER CONTRACT</div><h1>Gesture<br>Consensus Gate</h1><p class="lead">分類スコアが一瞬しきい値を越えただけでは実行せず、連続した合意フレームで操作を開く最小試作です。キャンバス上を動かして、揺れる擬似スコアを観察します。</p><section class="grid"><aside class="card"><label>必要な連続フレーム <output id="needO">4</output><input id="need" type="range" min="1" max="12" value="4"></label><label>スコアしきい値 <output id="thresholdO">0.72</output><input id="threshold" type="range" min="0.35" max=".95" step=".01" value=".72"></label><label>擬似ノイズ <output id="noiseO">0.18</output><input id="noise" type="range" min="0" max=".45" step=".01" value=".18"></label><button id="reset">RESET COUNTER</button><p class="state" id="state">WAITING</p><p class="muted" id="note">ポインタを左右に動かすと、スコアの基準値が変わります。</p></aside><section class="card"><canvas id="view" width="680" height="420"></canvas><p class="muted">次に足すなら、Gesture Recognizer のカテゴリ名・score・handedness と時刻を受け、同じカテゴリだけを連続カウントします。実運用ではクールダウン、手の入れ替わり、None の扱いもログ化します。</p></section></section><script>const $=s=>document.querySelector(s),c=$('#view'),g=c.getContext('2d');let x=.5,streak=0,actions=0,armed=false,history=[],last=0;
function setPointer(e){let r=c.getBoundingClientRect();x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))}c.addEventListener('pointermove',setPointer);c.addEventListener('pointerdown',setPointer);$('#reset').onclick=()=>{streak=0;actions=0;armed=false;history=[]};
function frame(t){let need=+$('#need').value,th=+$('#threshold').value,n=+$('#noise').value;$('#needO').textContent=need;$('#thresholdO').textContent=th.toFixed(2);$('#noiseO').textContent=n.toFixed(2);if(t-last>78){last=t;let base=.42+x*.47;let score=Math.max(0,Math.min(1,base+(Math.random()-.5)*n*2));let accepted=score>=th;streak=accepted?streak+1:0;if(streak>=need&&!armed){armed=true;actions++}if(!accepted)armed=false;history.push({score,accepted});if(history.length>82)history.shift()}g.fillStyle='#07101c';g.fillRect(0,0,680,420);g.strokeStyle='#385172';g.lineWidth=1;for(let y=70;y<350;y+=70){g.beginPath();g.moveTo(45,y);g.lineTo(650,y);g.stroke()}let y=350-th*250;g.strokeStyle='#ffd28b';g.setLineDash([6,7]);g.beginPath();g.moveTo(45,y);g.lineTo(650,y);g.stroke();g.setLineDash([]);g.fillStyle='#ffd28b';g.font='12px ui-monospace';g.fillText('threshold '+th.toFixed(2),48,y-8);g.beginPath();history.forEach((v,i)=>{let px=45+i*7.35,py=350-v.score*250;i?g.lineTo(px,py):g.moveTo(px,py)});g.strokeStyle='#bda7ff';g.lineWidth=3;g.stroke();let latest=history.at(-1),fill=armed?'#99ffd1':latest?.accepted?'#bda7ff':'#ff9eb8';g.fillStyle=fill;g.beginPath();g.arc(600,104,42,0,7);g.fill();g.fillStyle='#07101c';g.font='700 13px ui-monospace';g.textAlign='center';g.fillText(armed?'ACT':'HOLD',600,109);g.textAlign='start';g.fillStyle='#f2f7ff';g.font='700 20px ui-monospace';g.fillText('consensus '+streak+' / '+need,45,390);g.fillStyle='#a9bbd4';g.font='13px ui-monospace';g.fillText('actions '+actions+'  |  latest '+(latest?latest.score.toFixed(2):'--'),360,390);$('#state').textContent=armed?'ACTION READY':latest?.accepted?'COUNTING '+streak+'/'+need:'WAITING';$('#state').style.color=fill;requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></main></html>
