<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monotonic Timestamp Gate</title><style>
:root{color-scheme:dark;--ink:#e9f4ff;--muted:#90a5ba;--card:#122033;--green:#56edba;--amber:#ffc05c;--red:#ff7185}*{box-sizing:border-box}body{margin:0;background:#08111f;color:var(--ink);font:15px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.app{width:min(960px,94vw);padding:24px}h1{font-size:clamp(24px,4vw,40px);margin:0}p{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}.card{background:var(--card);border:1px solid #243953;border-radius:16px;padding:16px}.stage{height:250px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 50%,#183a54,#091521)}.lane{position:absolute;height:1px;background:#34526b;left:6%;right:6%}.lane:nth-child(1){top:25%}.lane:nth-child(2){top:50%}.lane:nth-child(3){top:75%}.dot{position:absolute;width:17px;height:17px;border-radius:50%;transform:translate(-50%,-50%);transition:.18s linear;box-shadow:0 0 20px currentColor}.good{color:var(--green);background:var(--green)}.drop{color:var(--red);background:var(--red)}.pending{color:var(--amber);background:var(--amber)}button,input{accent-color:var(--green)}button{background:#1e3850;color:var(--ink);border:1px solid #45637d;padding:9px 12px;border-radius:9px;cursor:pointer}label{display:flex;gap:10px;align-items:center;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:10px;border-radius:10px;background:#0b1727}.stat b{display:block;font-size:24px}ol{padding-left:22px;max-height:250px;overflow:auto;margin-bottom:0}.ok{color:var(--green)}.bad{color:var(--red)}small{color:var(--muted)}
</style><main class="app"><h1>Monotonic Timestamp Gate</h1><p>MediaPipe Tasks の video/live 入力を想定し、到着順ではなく単調増加する timestamp をゲートする自作ミニ試作。緑は採用、赤は古い入力として破棄、橙は処理中です。</p><div class="grid"><section class="card"><div class="stage" id="stage"><i class="lane"></i><i class="lane"></i><i class="lane"></i></div><label>乱れの確率 <input id="jitter" type="range" min="0" max="75" value="22"> <output id="jv">22%</output></label><label>推論時間 <input id="cost" type="range" min="80" max="900" value="380"> <output id="cv">380ms</output></label><button id="run">再生 / 停止</button> <button id="burst">逆順バーストを注入</button></section><section class="card"><div class="stats"><div class="stat"><small>採用</small><b id="accepted">0</b></div><div class="stat"><small>古い入力を破棄</small><b id="discarded">0</b></div><div class="stat"><small>最後の timestamp</small><b id="last">—</b></div></div><h3>イベント</h3><ol id="log"></ol></section></div><p><small>次に足すなら：実際の <code>video.currentTime * 1000</code> と Task callback の結果年齢を同じログへ入れ、カメラ切替時は generation token も一緒に更新する。</small></p></main><script>
const $=s=>document.querySelector(s),stage=$('#stage'),log=$('#log');let timer,seq=0,last=-1,accepted=0,discarded=0;const add=(t,cls)=>{let li=document.createElement('li');li.className=cls;li.textContent=t;log.prepend(li);while(log.children.length>18)log.lastChild.remove()};function show(x,cls,lane){let d=document.createElement('i');d.className='dot '+cls;d.style.left=(8+(x%100)*.84)+'%';d.style.top=(25+lane*25)+'%';stage.append(d);setTimeout(()=>d.remove(),1100)}function receive(ts){const cost=+$('#cost').value;show(ts,'pending',0);setTimeout(()=>{if(ts<=last){discarded++;$('#discarded').textContent=discarded;add('破棄 '+ts+'ms — last '+last+'ms','bad');show(ts,'drop',2)}else{last=ts;accepted++;$('#accepted').textContent=accepted;$('#last').textContent=ts;add('採用 '+ts+'ms（単調増加）','ok');show(ts,'good',1)}},cost)}function tick(){seq+=33;let ts=seq;if(Math.random()*100 < +$('#jitter').value)ts-=33*(1+Math.floor(Math.random()*5));receive(Math.max(0,ts))}$('#run').onclick=()=>{if(timer){clearInterval(timer);timer=0;$('#run').textContent='再生 / 停止'}else{timer=setInterval(tick,160);$('#run').textContent='停止'}};$('#burst').onclick=()=>{const base=seq+300;[base,base-120,base-240,base+40].forEach((t,i)=>setTimeout(()=>receive(t),i*80));seq=base+40};[['jitter','jv','%'],['cost','cv','ms']].forEach(([a,b,u])=>$('#'+a).oninput=e=>$('#'+b).textContent=e.target.value+u);add('準備完了。再生で合成フレームを送ります。','ok');
</script>
