<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multi-hand Identity Rail</title><style>*{box-sizing:border-box}body{margin:0;background:#101027;color:#f4f1ff;font:16px/1.55 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:28px}.tag{color:#c9b8ff;border:1px solid #7359bd;border-radius:99px;padding:4px 10px;font-size:12px}h1{font-size:clamp(40px,8vw,76px);line-height:.88;margin:18px 0}.muted{color:#bbb5d5}.grid{display:grid;grid-template-columns:360px 1fr;gap:16px}.card{background:#1b1a3b;border:1px solid #393170;border-radius:20px;padding:18px}button,input{accent-color:#ab92ff}button{border:0;border-radius:12px;padding:10px 14px;background:#d9d0ff;color:#21194c;font-weight:800;margin:4px;cursor:pointer}.stage{min-height:390px;position:relative;overflow:hidden;border-radius:15px;background:radial-gradient(circle at 50% 50%,#343075,#161631 62%,#0b0b1e)}.lane{position:absolute;left:9%;right:9%;height:118px;border-radius:18px;background:#211f50;border:1px solid #4c4592}.lane b{position:absolute;left:14px;top:12px;color:#bdb1ff}.hand{position:absolute;right:32px;top:32px;width:65px;height:67px;border:3px solid #ffd38f;border-radius:32px 32px 17px 17px;transition:.35s}.hand:before{content:'';position:absolute;left:27px;top:-39px;height:44px;border-left:13px solid #ffd38f;border-radius:20px}.dot{position:absolute;width:15px;height:15px;background:#78edc0;border-radius:50%;box-shadow:0 0 18px #78edc0}.timeline{height:12px;border-radius:99px;background:#12122c;margin:16px 0;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#78edc0,#c896ff);transition:.25s}.rows{display:grid;gap:8px}.row{background:#12122c;border-radius:10px;padding:9px 11px;display:flex;justify-content:space-between;gap:12px}.row b{color:#d6ccff;text-align:right}.event{min-height:95px;font-family:ui-monospace,monospace;font-size:13px;color:#bcb6d8}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style><main><span class="tag">自作・複数手の表示アイデンティティを守る</span><h1>Multi-hand<br>Identity Rail</h1><p class="muted">複数手の非同期結果を「手ごとの世代番号」で受理する最小試作。カメラ・モデルは使わず、到着順が入れ替わる結果を模擬します。</p><section class="grid"><div class="card"><h2>到着条件</h2><label>手 A / B の遅延差 <input id="delay" type="range" min="0" max="900" value="420"> <b id="delayN">420ms</b></label><p><button id="burst">2手を更新する</button><button id="swap">遅い手を入替える</button></p><p><label><input id="guard" type="checkbox" checked> 手ごとの世代ガードを使う</label></p><div class="rows"><div class="row"><span>正しく描画</span><b id="accepted">0</b></div><div class="row"><span>古い結果を破棄</span><b id="stale">0</b></div><div class="row"><span>誤って上書き</span><b id="wrong">0</b></div></div><p class="muted">これは公開Issueの未解決報告を再現するものではありません。実装側で「誰の、何世代目の結果か」を明示する設計実験です。</p></div><div class="card"><div class="stage"><div class="lane" style="top:55px"><b>手 A — 現在世代 <span id="ga">0</span></b><i class="hand" id="ha"></i></div><div class="lane" style="top:215px"><b>手 B — 現在世代 <span id="gb">0</span></b><i class="hand" id="hb"></i></div><i class="dot" id="dot"></i></div><div class="timeline"><div class="fill" id="fill"></div></div><div class="event" id="event">「2手を更新する」で非同期到着を開始します。</div></div></section></main><script>const $=x=>document.getElementById(x);let g={A:0,B:0},shown={A:0,B:0},slow='B',n={accepted:0,stale:0,wrong:0};function draw(){for(const k in n)$(k).textContent=n[k];$('ga').textContent=g.A;$('gb').textContent=g.B;$('ha').style.opacity=shown.A===g.A?'1':'.25';$('hb').style.opacity=shown.B===g.B?'1':'.25'}function arrive(hand,gen,ms){setTimeout(()=>{let ok=!$('guard').checked||gen===g[hand];if(ok){shown[hand]=gen;n.accepted++;if(gen!==g[hand])n.wrong++;$('event').textContent=`${hand} の結果 gen ${gen} が ${ms}ms 後に到着 → ${gen===g[hand]?'表示':'古いまま表示（ガードOFF）'}`}else{n.stale++;$('event').textContent=`${hand} の結果 gen ${gen} は ${ms}ms 後に到着 → 最新 gen ${g[hand]} と違うため破棄`}$('dot').style.top=(hand==='A'?95:255)+'px';$('dot').style.left='82%';setTimeout(()=>{$('dot').style.left='12%'},220);draw()},ms)}function burst(){let d=+$('delay').value;for(const h of ['A','B']){let old=++g[h];arrive(h,old,h===slow?d:90)}setTimeout(()=>{let h=slow;let next=++g[h];arrive(h,next,110)},150);$('fill').style.width='100%';setTimeout(()=>{$('fill').style.width='0'},Math.max(d,300)+180);draw()}$('delay').oninput=e=>{$('delayN').textContent=e.target.value+'ms'};$('burst').onclick=burst;$('swap').onclick=()=>{slow=slow==='A'?'B':'A';$('event').textContent='遅い到着を手 '+slow+' に切り替えました。'};draw();</script></html>
