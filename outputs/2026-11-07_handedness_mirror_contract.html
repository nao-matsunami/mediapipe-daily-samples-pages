<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Handedness Mirror Contract</title>
<style>*{box-sizing:border-box}body{margin:0;background:#100d20;color:#f5f0ff;font:16px/1.55 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:28px}.tag{display:inline-block;border:1px solid #7a61ad;border-radius:99px;padding:3px 10px;color:#d5c1ff;font-size:12px}h1{font-size:clamp(34px,7vw,66px);line-height:.95;margin:16px 0}.sub,.muted{color:#c9c0dd}.grid{display:grid;grid-template-columns:.86fr 1.14fr;gap:16px;margin-top:24px}.card{background:#201a36;border:1px solid #463568;border-radius:19px;padding:18px}button{border:0;border-radius:12px;padding:11px 15px;background:#d7bcff;color:#211438;font-weight:800;cursor:pointer;margin:4px 5px 4px 0}button.on{background:#85f0cb}.stage{height:330px;position:relative;overflow:hidden;border-radius:16px;background:radial-gradient(circle at 50% 80%,#4a2b78,#211934 53%,#100d20)}.center{position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed #a593cd}.hand{position:absolute;top:88px;width:115px;height:155px;border-radius:58% 42% 39% 42%;background:linear-gradient(135deg,#ffb5cc,#f477ad);box-shadow:0 0 30px #ec78ae;transform-origin:50% 80%;transition:.35s}.hand:before{content:'';position:absolute;width:32px;height:95px;border-radius:20px;background:#ffb5cc;left:18px;top:-57px;transform:rotate(-20deg)}.hand:after{content:'✋';position:absolute;font-size:98px;left:4px;top:13px;filter:saturate(.3) brightness(1.5);opacity:.78}.label{position:absolute;top:31px;padding:6px 10px;border-radius:99px;background:#10101b99;border:1px solid #c9b8ee;color:#fff;font-weight:800}.result{font-size:27px;color:#9bf5d4;margin:8px 0}.rows{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:11px;background:#151126}.row b{color:#d7c5ff}.good{color:#8df1c9}.warn{color:#ffd18f}@media(max-width:720px){.grid{grid-template-columns:1fr}.stage{height:280px}}</style>
<main><span class="tag">自作・表示の鏡像と推論ラベルを分離する</span><h1>Handedness<br>Mirror Contract</h1><p class="sub">「画面で左に見える手」と「入力画像に対して推論された Left / Right」は同じとは限りません。カメラ前の人、プレビューの鏡像、Taskへの入力、UI行動の4つを小さな契約として可視化します。モデルやカメラは使いません。</p><section class="grid"><div class="card"><h2>操作</h2><p><button id="person">人物の右手を上げる</button><button id="swap">人物の左手を上げる</button></p><p><button id="mirror" class="on">プレビューを鏡像表示</button><button id="flip">入力フレームも反転</button></p><p class="muted">推論ラベルは入力フレーム基準。鏡像CSSは見た目だけ、入力反転はラベルの意味も反転させます。</p><div class="rows"><div class="row"><span>人物の解剖学的な手</span><b id="anatomy">右手</b></div><div class="row"><span>Taskへ渡す入力</span><b id="input">そのまま</b></div><div class="row"><span>画面上の見える位置</span><b id="screen">左側</b></div><div class="row"><span>安全なUI文言</span><b id="copy">「画面左の手」</b></div></div></div><div class="card"><div class="stage" id="stage"><i class="center"></i><i class="hand" id="hand"></i><span class="label" id="spot"></span></div><p class="result" id="result"></p><p class="muted" id="reason"></p></div></section></main>
<script>const $=x=>document.getElementById(x);let anatomical='右手',mirrored=true,inputFlip=false;function render(){const inference=inputFlip?(anatomical==='右手'?'Left':'Right'):(anatomical==='右手'?'Right':'Left');const shownLeft=(anatomical==='右手')!==mirrored;const side=shownLeft?'左側':'右側';$('hand').style.left=shownLeft?'14%':'63%';$('hand').style.transform=`scaleX(${mirrored?-1:1})`;$('spot').textContent='画面 '+side;$('spot').style.left=shownLeft?'10%':'64%';$('anatomy').textContent=anatomical;$('input').textContent=inputFlip?'反転済み':'そのまま';$('screen').textContent=side;$('result').textContent=`Task の handedness: ${inference}`;$('reason').innerHTML=inputFlip?'<span class="warn">入力そのものを反転したので、TaskのLeft / Rightも入れ替わります。</span> UIは「画面側」と「入力側」を明記します。':'<span class="good">CSS鏡像だけなら推論入力は変わりません。</span> 見た目の左右とTaskラベルを別の値として扱えます。';$('copy').textContent=`「画面${shownLeft?'左':'右'}の手」`;$('mirror').classList.toggle('on',mirrored);$('flip').classList.toggle('on',inputFlip)}$('person').onclick=()=>{anatomical='右手';render()};$('swap').onclick=()=>{anatomical='左手';render()};$('mirror').onclick=()=>{mirrored=!mirrored;render()};$('flip').onclick=()=>{inputFlip=!inputFlip;render()};render();</script></html>
