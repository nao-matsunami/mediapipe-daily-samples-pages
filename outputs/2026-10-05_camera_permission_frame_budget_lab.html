<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera Permission Frame Budget Lab</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; background: #08100f; color: #f5fbf7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, rgba(58, 175, 169, .2), transparent 34%), linear-gradient(315deg, rgba(238, 164, 92, .16), transparent 44%), #08100f; }
    main { width: min(1180px, 100%); margin: 0 auto; padding: 22px 16px 42px; }
    header { display: grid; gap: 8px; padding-bottom: 16px; border-bottom: 1px solid rgba(245, 251, 247, .15); }
    h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.65rem); line-height: 1.08; letter-spacing: 0; }
    h2 { margin: 0 0 8px; font-size: 1rem; color: #6bd6c8; letter-spacing: 0; }
    p { margin: 0; color: #c6d5cf; line-height: 1.65; }
    button, input, select { font: inherit; }
    button { min-height: 40px; border: 1px solid rgba(245, 251, 247, .24); background: #f5fbf7; color: #08100f; padding: 8px 12px; cursor: pointer; }
    button.secondary, select { background: rgba(8, 16, 15, .95); color: #f5fbf7; }
    label { display: grid; gap: 6px; color: #edf7f3; font-size: .92rem; }
    input[type="range"] { width: 100%; accent-color: #6bd6c8; }
    .toolbar, .panel, .board, .log { border: 1px solid rgba(245, 251, 247, .14); background: rgba(8, 16, 15, .87); }
    .toolbar { display: grid; grid-template-columns: repeat(5, minmax(135px, 1fr)); gap: 12px; margin-top: 16px; padding: 14px; }
    .layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 14px; margin-top: 14px; }
    .panel, .board { padding: 14px; }
    .stack { display: grid; gap: 10px; }
    .status { border: 1px solid rgba(245, 251, 247, .13); background: #101a19; padding: 11px; min-height: 78px; }
    .status strong { display: block; color: #f5fbf7; margin-top: 4px; font-size: 1.18rem; font-variant-numeric: tabular-nums; }
    .chip { display: inline-block; border: 1px solid rgba(245, 251, 247, .22); padding: 5px 8px; margin: 7px 7px 0 0; font-size: .78rem; }
    .pass { border-color: rgba(107, 214, 200, .8); background: rgba(107, 214, 200, .14); }
    .warn { border-color: rgba(238, 164, 92, .82); background: rgba(238, 164, 92, .15); }
    .bad { border-color: rgba(220, 91, 111, .86); background: rgba(220, 91, 111, .14); }
    .value { color: #eea45c; font-variant-numeric: tabular-nums; }
    .scene { position: relative; min-height: 390px; border: 1px solid rgba(245, 251, 247, .14); background: #050807; overflow: hidden; }
    canvas { width: 100%; height: 390px; display: block; }
    .overlay { position: absolute; inset: 12px; pointer-events: none; display: grid; align-content: end; }
    .timeline { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; height: 52px; align-items: end; }
    .bar { background: #6bd6c8; min-height: 3px; }
    .bar.skip { background: #eea45c; }
    .bar.block { background: #dc5b6f; }
    .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
    .log { margin-top: 14px; padding: 12px; height: 110px; overflow: auto; white-space: pre-wrap; color: #e9f3ef; font: .8rem ui-monospace, SFMono-Regular, Menlo, monospace; }
    @media (max-width: 920px) { .toolbar, .layout, .cards { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Camera Permission Frame Budget Lab</h1>
    <p>MediaPipe Gesture Recognizer / Hand Landmarker をカメラに接続する前に、secure context、permission、resolution、FPS、同期推論時間、worker 化の必要度を見積もる自作ミニ試作です。</p>
  </header>

  <section class="toolbar">
    <label>Task <select id="task"><option>Hand Landmarker</option><option>Gesture Recognizer</option><option>Holistic Landmarker</option></select><span class="value">Vision Tasks</span></label>
    <label>Resolution <input id="pixels" type="range" min="360" max="1440" step="120" value="720"><span id="pixelsValue" class="value">720p</span></label>
    <label>Target FPS <input id="fps" type="range" min="12" max="60" step="3" value="30"><span id="fpsValue" class="value">30</span></label>
    <label>Infer cost <input id="cost" type="range" min="4" max="70" value="22"><span id="costValue" class="value">22 ms</span></label>
    <label>Tracking confidence <input id="tracking" type="range" min="0" max="100" value="58"><span id="trackingValue" class="value">0.58</span></label>
    <button id="probe">Run preflight</button>
    <button id="permission" class="secondary">Check permission</button>
    <button id="loop" class="secondary">Start synthetic camera</button>
    <button id="worker" class="secondary">Toggle worker plan</button>
  </section>

  <div class="layout">
    <aside class="panel">
      <h2>Preflight gates</h2>
      <div id="chips"></div>
      <div class="stack" id="status"></div>
    </aside>
    <section class="board">
      <h2>Synthetic camera + blocking budget</h2>
      <div class="scene">
        <canvas id="view" width="840" height="390"></canvas>
        <div class="overlay"><div class="timeline" id="timeline"></div></div>
      </div>
      <div class="cards" id="cards"></div>
    </section>
  </div>
  <div class="log" id="log"></div>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);
const ctx = $("view").getContext("2d");
const state = { loop: false, worker: false, permission: "unknown", tick: 0, history: [] };
const taskCost = { "Hand Landmarker": 1, "Gesture Recognizer": 1.18, "Holistic Landmarker": 2.15 };

function label() {
  $("pixelsValue").textContent = `${$("pixels").value}p`;
  $("fpsValue").textContent = $("fps").value;
  $("costValue").textContent = `${$("cost").value} ms`;
  $("trackingValue").textContent = (Number($("tracking").value) / 100).toFixed(2);
}

function log(message) {
  const stamp = new Date().toLocaleTimeString("ja-JP", { hour12: false });
  $("log").textContent = `${stamp} ${message}\n${$("log").textContent}`.slice(0, 2200);
}

async function checkPermission() {
  if (!("mediaDevices" in navigator)) {
    state.permission = "no mediaDevices";
  } else if (!("permissions" in navigator)) {
    state.permission = "api unavailable";
  } else {
    try {
      const result = await navigator.permissions.query({ name: "camera" });
      state.permission = result.state;
    } catch {
      state.permission = "query blocked";
    }
  }
  log(`camera permission: ${state.permission}`);
  render();
}

function estimate() {
  const task = $("task").value;
  const pixels = Number($("pixels").value);
  const fps = Number($("fps").value);
  const cost = Number($("cost").value) * taskCost[task] * (pixels / 720);
  const budget = 1000 / fps;
  const slack = budget - cost;
  const confidence = Number($("tracking").value) / 100;
  const reacquire = Math.max(0, .68 - confidence) * 42 + (task === "Holistic Landmarker" ? 8 : 0);
  const blocked = Math.max(0, cost - budget) * fps / 10;
  const route = !isSecureContext ? "block" : cost > budget || blocked > 20 ? "worker" : slack < 6 ? "throttle" : "direct";
  return { task, pixels, fps, cost, budget, slack, confidence, reacquire, blocked, route };
}

function chips(info) {
  const secure = isSecureContext ? ["secure context", "pass"] : ["not secure", "bad"];
  const media = "mediaDevices" in navigator ? ["mediaDevices", "pass"] : ["no camera API", "bad"];
  const permission = state.permission === "granted" ? ["permission granted", "pass"] : state.permission === "prompt" || state.permission === "unknown" ? [`permission ${state.permission}`, "warn"] : [`permission ${state.permission}`, "bad"];
  const worker = state.worker ? ["worker plan on", "pass"] : ["main thread plan", info.route === "direct" ? "pass" : "warn"];
  $("chips").innerHTML = [secure, media, permission, worker].map(([text, kind]) => `<span class="chip ${kind}">${text}</span>`).join("");
}

function render() {
  label();
  const info = estimate();
  chips(info);
  const routeText = info.route === "direct" ? "direct detectForVideo" : info.route === "throttle" ? "throttle every other frame" : info.route === "worker" ? "worker handoff recommended" : "camera blocked";
  $("status").innerHTML = [
    ["Frame budget", `${info.budget.toFixed(1)} ms`],
    ["Estimated sync cost", `${info.cost.toFixed(1)} ms`],
    ["Palm reacquire risk", `${info.reacquire.toFixed(1)}%`],
    ["Route", routeText]
  ].map(([k, v]) => `<div class="status"><p>${k}</p><strong>${v}</strong></div>`).join("");
  $("cards").innerHTML = [
    ["UI blocked / sec", `${info.blocked.toFixed(1)}%`],
    ["Slack", `${info.slack.toFixed(1)} ms`],
    ["Tracking gate", info.confidence.toFixed(2)],
    ["Suggested mode", state.worker || info.route === "worker" ? "worker + VIDEO" : "VIDEO"]
  ].map(([k, v]) => `<div class="status"><p>${k}</p><strong>${v}</strong></div>`).join("");
  draw(info);
}

function draw(info) {
  const w = ctx.canvas.width;
  const h = ctx.canvas.height;
  ctx.clearRect(0, 0, w, h);
  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, "#0d2321");
  g.addColorStop(1, "#14110d");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 18; i++) {
    const x = (i * 61 + state.tick * 2.2) % (w + 80) - 40;
    const y = 46 + Math.sin(i * .8 + state.tick * .04) * 28 + i * 15;
    ctx.strokeStyle = `rgba(107,214,200,${.12 + i * .018})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x, y, 24 + (i % 4) * 14, 0, Math.PI * 2);
    ctx.stroke();
  }
  const handX = w * .5 + Math.sin(state.tick * .045) * 170;
  const handY = h * .52 + Math.cos(state.tick * .033) * 48;
  ctx.strokeStyle = "#f5fbf7";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(handX, handY, 35, 0, Math.PI * 2);
  ctx.stroke();
  for (let f = 0; f < 5; f++) {
    const angle = -1.9 + f * .52 + Math.sin(state.tick * .02 + f) * .08;
    ctx.beginPath();
    ctx.moveTo(handX, handY - 6);
    ctx.lineTo(handX + Math.cos(angle) * (82 - f * 4), handY + Math.sin(angle) * (82 - f * 2));
    ctx.strokeStyle = f === 1 ? "#eea45c" : "#6bd6c8";
    ctx.stroke();
  }
  ctx.fillStyle = "#f5fbf7";
  ctx.font = "16px ui-monospace, monospace";
  ctx.fillText(`${info.task} | ${info.pixels}p ${info.fps}fps | ${info.route}`, 18, 30);
}

function pushFrame() {
  const info = estimate();
  const kind = info.route === "worker" && !state.worker ? "block" : info.slack < 6 ? "skip" : "ok";
  state.history.push({ h: Math.max(6, Math.min(52, info.cost)), kind });
  state.history = state.history.slice(-24);
  $("timeline").innerHTML = state.history.map((item) => `<span class="bar ${item.kind === "ok" ? "" : item.kind}" style="height:${item.h}px"></span>`).join("");
  render();
}

function animate() {
  if (!state.loop) return;
  state.tick += 1;
  if (state.tick % 8 === 0) pushFrame();
  else render();
  requestAnimationFrame(animate);
}

["task", "pixels", "fps", "cost", "tracking"].forEach((id) => $(id).addEventListener("input", render));
$("probe").addEventListener("click", () => { pushFrame(); log(`preflight route: ${estimate().route}`); });
$("permission").addEventListener("click", checkPermission);
$("loop").addEventListener("click", () => {
  state.loop = !state.loop;
  $("loop").textContent = state.loop ? "Stop synthetic camera" : "Start synthetic camera";
  log(state.loop ? "synthetic camera loop started" : "synthetic camera loop stopped");
  animate();
});
$("worker").addEventListener("click", () => { state.worker = !state.worker; log(`worker plan: ${state.worker ? "on" : "off"}`); render(); });

render();
log("ready: adjust task, FPS, infer cost, and tracking confidence");
</script>
</body>
</html>
