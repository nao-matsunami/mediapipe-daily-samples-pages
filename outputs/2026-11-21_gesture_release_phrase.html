<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gesture Release Phrase</title><style>:root{color-scheme:dark;--bg:#10101d;--card:#1a1931;--line:#4c4a76;--ink:#f7f4ff;--muted:#beb9d6;--violet:#c6aaff;--mint:#9effd4;--amber:#ffd29a;--rose:#ff9dbc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#3a235e,transparent 40%),var(--bg);color:var(--ink);font:16px/1.5 system-ui}main{max-width:1000px;margin:auto;padding:28px}.tag{font:700 12px ui-monospace;letter-spacing:.14em;color:var(--violet)}h1{font-size:clamp(38px,7vw,72px);line-height:.9;margin:12px 0}.lead,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:250px 1fr;gap:16px}.card{background:#1a1931e5;border:1px solid var(--line);border-radius:20px;padding:17px}label{display:block;margin:15px 0;font:13px ui-monospace;color:#e0d9f5}input{width:100%;accent-color:var(--violet)}button{width:100%;padding:11px;margin-top:7px;border:1px solid var(--line);border-radius:10px;background:#2a2850;color:var(--ink);font:700 13px ui-monospace;cursor:pointer}canvas{touch-action:none;width:100%;height:auto;display:block;border-radius:14px;background:#0d0c19}.state{font:700 23px ui-monospace;color:var(--mint)}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main><div class="tag">ORIGINAL / DERIVATIVE INTERACTION STUDY</div><h1>Gesture<br>Release Phrase</h1><p class="lead">「検出された」ことと「実行する意思」を分ける派生試作です。円内でジェスチャーをホールドし、外へ抜いた瞬間だけフレーズを確定します。長押しとリリースの小さな文法を試せます。</p><section class="grid"><aside class="card"><label>アームまでの時間 <output id="holdO">550</output> ms<input id="hold" type="range" min="120" max="1500" value="550"></label><label>解除余白 <output id="marginO">18</output> px<input id="margin" type="range" min="0" max="70" value="18"></label><button id="clear">CLEAR PHRASES</button><p class="state" id="state">SEEK</p><p class="muted">内側で止め、外へ移動します。押下操作は不要です。</p></aside><section class="card"><canvas id="view" width="680" height="420"></canvas><p class="muted">次に足すなら、実際の Gesture Recognizer の特定カテゴリを hold 条件、カテゴリ消失または手の退出を release 条件にし、Web Audio の短い確認音や字幕と結びます。</p></section></section><script>const $=s=>document.querySelector(s),c=$('#view'),g=c.getContext('2d');let p={x:-100,y:-100},entered=null,armed=false,phrases=[];
function move(e){let r=c.getBoundingClientRect();p={x:(e.clientX-r.left)*680/r.width,y:(e.clientY-r.top)*420/r.height}}function reset(){p={x:-100,y:-100};entered=null;armed=false}c.addEventListener('pointermove',move);c.addEventListener('pointerdown',move);c.addEventListener('pointerleave',reset);addEventListener('blur',reset);$('#clear').onclick=()=>phrases=[];
function draw(t){let hold=+$('#hold').value,m=+$('#margin').value,cx=335,cy=205,r=120,inside=Math.hypot(p.x-cx,p.y-cy)<r-m;if(inside&&entered===null)entered=t;if(!inside&&entered!==null){if(armed)phrases.unshift({time:new Date().toLocaleTimeString('ja-JP'),ms:Math.round(t-entered)});entered=null;armed=false}let elapsed=entered===null?0:t-entered;if(inside&&elapsed>=hold)armed=true;$('#holdO').textContent=hold;$('#marginO').textContent=m;g.fillStyle='#0d0c19';g.fillRect(0,0,680,420);g.strokeStyle='#4c4a76';g.lineWidth=2;g.beginPath();g.arc(cx,cy,r,0,7);g.stroke();g.strokeStyle='#c6aaff';g.setLineDash([6,7]);g.beginPath();g.arc(cx,cy,r-m,0,7);g.stroke();g.setLineDash([]);let pct=Math.min(1,elapsed/hold);g.strokeStyle=armed?'#9effd4':'#c6aaff';g.lineWidth=12;g.beginPath();g.arc(cx,cy,r-m,Math.PI*1.5,Math.PI*1.5+pct*Math.PI*2);g.stroke();g.fillStyle=armed?'#9effd4':'#f7f4ff';g.font='700 19px ui-monospace';g.textAlign='center';g.fillText(armed?'RELEASE TO COMMIT':'HOLD GESTURE',cx,cy);g.fillStyle='#beb9d6';g.font='13px ui-monospace';g.fillText(armed?'move outside the violet ring':Math.round(pct*100)+'%',cx,cy+25);g.textAlign='start';g.fillStyle='#ffd29a';g.beginPath();g.arc(p.x,p.y,9,0,7);g.fill();g.fillStyle='#beb9d6';g.font='13px ui-monospace';g.fillText('committed phrases',30,330);phrases.slice(0,3).forEach((v,i)=>{g.fillStyle=i?'#beb9d6':'#9effd4';g.fillText((i+1)+'. release '+v.time+'  hold '+v.ms+'ms',30,358+i*22)});$('#state').textContent=armed?'ARMED — RELEASE':inside?'HOLDING':'SEEK';$('#state').style.color=armed?'#9effd4':inside?'#c6aaff':'#ffd29a';requestAnimationFrame(draw)}requestAnimationFrame(draw);</script></main></html>
