<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Label Locale Fallback Lens</title>
<style>:root{color-scheme:dark;--bg:#09111e;--card:#101d30;--line:#2a4665;--ink:#edf6ff;--muted:#9eb2c9;--cyan:#66ddff;--lime:#baf477;--amber:#ffbf65}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#19365a,transparent 35rem),var(--bg);font:15px/1.5 ui-sans-serif,system-ui;color:var(--ink)}main{max-width:960px;margin:auto;padding:34px 18px 55px}h1{font-size:clamp(1.9rem,5vw,3.2rem);line-height:1.05;margin:0 0 10px}.lead,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:290px 1fr;gap:16px;margin-top:22px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}select,button{font:inherit;color:var(--ink);background:#0b1728;border:1px solid #365a7a;border-radius:9px;padding:9px;width:100%}label{display:block;color:var(--muted);margin:12px 0 5px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{min-height:158px;padding:14px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(135deg,#142944,#0d1727)}.icon{font-size:2.3rem}.name{font-size:1.15rem;font-weight:800;margin-top:10px}.path{font-size:.78rem;color:var(--cyan);margin-top:5px}.state{margin-top:16px;padding:12px;border-left:3px solid var(--amber);background:#17263b}.ok{color:var(--lime);font-weight:800}.warn{color:var(--amber);font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}</style>
<main><p class="muted">ORIGINAL WEB ML PROTOTYPE · synthetic metadata · no external request</p><h1>Label Locale<br>Fallback Lens</h1><p class="lead">Web classifier の表示名取得に関する公開提案を手掛かりに、モデル metadata に希望言語がない時のラベル選択を可視化します。実際の API 名・対応状況は公式リリースを確認してください。</p><div class="grid"><section class="panel"><label>希望する表示言語</label><select id="locale"><option value="ja">日本語 (ja)</option><option value="es">Español (es)</option><option value="fr">Français (fr)</option><option value="en">English (en)</option></select><label>フォールバック方針</label><select id="policy"><option value="en">英語 → category ID</option><option value="id">category ID のみ</option></select><div class="state" id="state"></div><p class="muted">UI だけで翻訳をねつ造せず、metadata にある表示名と stable な category ID を区別します。</p></section><section class="panel"><div class="cards" id="cards"></div></section></div></main>
<script>const data=[['🥤','cup',{ja:'カップ',en:'cup'},'drinkware.cup'],['🪴','plant',{en:'potted plant',es:'planta en maceta'},'living.plant'],['💡','lamp',{fr:'lampe',en:'lamp'},'lighting.lamp']];const $=id=>document.getElementById(id);function render(){const loc=$('locale').value,p=$('policy').value;let direct=0,fallback=0;$('cards').innerHTML=data.map(([i,n,names,id])=>{let label=names[loc],path='metadata: '+loc;if(label)direct++;else if(p==='en'&&names.en){label=names.en;path='fallback: en';fallback++}else{label=id;path='fallback: category ID';fallback++}return `<article class="item"><div class="icon">${i}</div><div class="name">${label}</div><div class="path">${path}</div><div class="muted">${id}</div></article>`}).join('');$('state').innerHTML=`<span class="ok">${direct} 件</span> が希望 locale に一致、<span class="warn">${fallback} 件</span> は明示的な fallback。`}$('locale').oninput=render;$('policy').oninput=render;render()</script></html>
