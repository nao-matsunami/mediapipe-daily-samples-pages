<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inference Budget Conductor</title><style>:root{color-scheme:dark;--bg:#07111c;--card:#10243a;--line:#34546c;--ink:#edf7ff;--muted:#a9c0d1;--aqua:#79f4d0;--sun:#ffd178;--violet:#bbacff;--rose:#ff9ab1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 87% 0,#213d59,transparent 34%),var(--bg);color:var(--ink);font:16px/1.5 system-ui}main{max-width:1050px;margin:auto;padding:28px}.tag{font:700 12px ui-monospace;letter-spacing:.13em;color:var(--aqua)}h1{font-size:clamp(38px,7vw,72px);line-height:.9;margin:12px 0}.lead,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:260px 1fr;gap:16px}.card{background:#10243ae8;border:1px solid var(--line);border-radius:20px;padding:17px}label{display:block;margin:16px 0;font:13px ui-monospace;color:#d8e8f2}input{width:100%;accent-color:var(--aqua)}button{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#18344e;color:var(--ink);font:700 13px ui-monospace;cursor:pointer}.state{font:700 22px ui-monospace;color:var(--aqua)}canvas{display:block;width:100%;height:auto;background:#06101a;border-radius:13px;touch-action:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main><div class="tag">ORIGINAL / LIVE VIDEO TASK CONTRACT</div><h1>Inference Budget<br>Conductor</h1><p class="lead">描画フレームごとに推論するのではなく、次の推論を予約して表示の予算を守るための最小試作です。キャンバスを動かし、重い推論と速い被写体の折り合いを見ます。</p><section class="grid"><aside class="card"><label>1回の推論コスト <output id="costO">22</output> ms<input id="cost" type="range" min="4" max="90" value="22"></label><label>1秒の推論予算 <output id="budgetO">18</output> 回<input id="budget" type="range" min="4" max="45" value="18"></label><label>被写体の速度 <output id="speedO">0.55</output><input id="speed" type="range" min=".1" max="1" step=".01" value=".55"></label><button id="reset">RESET METRICS</button><p class="state" id="state">PACING</p><p class="muted" id="stats"></p></aside><section class="card"><canvas id="view" width="700" height="430"></canvas><p class="muted">次に足すなら、実際の <code>detectForVideo(video, timestamp)</code> をWorkerへ渡し、推論開始・完了・描画のPerformance markを記録します。予算超過時は結果を捨てるのではなく、最新時刻だけを採用する契約にします。</p></section></section><script>const $=s=>document.querySelector(s),c=$('#view'),g=c.getContext('2d');let pointer=.52,last=0,next=0,done=0,runs=0,skips=0,latency=0,marks=[],events=[];c.onpointermove=e=>{let r=c.getBoundingClientRect();pointer=Math.max(.04,Math.min(.96,(e.clientX-r.left)/r.width))};c.onpointerdown=c.onpointermove;$('#reset').onclick=()=>{runs=skips=0;events=[];marks=[];done=0;next=0};function tick(t){let cost=+$('#cost').value,budget=+$('#budget').value,speed=+$('#speed').value;$('#costO').textContent=cost;$('#budgetO').textContent=budget;$('#speedO').textContent=speed.toFixed(2);let interval=1000/budget;if(t>=next){next=t+interval;let observed=pointer;setTimeout(()=>{done=observed;latency=performance.now()-t;runs++;events.push({x:observed,t:performance.now()});if(events.length>28)events.shift()},cost)}else skips++;let auto=.5+Math.sin(t*.0012*speed)*.33;let current=(pointer-.5)*.7+.5; // pointer remains the input driver
g.fillStyle='#06101a';g.fillRect(0,0,700,430);g.strokeStyle='#274960';g.lineWidth=1;for(let x=60;x<670;x+=61){g.beginPath();g.moveTo(x,45);g.lineTo(x,365);g.stroke()}for(let y=80;y<366;y+=71){g.beginPath();g.moveTo(40,y);g.lineTo(670,y);g.stroke()}let py=120+Math.sin(t*.002*speed)*24;let dx=current*600+50,ix=done*600+50;g.setLineDash([7,8]);g.strokeStyle='#ffd178';g.beginPath();g.moveTo(dx,70);g.lineTo(dx,350);g.stroke();g.setLineDash([]);g.fillStyle='#ffd178';g.beginPath();g.arc(dx,py,18,0,7);g.fill();g.fillStyle='#06101a';g.font='700 11px ui-monospace';g.textAlign='center';g.fillText('NOW',dx,py+4);g.fillStyle='#bbacff';g.beginPath();g.arc(ix,py+122,21,0,7);g.fill();g.fillStyle='#06101a';g.fillText('ML',ix,py+126);g.textAlign='start';g.strokeStyle='#79f4d0';g.lineWidth=2;g.beginPath();events.forEach((e,i)=>{let x=45+i*23,y=390-e.x*45;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.fillStyle='#edf7ff';g.font='700 15px ui-monospace';g.fillText('render now',45,38);g.fillStyle='#bbacff';g.fillText('last accepted result',45,61);g.fillStyle='#a9c0d1';g.font='12px ui-monospace';g.fillText('inference reservations over time →',45,414);$('#state').textContent=latency>interval?'OVER BUDGET':t<next-interval+cost?'INFERENCE BUSY':'PACING';$('#state').style.color=latency>interval?'#ff9ab1':'#79f4d0';$('#stats').textContent='runs '+runs+' · display frames skipped '+skips+' · last latency '+latency.toFixed(1)+' ms';last=t;requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></main></html>
