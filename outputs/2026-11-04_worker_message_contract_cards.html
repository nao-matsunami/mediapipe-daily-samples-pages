<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worker Message Contract Cards</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f0e8;color:#1d2c3b;font:16px/1.6 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:28px}.tag{color:#667b91;font-size:13px}h1{font-size:clamp(34px,6vw,62px);line-height:1;margin:8px 0;color:#234b62}.sub{max-width:700px}button{font:inherit;cursor:pointer;border:1px solid #9ab0be;background:#fffdf8;padding:13px;border-radius:13px}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0}.tabs button.active{background:#234b62;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fffdf8;border:1px solid #cad5d8;border-radius:18px;padding:18px;min-height:210px}.key{color:#d0614f;font:13px ui-monospace,monospace}.yes{color:#087a5c;font-weight:800}.no{color:#ad4336;font-weight:800}footer{margin-top:22px;color:#516879}@media(max-width:680px){.grid{grid-template-columns:1fr}}</style>
<main><div class="tag">自作・オフライン / 1本目の「次に足すなら」をカード化</div><h1>Worker Message<br>Contract Cards</h1><p class="sub">Worker経路は単なる <code>postMessage</code> ではなく、誰が何を所有し、どの時点まで有効で、遅い結果をどう扱うかの契約です。用途を選ぶと最小メッセージの形を切り替えます。</p><nav class="tabs"><button data="preview" class="active">ライブプレビュー</button><button data="still">静止画編集</button><button data="record">同意つき計測</button></nav><section class="grid" id="cards"></section><footer>次に足すなら: 実Workerで structured clone と transfer の時間を並べ、端末能力とフレーム予算ごとに選択を保存する。</footer></main>
<script>const set={preview:[['送信','<span class="key">{ id, timestampMs, bitmap }</span>','<span class="yes">transfer</span> — main は直後に手放す'],['返信','<span class="key">{ id, timestampMs, overlay }</span>','<span class="yes">latest-only</span> — id が最新なら描画'],['保存','結果本体は保存しない','<span class="no">映像・マスクなし</span> — 集計だけ'] ],still:[['送信','<span class="key">{ jobId, imageCopy }</span>','<span class="yes">copy</span> — 編集元を残す'],['返信','<span class="key">{ jobId, mask, revision }</span>','<span class="yes">jobId一致</span> — revision を確認'],['保存','ユーザー操作で export','<span class="yes">明示操作</span> — 由来を添える']],record:[['送信','<span class="key">{ session, id, bitmap }</span>','<span class="yes">transfer</span> — 最小入力'],['返信','<span class="key">{ id, ageMs, summary }</span>','<span class="yes">鮮度上限</span> — 期限切れは捨てる'],['保存','<span class="key">{ optIn, aggregate }</span>','<span class="yes">同意済み</span> — 要約のみ'] ]};let mode='preview';function draw(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset===mode));document.getElementById('cards').innerHTML=set[mode].map(x=>`<article class="card"><small>${x[0]}</small><h2>${x[1]}</h2><p>${x[2]}</p></article>`).join('')}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset;draw()});draw()</script></html>
