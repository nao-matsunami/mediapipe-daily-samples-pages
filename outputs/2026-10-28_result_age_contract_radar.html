<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Result Age Contract Radar</title><style>:root{color-scheme:dark;--a:#5cf2c0;--b:#ffc566;--c:#ff7588}*{box-sizing:border-box}body{margin:0;background:#07101c;color:#eaf4ff;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}.app{width:min(840px,94vw);padding:25px}.card{background:#112037;border:1px solid #29415e;border-radius:18px;padding:18px}.radar{height:280px;position:relative;display:grid;place-items:center;background:radial-gradient(circle,#1a3c51 0 2px,transparent 3px),#091727;background-size:32px 32px;overflow:hidden}.ring{width:220px;aspect-ratio:1;border:1px solid #345a70;border-radius:50%;display:grid;place-items:center}.core{width:88px;aspect-ratio:1;border-radius:50%;background:var(--a);box-shadow:0 0 50px var(--a);display:grid;place-items:center;color:#03251e;font-weight:800;transition:.2s}.beam{position:absolute;width:2px;height:130px;background:linear-gradient(var(--a),transparent);transform-origin:bottom;bottom:50%;left:50%;transition:.18s}label{display:flex;align-items:center;gap:12px;margin:14px 0}input{flex:1;accent-color:var(--a)}.row{display:flex;gap:12px;flex-wrap:wrap}.chip{padding:9px 12px;border-radius:10px;background:#0a1728}.chip b{font-size:22px}button{padding:9px 12px;border:1px solid #41627a;border-radius:9px;background:#1a334a;color:#fff}small,p{color:#a8bdcf;line-height:1.55}</style><main class="app"><h1>Result Age Contract Radar</h1><p>推論値そのものではなく「何ms前の結果か」を可視化する派生試作。年齢が閾値を超えたら、見た目を滑らかに保つより明示的に HOLD / OFF へ移行します。</p><section class="card"><div class="radar"><div class="beam" id="beam"></div><div class="ring"><div class="core" id="core">LIVE</div></div></div><label>擬似結果の遅延 <input id="delay" type="range" min="0" max="1600" value="280"><output id="dv">280ms</output></label><label>許容する最大年齢 <input id="limit" type="range" min="100" max="1800" value="700"><output id="lv">700ms</output></label><button id="pause">結果を止める</button><div class="row"><div class="chip">result age <b id="age">0ms</b></div><div class="chip">state <b id="state">LIVE</b></div><div class="chip">表示契約 <b id="contract">fresh</b></div></div></section><p><small>次に足すなら：Pose/Hand/Face の実結果と timestamp、source size、mirror、ROI を一つの result envelope にまとめ、分析ログは同意と上限付きで保存する。</small></p></main><script>const $=s=>document.querySelector(s);let emitted=performance.now(),paused=false,ang=0;function frame(){let now=performance.now(),age=paused?now-emitted:Math.max(0,now-emitted-+$('#delay').value);let lim=+$('#limit').value,st=age<lim*.55?'LIVE':age<lim?'HOLD':'OFF',col=st==='LIVE'?'#5cf2c0':st==='HOLD'?'#ffc566':'#ff7588';$('#age').textContent=Math.round(age)+'ms';$('#state').textContent=st;$('#contract').textContent=st==='LIVE'?'fresh':st==='HOLD'?'age-tagged':'suppressed';$('#core').textContent=st;$('#core').style.background=col;$('#core').style.boxShadow='0 0 50px '+col;ang+=2;$('#beam').style.transform='rotate('+ang+'deg)';if(!paused&&Math.random()<.055)emitted=now;requestAnimationFrame(frame)}$('#pause').onclick=()=>{paused=!paused;if(!paused)emitted=performance.now();$('#pause').textContent=paused?'結果を再開':'結果を止める'};[['delay','dv'],['limit','lv']].forEach(([a,b])=>$('#'+a).oninput=e=>$('#'+b).textContent=e.target.value+'ms');frame();</script>
