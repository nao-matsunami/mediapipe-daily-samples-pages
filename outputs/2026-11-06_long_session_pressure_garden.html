<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Long Session Pressure Garden</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07141a;color:#e8f8f5;font:16px/1.55 system-ui,sans-serif}main{max-width:980px;margin:auto;padding:28px}.tag{display:inline-block;border:1px solid #397f79;border-radius:999px;padding:3px 10px;color:#98e9dc;font-size:12px}h1{font-size:clamp(35px,7vw,65px);line-height:.95;margin:16px 0}.sub,.muted{color:#a9c8c4}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;margin-top:23px}.card{background:#0e252b;border:1px solid #24525a;border-radius:18px;padding:18px}label{display:block;margin:12px 0;color:#cce6e1}input{width:100%;accent-color:#76ead9}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:11px;background:#091b20;border-radius:12px}.stat b{display:block;color:#82eedb;font-size:25px}.garden{height:300px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 100%,#1c746d,#0b252c 48%,#07151b);border-radius:17px}.flower{position:absolute;bottom:15px;width:22px;height:22px;border-radius:50% 50% 50% 0;background:#78ecd5;transform:rotate(45deg);box-shadow:0 0 15px #76e9d2}.flower:after{content:'';position:absolute;width:3px;height:70px;background:#5aaa81;top:14px;left:10px;transform:rotate(-45deg);transform-origin:top}.stale{background:#e9a25e;box-shadow:0 0 15px #ffad5d}.held{background:#df6e86;box-shadow:0 0 15px #e8728d}.note{min-height:72px;padding:12px 14px;border-left:3px solid #78ead9;background:#0a1c21;color:#c6dbd7}button{border:0;border-radius:12px;padding:11px 16px;background:#82ead9;color:#06232a;font-weight:800;cursor:pointer;margin-right:7px}@media(max-width:700px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}</style>
<main><span class="tag">自作・長時間ストリームの安全な間引き</span><h1>Long Session<br>Pressure Garden</h1><p class="sub">連続する結果をすべて保持せず、「描画した最新結果」「鮮度を越えた結果」「資源圧で間引いた結果」を分けて見せる設計試作です。実カメラ、モデル、個人データは使いません。</p><section class="grid"><div class="card"><label>入力レート <input id="rate" type="range" min="2" max="18" value="10"><span id="rateV"></span> fps</label><label>推論＋転送の仮想コスト <input id="cost" type="range" min="20" max="260" value="90"><span id="costV"></span> ms</label><label>表示できる結果年齢 <input id="fresh" type="range" min="60" max="700" value="260"><span id="freshV"></span> ms</label><label>資源圧の上限（保留スロット） <input id="slots" type="range" min="1" max="8" value="3"><span id="slotsV"></span></label><p><button id="run">停止</button><button id="burst">負荷バースト</button></p><p class="muted">次に足すなら: 実際のTask結果のtimestamp、GPUメモリ計測、Workerからのclose確認をこの分類へ接続する。</p></div><div class="card"><div class="stats"><div class="stat">描画<b id="drawn">0</b></div><div class="stat">鮮度切れ<b id="stale">0</b></div><div class="stat">圧で破棄<b id="dropped">0</b></div></div><p class="note" id="note">緑は期限内に表示された結果。橙は到着したが古すぎた結果。赤は保留スロットを使い切る前に入力側で間引いた結果です。</p><div class="garden" id="garden"></div></div></section></main>
<script>const $=id=>document.getElementById(id);let active=true,seq=0,stats={drawn:0,stale:0,dropped:0},pending=0,burst=0;const ids=['rate','cost','fresh','slots'];function values(){ids.forEach(x=>$(x+'V').textContent=$(x).value)}function paint(kind){const e=document.createElement('i');e.className='flower '+kind;e.style.left=(8+Math.random()*84)+'%';e.style.bottom=(15+Math.random()*210)+'px';$('garden').append(e);setTimeout(()=>e.remove(),2600)}function show(){for(const k in stats)$(k).textContent=stats[k];$('note').textContent=`保留 ${pending}/${$('slots').value}。緑=${stats.drawn} は期限内、橙=${stats.stale} は結果年齢超過、赤=${stats.dropped} はメモリ圧を避けた入力間引き。` }function tick(){if(!active)return;const rate=+$('rate').value+(burst?12:0),cost=+$('cost').value+(burst?170:0),fresh=+$('fresh').value,cap=+$('slots').value;if(pending>=cap){stats.dropped++;paint('held');show()}else{pending++;const id=++seq,start=performance.now();setTimeout(()=>{pending--;const age=performance.now()-start;if(age>fresh){stats.stale++;paint('stale')}else{stats.drawn++;paint('')}show()},cost+Math.random()*70)}setTimeout(tick,1000/rate)}ids.forEach(id=>$(id).oninput=values);$('run').onclick=()=>{active=!active;$('run').textContent=active?'停止':'再開';if(active)tick()};$('burst').onclick=()=>{burst=1;$('burst').textContent='バースト中';setTimeout(()=>{burst=0;$('burst').textContent='負荷バースト'},3500)};values();show();tick();</script></html>
