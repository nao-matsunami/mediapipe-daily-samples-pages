<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Category Mask Palette Lab</title><style>:root{color-scheme:dark;--bg:#090d1b;--card:#151e39;--line:#394b79;--text:#f0f4ff;--muted:#adb9d6;--mint:#72ecc6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#34417c,transparent 38%),var(--bg);color:var(--text);font:16px/1.5 system-ui}main{max-width:1060px;margin:auto;padding:30px}.tag,label{color:var(--mint);font:700 12px ui-monospace;letter-spacing:.1em}h1{font-size:clamp(40px,8vw,73px);line-height:.88;margin:12px 0}.lead,.note{color:var(--muted)}.grid{display:grid;grid-template-columns:275px 1fr;gap:16px}.card{background:#151e39e8;border:1px solid var(--line);border-radius:20px;padding:18px}label{display:block;margin:12px 0}input{width:100%;accent-color:var(--mint)}button{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#27385f;color:var(--text);font-weight:800;cursor:pointer}canvas{width:100%;height:auto;display:block;border-radius:14px;background:#080e1e}.state{font:800 15px ui-monospace;color:var(--mint)}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main><div class="tag">ORIGINAL / CATEGORY-MASK DISPLAY POLICY</div><h1>Category Mask<br>Palette Lab</h1><p class="lead">セグメンテーションのカテゴリ値を、描画用のパレットと不透明度に分けて扱う練習台です。疑似マスクだけを生成し、GPU/CPUの実行や実画像の保持は行いません。</p><section class="grid"><aside class="card"><label>人物のしきい値 <output id="to">0.48</output><input id="threshold" type="range" min="0" max="1" step=".02" value=".48"></label><label>オーバーレイ不透明度 <output id="oo">72</output>%<input id="opacity" type="range" min="15" max="100" value="72"></label><button id="mode">表示: CATEGORY</button><button id="freeze">入力を固定</button><p class="state" id="state"></p><p class="note">色は意味付けの層、しきい値は採用の層。推論結果そのものと混ぜないようにします。</p></aside><section class="card"><canvas id="view" width="720" height="410"></canvas><p class="note">次に足すなら、Image Segmenterの実カテゴリ/信頼マスク、GPU出力の描画経路、offscreen canvas、フレームごとのコピー数と保持時間を計測して、品質・電力・メモリの三者を比較します。</p></section></section><script>const $=s=>document.querySelector(s),c=$('#view'),g=c.getContext('2d');let cat=true,frozen=false,seed=0;function paint(t){if(!frozen)seed=t/1000;let th=+$('#threshold').value,op=+$('#opacity').value/100;$('#to').textContent=th.toFixed(2);$('#oo').textContent=Math.round(op*100);$('#state').textContent=(cat?'CATEGORY':'CONFIDENCE')+' · synthetic mask · '+(frozen?'FROZEN':'LIVE');g.clearRect(0,0,720,410);g.fillStyle='#18264a';g.fillRect(0,0,720,410);for(let y=0;y<410;y+=8)for(let x=0;x<720;x+=8){let dx=(x-360)/210,dy=(y-205)/150;let person=Math.max(0,1-Math.sqrt(dx*dx+dy*dy)+.15*Math.sin(x/30+seed*2)*Math.cos(y/38));let keep=person>th;let hue=cat?(keep?175:226):Math.round(220-person*150);g.fillStyle=keep?`hsla(${hue},78%,${cat?'58':'55'}%,${op})`:'rgba(9,14,30,.9)';g.fillRect(x,y,8,8)}g.strokeStyle='#f5fbff';g.lineWidth=3;g.beginPath();g.arc(360,150,38,0,7);g.stroke();g.beginPath();g.moveTo(360,188);g.lineTo(360,325);g.moveTo(300,230);g.lineTo(420,230);g.moveTo(360,324);g.lineTo(305,390);g.moveTo(360,324);g.lineTo(415,390);g.stroke();g.fillStyle='#adb9d6';g.font='13px ui-monospace';g.fillText('category → palette → composite',25,31);g.fillStyle='#72ecc6';g.fillRect(28,360,18,12);g.fillStyle='#adb9d6';g.fillText('accepted person',54,371);g.fillStyle='#394b79';g.fillRect(184,360,18,12);g.fillText('background / below threshold',210,371);requestAnimationFrame(paint)}$('#mode').onclick=()=>{cat=!cat;$('#mode').textContent='表示: '+(cat?'CATEGORY':'CONFIDENCE')};$('#freeze').onclick=()=>{frozen=!frozen;$('#freeze').textContent=frozen?'入力を再開':'入力を固定'};paint(0);</script></main></html>
