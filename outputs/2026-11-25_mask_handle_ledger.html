<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mask Handle Ledger</title><style>:root{color-scheme:dark;--b:#10101b;--c:#20213a;--l:#474b75;--i:#f5f3ff;--m:#b6b4ca;--g:#82f6cd;--v:#bda7ff;--r:#ff9daf}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#453578,transparent 34%),var(--b);color:var(--i);font:16px/1.5 system-ui}main{max-width:1080px;margin:auto;padding:30px}.tag,label{font:700 12px ui-monospace;letter-spacing:.1em;color:var(--g)}h1{font-size:clamp(38px,7vw,68px);line-height:.93;margin:12px 0}.lead,.muted{color:var(--m)}.grid{display:grid;grid-template-columns:290px 1fr;gap:16px}.card{padding:18px;border:1px solid var(--l);border-radius:20px;background:#20213ade}label{display:block;margin:13px 0}input{width:100%;accent-color:var(--g)}button{width:100%;margin:6px 0;padding:11px;border:1px solid var(--l);border-radius:10px;background:#30325a;color:var(--i);font-weight:800;cursor:pointer}.state{font:800 19px ui-monospace;color:var(--g)}canvas{display:block;width:100%;height:auto;background:var(--b);border-radius:14px}.log{height:100px;overflow:auto;border-top:1px solid var(--l);margin-top:12px;padding-top:8px;font:12px/1.6 ui-monospace;color:var(--m)}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><div class="tag">ORIGINAL / SEGMENTATION RESULT LIFETIME</div><h1>Mask Handle<br>Ledger</h1><p class="lead">連続セグメンテーションの結果を「描画だけ」「必要時だけコピー」「保持し続ける」に分け、handleの寿命とメモリ予算を可視化します。実maskやGPU handleは作りません。</p><section class="grid"><aside class="card"><label>推論FPS <output id="fo">12</output><input id="fps" type="range" min="2" max="30" value="12"></label><label>保持フレーム <output id="ko">5</output><input id="keep" type="range" min="0" max="20" value="5"></label><label>コピー頻度 <output id="co">4</output> frameごと<input id="copy" type="range" min="1" max="12" value="4"></label><button id="safe">SAFE: DRAW & RELEASE</button><button id="unsafe">UNSAFE: RETAIN HANDLES</button><button id="clear">CLEAR ALL REFERENCES</button><p class="state" id="state">SAFE / LIVE</p></aside><section class="card"><canvas id="view" width="720" height="390"></canvas><div class="log" id="log"></div><p class="muted">次に足すなら、実Image Segmenter callbackで描画後にmask参照を切り、必要なピクセルだけ<code>ImageBitmap</code>または小サイズ配列へ複製します。長時間ではGPU/JSメモリ、timestamp、Task切替時の<code>close()</code>を台帳で測ります。</p></section></section><script>const $=s=>document.querySelector(s),c=$('#view'),g=c.getContext('2d');let unsafe=false,frame=0,last=0,held=[],copied=0,log=[];const add=s=>{log.unshift(new Date().toLocaleTimeString('ja-JP')+' '+s);log=log.slice(0,6);$('#log').innerHTML=log.join('<br>')};function tick(t){let fps=+$('#fps').value,keep=+$('#keep').value,copy=+$('#copy').value;$('#fo').textContent=fps;$('#ko').textContent=keep;$('#co').textContent=copy;if(t-last>1000/fps){last=t;frame++;let record={id:frame,copy:frame%copy===0};if(unsafe)held.push(record);else{if(record.copy){held.push(record);copied++}while(held.length>keep)held.shift()}if(frame%12===0)add(unsafe?'frame '+frame+' retained handle':'frame '+frame+' released after draw')}$('#state').textContent=(unsafe?'UNSAFE RETAIN ':'SAFE RELEASE ')+'· '+held.length+' refs';g.fillStyle='#10101b';g.fillRect(0,0,720,390);g.fillStyle='#b6b4ca';g.font='13px ui-monospace';g.fillText('synthetic result handles — no real mask allocated',30,35);let max=unsafe?Math.max(20,held.length):Math.max(20,keep);for(let i=0;i<max;i++){let x=35+(i%10)*66,y=72+Math.floor(i/10)*68,item=held[i];g.fillStyle=item?(item.copy?'#82f6cd':'#bda7ff'):'#20213a';g.fillRect(x,y,54,45);if(item){g.fillStyle='#10101b';g.font='11px ui-monospace';g.fillText('m'+item.id,x+7,y+20);g.fillText(item.copy?'COPY':'REF',x+7,y+35)}}g.fillStyle='#ff9daf';g.font='700 14px ui-monospace';g.fillText('live refs '+held.length+(unsafe?' ↑ unbounded':' / cap '+keep),35,352);g.fillStyle='#82f6cd';g.fillText('copied snapshots '+copied,35,375);requestAnimationFrame(tick)}$('#safe').onclick=()=>{unsafe=false;held=[];add('safe: draw then release; snapshots bounded')};$('#unsafe').onclick=()=>{unsafe=true;add('unsafe: every result handle retained')};$('#clear').onclick=()=>{held=[];copied=0;add('all references cleared')};requestAnimationFrame(tick);</script></main></html>
