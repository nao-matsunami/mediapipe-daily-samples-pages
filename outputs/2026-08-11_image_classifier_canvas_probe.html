<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Classifier Canvas Probe</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
      background: #101214;
      color: #f7f4ec;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(140deg, rgba(58, 170, 206, 0.15), transparent 36%),
        linear-gradient(320deg, rgba(220, 184, 79, 0.12), transparent 42%),
        #101214;
    }

    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 22px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 14px;
    }

    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(247, 244, 236, 0.14);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 3.5vw, 3rem);
      line-height: 1.04;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 1rem;
      letter-spacing: 0;
    }

    p {
      margin: 8px 0 0;
      color: #c9c4b6;
      line-height: 1.62;
    }

    button, select, input {
      min-height: 38px;
      border: 1px solid rgba(247, 244, 236, 0.16);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.055);
      color: #f7f4ec;
      font: inherit;
    }

    button {
      padding: 8px 11px;
      cursor: pointer;
      border-color: rgba(58, 170, 206, 0.42);
      background: rgba(58, 170, 206, 0.14);
    }

    button:disabled {
      opacity: 0.56;
      cursor: wait;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #3aaace;
    }

    .stage, .side {
      display: grid;
      gap: 12px;
      align-content: start;
      min-width: 0;
    }

    .panel {
      border: 1px solid rgba(247, 244, 236, 0.14);
      border-radius: 8px;
      padding: 14px;
      background: rgba(16, 18, 20, 0.84);
      box-shadow: 0 22px 64px rgba(0, 0, 0, 0.3);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .control {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    label, .metric-label {
      color: #9d9a90;
      font-size: 0.76rem;
      text-transform: uppercase;
    }

    .canvases {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .tile {
      border: 1px solid rgba(247, 244, 236, 0.14);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.04);
      min-width: 0;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      background: #191c1f;
    }

    .tile-foot {
      display: grid;
      gap: 7px;
      padding: 9px;
    }

    .tile-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .name {
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chip {
      border: 1px solid rgba(220, 184, 79, 0.34);
      border-radius: 999px;
      padding: 4px 8px;
      background: rgba(220, 184, 79, 0.1);
      color: #f7f4ec;
      font-size: 0.76rem;
      white-space: nowrap;
    }

    .bars {
      display: grid;
      gap: 7px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: minmax(72px, 1fr) minmax(0, 1.2fr) 48px;
      gap: 7px;
      align-items: center;
      font-size: 0.84rem;
    }

    .bar-label {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .bar-track {
      height: 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3aaace, #dcb84f);
    }

    .score {
      font-variant-numeric: tabular-nums;
      text-align: right;
      color: #e5dfcf;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .metric {
      border: 1px solid rgba(247, 244, 236, 0.1);
      border-radius: 8px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.04);
    }

    .metric strong {
      display: block;
      margin-top: 5px;
      font-size: 1.1rem;
      font-variant-numeric: tabular-nums;
    }

    .log {
      min-height: 118px;
      max-height: 190px;
      overflow: auto;
      border: 1px solid rgba(247, 244, 236, 0.1);
      border-radius: 8px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.24);
      color: #c9c4b6;
      font: 0.82rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; padding: 14px; }
      header { display: grid; }
      .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .canvases { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Image Classifier Canvas Probe</h1>
        <p>生成キャンバスだけを入力にして、分類の上位ラベルと閾値の挙動を観察する最小サンプル。</p>
      </div>
      <span class="chip" id="modeChip">Fallback ready</span>
    </header>

    <section class="stage">
      <section class="panel">
        <h2>Controls</h2>
        <div class="controls">
          <div class="control">
            <label for="scene">Scene</label>
            <select id="scene">
              <option value="garden">Garden object</option>
              <option value="kitchen">Kitchen shape</option>
              <option value="road">Road sign</option>
            </select>
          </div>
          <div class="control">
            <label for="threshold">Score threshold <span id="thresholdValue">0.20</span></label>
            <input id="threshold" type="range" min="0" max="0.8" value="0.2" step="0.01">
          </div>
          <div class="control">
            <label for="noise">Canvas noise <span id="noiseValue">18</span></label>
            <input id="noise" type="range" min="0" max="48" value="18" step="1">
          </div>
          <div class="control">
            <label for="seed">Seed <span id="seedValue">7</span></label>
            <input id="seed" type="range" min="1" max="60" value="7" step="1">
          </div>
        </div>
      </section>

      <section class="canvases" id="canvases"></section>
    </section>

    <aside class="side">
      <section class="panel">
        <h2>Run</h2>
        <div class="actions">
          <button id="regenerate">Regenerate</button>
          <button id="load">Load MediaPipe</button>
          <button id="classify">Classify</button>
        </div>
        <p>MediaPipe が読み込めない環境でも、色・輪郭・密度から作る fallback スコアで UI の動作を確認できます。</p>
      </section>

      <section class="panel">
        <h2>Session Metrics</h2>
        <div class="metrics">
          <div class="metric">
            <span class="metric-label">Runtime</span>
            <strong id="runtime">fallback</strong>
          </div>
          <div class="metric">
            <span class="metric-label">Latency</span>
            <strong id="latency">0.0 ms</strong>
          </div>
          <div class="metric">
            <span class="metric-label">Passed labels</span>
            <strong id="passed">0</strong>
          </div>
          <div class="metric">
            <span class="metric-label">Top label</span>
            <strong id="topLabel">-</strong>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>Log</h2>
        <div class="log" id="log"></div>
      </section>
    </aside>
  </main>

  <script type="module">
    const CDN = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";
    const MODEL = "https://storage.googleapis.com/mediapipe-models/image_classifier/efficientnet_lite0/float32/latest/efficientnet_lite0.tflite";

    const state = {
      classifier: null,
      runtime: "fallback",
      results: [],
      tiles: [
        { id: "A", title: "A: foreground object" },
        { id: "B", title: "B: shifted object" },
        { id: "C", title: "C: distractor" }
      ]
    };

    const scene = document.querySelector("#scene");
    const threshold = document.querySelector("#threshold");
    const noise = document.querySelector("#noise");
    const seed = document.querySelector("#seed");
    const thresholdValue = document.querySelector("#thresholdValue");
    const noiseValue = document.querySelector("#noiseValue");
    const seedValue = document.querySelector("#seedValue");
    const canvases = document.querySelector("#canvases");
    const logEl = document.querySelector("#log");
    const modeChip = document.querySelector("#modeChip");
    const runtimeEl = document.querySelector("#runtime");
    const latencyEl = document.querySelector("#latency");
    const passedEl = document.querySelector("#passed");
    const topLabelEl = document.querySelector("#topLabel");
    const loadButton = document.querySelector("#load");

    function log(message) {
      const stamp = new Date().toLocaleTimeString("ja-JP", { hour12: false });
      logEl.textContent = `[${stamp}] ${message}\n${logEl.textContent}`.slice(0, 1600);
    }

    function rng(seedValue) {
      let n = seedValue * 16807 % 2147483647;
      return () => {
        n = n * 16807 % 2147483647;
        return (n - 1) / 2147483646;
      };
    }

    function makeTile(tile) {
      const article = document.createElement("article");
      article.className = "tile";
      article.innerHTML = `
        <canvas width="224" height="224" aria-label="${tile.title}"></canvas>
        <div class="tile-foot">
          <div class="tile-head">
            <span class="name">${tile.title}</span>
            <span class="chip" data-role="count">0 labels</span>
          </div>
          <div class="bars" data-role="bars"></div>
        </div>
      `;
      tile.el = article;
      tile.canvas = article.querySelector("canvas");
      tile.bars = article.querySelector("[data-role='bars']");
      tile.count = article.querySelector("[data-role='count']");
      return article;
    }

    function drawScene(tile, index) {
      const ctx = tile.canvas.getContext("2d", { willReadFrequently: true });
      const w = tile.canvas.width;
      const h = tile.canvas.height;
      const random = rng(Number(seed.value) + index * 41);
      const jitter = Number(noise.value);

      ctx.clearRect(0, 0, w, h);
      const gradients = {
        garden: ["#244f44", "#dcb84f", "#c86b56"],
        kitchen: ["#2b3542", "#d7d2c1", "#3aaace"],
        road: ["#23272b", "#e7da62", "#d4483f"]
      }[scene.value];

      const bg = ctx.createLinearGradient(0, 0, w, h);
      bg.addColorStop(0, gradients[0]);
      bg.addColorStop(1, "#111416");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < 52 + jitter; i += 1) {
        ctx.fillStyle = `rgba(255,255,255,${0.025 + random() * 0.08})`;
        ctx.fillRect(random() * w, random() * h, 1 + random() * 5, 1 + random() * 5);
      }

      ctx.save();
      ctx.translate(w / 2 + (index - 1) * 13, h / 2 + (random() - 0.5) * jitter);
      ctx.rotate((index - 1) * 0.14 + (random() - 0.5) * 0.2);
      if (scene.value === "garden") {
        ctx.fillStyle = gradients[1];
        ctx.beginPath();
        ctx.ellipse(0, 18, 46, 72, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = gradients[2];
        ctx.beginPath();
        ctx.arc(-20, -22, 30, 0, Math.PI * 2);
        ctx.arc(20, -24, 30, 0, Math.PI * 2);
        ctx.fill();
      } else if (scene.value === "kitchen") {
        ctx.fillStyle = gradients[1];
        ctx.fillRect(-56, -48, 112, 96);
        ctx.fillStyle = gradients[2];
        ctx.beginPath();
        ctx.arc(0, 0, 38, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#101214";
        ctx.lineWidth = 9;
        ctx.strokeRect(-38, -30, 76, 60);
      } else {
        ctx.fillStyle = gradients[2];
        ctx.beginPath();
        ctx.moveTo(0, -66);
        ctx.lineTo(64, 44);
        ctx.lineTo(-64, 44);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = gradients[1];
        ctx.fillRect(-8, -28, 16, 54);
        ctx.fillRect(-8, 36, 16, 16);
      }
      ctx.restore();

      if (index === 2) {
        ctx.globalCompositeOperation = "screen";
        ctx.fillStyle = "rgba(58, 170, 206, 0.34)";
        ctx.fillRect(20, 26, 184, 32);
        ctx.globalCompositeOperation = "source-over";
      }
    }

    function fallbackClassify(canvas) {
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let warm = 0;
      let cool = 0;
      let bright = 0;
      let edge = 0;
      for (let i = 0; i < data.length; i += 16) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        warm += Math.max(0, r + g * 0.6 - b);
        cool += Math.max(0, b + g * 0.45 - r);
        bright += (r + g + b) / 3;
        edge += Math.abs(r - data[Math.max(0, i - 16)]) + Math.abs(g - data[Math.max(1, i - 15)]);
      }
      const total = warm + cool + bright + edge || 1;
      return [
        { categoryName: "warm object", displayName: "warm object", score: warm / total },
        { categoryName: "cool object", displayName: "cool object", score: cool / total },
        { categoryName: "bright region", displayName: "bright region", score: bright / total },
        { categoryName: "edge texture", displayName: "edge texture", score: edge / total }
      ].sort((a, b) => b.score - a.score);
    }

    function normalizeMediaPipeResult(result) {
      const categories = result?.classifications?.[0]?.categories || [];
      return categories.map((category) => ({
        categoryName: category.categoryName || category.displayName || `#${category.index}`,
        displayName: category.displayName || category.categoryName || `#${category.index}`,
        score: category.score || 0
      }));
    }

    async function loadMediaPipe() {
      loadButton.disabled = true;
      log("Loading MediaPipe ImageClassifier...");
      try {
        const visionModule = await import(`${CDN}/tasks-vision.esm.js`);
        const vision = await visionModule.FilesetResolver.forVisionTasks(`${CDN}/wasm`);
        state.classifier = await visionModule.ImageClassifier.createFromOptions(vision, {
          baseOptions: { modelAssetPath: MODEL },
          maxResults: 5,
          scoreThreshold: Number(threshold.value),
          runningMode: "IMAGE"
        });
        state.runtime = "mediapipe";
        modeChip.textContent = "MediaPipe ready";
        runtimeEl.textContent = "mediapipe";
        log("MediaPipe runtime is ready.");
        await classifyAll();
      } catch (error) {
        state.runtime = "fallback";
        runtimeEl.textContent = "fallback";
        modeChip.textContent = "Fallback mode";
        log(`MediaPipe load failed: ${error.message}`);
      } finally {
        loadButton.disabled = false;
      }
    }

    function renderResults() {
      let passed = 0;
      let best = null;
      const cutoff = Number(threshold.value);
      state.tiles.forEach((tile) => {
        const rows = (tile.results || []).filter((item) => item.score >= cutoff).slice(0, 5);
        passed += rows.length;
        if (rows[0] && (!best || rows[0].score > best.score)) best = rows[0];
        tile.count.textContent = `${rows.length} labels`;
        tile.bars.innerHTML = rows.map((item) => `
          <div class="bar-row">
            <span class="bar-label" title="${item.displayName}">${item.displayName}</span>
            <span class="bar-track"><span class="bar-fill" style="width:${Math.max(4, item.score * 100).toFixed(1)}%"></span></span>
            <span class="score">${item.score.toFixed(2)}</span>
          </div>
        `).join("") || `<p>No labels over threshold.</p>`;
      });
      passedEl.textContent = String(passed);
      topLabelEl.textContent = best?.displayName || "-";
    }

    async function classifyAll() {
      const start = performance.now();
      if (state.classifier) {
        await state.classifier.setOptions({ scoreThreshold: Number(threshold.value), maxResults: 5 });
      }
      state.tiles.forEach((tile) => {
        if (state.classifier) {
          tile.results = normalizeMediaPipeResult(state.classifier.classify(tile.canvas));
        } else {
          tile.results = fallbackClassify(tile.canvas);
        }
      });
      const elapsed = performance.now() - start;
      latencyEl.textContent = `${elapsed.toFixed(1)} ms`;
      renderResults();
      log(`Classified 3 generated canvases with ${state.runtime}.`);
    }

    function regenerate() {
      thresholdValue.textContent = Number(threshold.value).toFixed(2);
      noiseValue.textContent = noise.value;
      seedValue.textContent = seed.value;
      state.tiles.forEach(drawScene);
      classifyAll();
    }

    state.tiles.forEach((tile) => canvases.appendChild(makeTile(tile)));
    document.querySelector("#regenerate").addEventListener("click", regenerate);
    document.querySelector("#classify").addEventListener("click", classifyAll);
    document.querySelector("#load").addEventListener("click", loadMediaPipe);
    [scene, threshold, noise, seed].forEach((input) => input.addEventListener("input", regenerate));
    regenerate();
  </script>
</body>
</html>
