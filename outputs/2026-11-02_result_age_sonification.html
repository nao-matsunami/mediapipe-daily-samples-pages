<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Result Age Sonification</title><style>*{box-sizing:border-box}body{margin:0;background:#17141d;color:#f4edf8;font:16px/1.5 system-ui,sans-serif}main{max-width:950px;margin:auto;padding:30px}h1{font-size:clamp(30px,6vw,58px);line-height:1;margin:.2em 0;color:#ffca8c}.wrap{display:grid;grid-template-columns:1fr 300px;gap:18px}@media(max-width:700px){.wrap{grid-template-columns:1fr}}canvas,section{background:#231e2c;border:1px solid #4c405c;border-radius:18px}section{padding:18px}button{border:0;border-radius:10px;padding:11px 15px;background:#ffca8c;color:#302010;font-weight:bold;cursor:pointer}label{display:block;margin:17px 0}input{width:100%;accent-color:#ffca8c}.key{font-size:13px;color:#bdb0cb}.event{border-top:1px solid #493d55;padding:8px 0;font-size:13px}</style><main><div class="key">自作・ネットワーク不要 / 派生試作</div><h1>Result Age<br>Sonification</h1><p>推論結果の「新しさ」を見逃さないための聴覚的なメーターです。クリックで入力を発生させると、結果年齢に応じて色・位置・短い音が変わります。古い結果は低く濁った音になり、表示せずログに残します。</p><div class="wrap"><canvas id="cv" width="620" height="430"></canvas><section><button id="audio">音を有効にする</button><label>想定推論時間 <b id="ms">130</b> ms<input id="delay" type="range" min="30" max="500" value="130"></label><label>表示可能な年齢 <b id="limitV">220</b> ms<input id="limit" type="range" min="60" max="600" value="220"></label><p class="key">canvas をクリックして入力。緑は表示、紫は結果としては届いたが古く保持。音はユーザー操作後のみ鳴ります。</p><div id="log"></div></section></div><p class="key">次に足すなら: 実 MediaPipe callback の timestamp と、Web Audio の音量・パンを結び、アクセシビリティ設定として音なしでも同じ状態を色とテキストで提示する。</p></main><script>const c=document.querySelector('#cv'),x=c.getContext('2d'),log=document.querySelector('#log');let ac,events=[];for(const [i,o]of [['delay','ms'],['limit','limitV']])document.querySelector('#'+i).oninput=e=>document.querySelector('#'+o).textContent=e.target.value;document.querySelector('#audio').onclick=()=>{ac=new AudioContext();document.querySelector('#audio').textContent='音声オン'};function add(){let born=performance.now(),d=+delay.value;events.push({born,d,state:'pending'});setTimeout(()=>{let e=events.find(e=>e.born===born),age=performance.now()-born;e.state=age>+limit.value?'held':'shown';say(e,age);log.innerHTML='<div class="event">'+e.state.toUpperCase()+' · '+Math.round(age)+' ms · '+new Date().toLocaleTimeString()+'</div>'+log.innerHTML},d)}function say(e,age){if(!ac)return;let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=e.state==='shown'?480+Math.max(0,250-age):120;o.type=e.state==='shown'?'sine':'sawtooth';g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.09,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.22);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.24)}c.onclick=add;function frame(t){x.fillStyle='#17141d';x.fillRect(0,0,c.width,c.height);x.fillStyle='#bdb0cb';x.fillText('CLICK TO INJECT AN INPUT',22,30);events=events.filter(e=>t-e.born<2600);events.forEach((e,i)=>{let age=t-e.born,done=e.state!=='pending',p=Math.min(1,age/e.d),y=70+p*220,col=!done?'#ffca8c':e.state==='shown'?'#a8f5a1':'#cc93ff';x.fillStyle=col;x.beginPath();x.arc(70+i%8*70,y,13+age/55,0,7);x.fill();x.fillStyle='#f4edf8';x.fillText(Math.round(age)+'ms',50+i%8*70,y+42)});requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
