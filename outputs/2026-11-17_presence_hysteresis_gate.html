<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presence Hysteresis Gate</title><style>
:root{color-scheme:dark;--mint:#98f7c9;--sky:#82d5ff}*{box-sizing:border-box}body{margin:0;background:#07141d;color:#effbff;font:16px/1.5 system-ui}main{max-width:960px;margin:auto;padding:28px}.tag{font:700 12px ui-monospace;color:var(--mint);letter-spacing:.12em}h1{font-size:clamp(39px,7vw,70px);line-height:.9;margin:12px 0}.lead,.hint{color:#a9c5d2}.grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.card{padding:18px;border:1px solid #285b70;border-radius:20px;background:#0c2433}button{border:0;border-radius:10px;padding:10px;margin:3px;background:var(--mint);color:#08212b;font-weight:800;cursor:pointer}button.alt{background:#1a4052;color:#e5f9ff}input{width:100%;accent-color:var(--mint)}label{display:block;margin-top:16px;font:13px ui-monospace;color:#b5cfdb}canvas{width:100%;height:350px;background:#06131d;border-radius:14px}.state{font:700 28px ui-monospace;color:var(--mint)}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style><main><div class="tag">ORIGINAL / TEMPORAL ADMISSION TEST</div><h1>Presence<br>Hysteresis Gate</h1><p class="lead">ランドマークの presence を「しきい値一発」で扱わず、入場と退場を別の基準にする派生試作です。合成の揺れるスコアを流し、UI状態が細かく点滅しないことを確かめます。</p><section class="grid"><aside class="card"><b>ゲートを調整する</b><label>admit <output id="a">0.66</output><input id="admit" type="range" min=".2" max=".95" step=".01" value=".66"></label><label>release <output id="r">0.42</output><input id="release" type="range" min=".05" max=".8" step=".01" value=".42"></label><p><button id="steady">安定入力</button><button class="alt" id="noisy">境界ノイズ</button><button class="alt" id="drop">一時欠落</button></p><p class="state" id="state">WAIT</p><p class="hint" id="note">admit を超えて初めてON、release を下回って初めてOFFです。</p></aside><section class="card"><canvas id="plot" width="660" height="350"></canvas><p class="hint">次に足すなら: 実 Hand/Pose Landmarker の landmark presence、フレーム時刻、保持時間、操作取り消しのログを接続します。</p></section></section><script>
const $=s=>document.querySelector(s),c=$('#plot'),x=c.getContext('2d');let mode='steady',on=false,t=0,trace=[];function val(){const wave=mode==='steady'?.7+.12*Math.sin(t*.11):mode==='noisy'?.53+.2*Math.sin(t*.47)+.09*Math.sin(t*1.7):t%150<95?.72:.18;return Math.max(0,Math.min(1,wave))}function tick(){t++;const v=val(),a=+$('#admit').value,r=+$('#release').value;if(!on&&v>=a)on=true;if(on&&v<=r)on=false;trace.push({v,on});if(trace.length>150)trace.shift();$('#state').textContent=on?'ACTIVE':'WAIT';$('#state').style.color=on?'#98f7c9':'#82d5ff';$('#a').textContent=a.toFixed(2);$('#r').textContent=r.toFixed(2);draw(a,r)}function draw(a,r){x.fillStyle='#06131d';x.fillRect(0,0,660,350);const y=q=>310-q*260;x.strokeStyle='#275267';x.setLineDash([5,5]);[[a,'admit'],[r,'release']].forEach(([q,n])=>{x.beginPath();x.moveTo(35,y(q));x.lineTo(640,y(q));x.stroke();x.fillStyle='#9ab6c4';x.fillText(n+' '+q.toFixed(2),42,y(q)-7)});x.setLineDash([]);x.strokeStyle='#82d5ff';x.lineWidth=3;x.beginPath();trace.forEach((p,i)=>{const px=35+i*4.03,py=y(p.v);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();trace.forEach((p,i)=>{if(p.on){x.fillStyle='#98f7c9';x.fillRect(35+i*4.03,323,4,12)}});x.fillStyle='#9ab6c4';x.font='13px ui-monospace';x.fillText('blue = presence  /  green = admitted interaction frames',35,28)}['steady','noisy','drop'].forEach(id=>$('#'+id).onclick=()=>{mode=id;trace=[];on=false;$('#note').textContent=id==='noisy'?'境界付近でもON/OFFの往復を抑えるか観察します。':id==='drop'?'短い欠落でいつ操作を解放するかを調整します。':'ゆっくり変化する入力です。'});setInterval(tick,55);
</script></main></html>
