<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segmentation Capability Route</title><style>body{margin:0;background:#0d0c16;color:#f3efff;font:15px system-ui;padding:24px;max-width:850px;margin:auto}h1{margin:0}.sub{color:#beb5d8}.row{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.option{background:#1d1930;padding:13px;border-radius:12px;flex:1;min-width:170px}.route{font-size:26px;padding:20px;border:1px solid #7463a5;border-radius:14px;background:#151224}.ok{color:#7bf2c4}.warn{color:#ffd37a}.no{color:#ff8c9d}button{background:#40366c;color:#fff;border:0;padding:9px 13px;border-radius:8px;margin:4px}.bar{height:14px;background:#29223f;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#8e7cff;width:0%}small{color:#bbb0d0}</style><h1>Segmentation Capability Route</h1><p class="sub">浮動小数 mask 後処理、GPU、Worker を仮想化し、明示的な能力検査から安全な経路を選ぶ自作の設計プローブです。</p><div class="row"><div class="option"><b>GPU delegate</b><br><button data-k="gpu">切替</button><span id="gpu"></span></div><div class="option"><b>float mask support</b><br><button data-k="float">切替</button><span id="float"></span></div><div class="option"><b>Worker transfer</b><br><button data-k="worker">切替</button><span id="worker"></span></div></div><div class="route" id="route"></div><p id="why"></p><div class="bar"><i id="meter"></i></div><p><small id="budget"></small></p><button id="probe">能力を再検査</button><script>const s={gpu:true,float:true,worker:true};const $=x=>document.getElementById(x);function render(){for(const k in s)$(k).textContent=s[k]?' ✓ available':' — unavailable';let route,why,cost;if(s.gpu&&s.float){route='GPU mask → '+(s.worker?'Worker composite':'Main-thread composite');why='高速経路。ただし mask はそのフレームで描画・解放し、長時間計測を残す。';cost=s.worker?38:55}else if(s.gpu){route='GPU inference → category mask fallback';why='float mask 後処理を要求せず、カテゴリ色で合成する。能力不足を例外ではなく選択として表示。';cost=68}else{route='CPU inference → reduced cadence';why='GPU 非対応時は解像度または更新頻度を落とし、鮮度をUIに表示する。';cost=110}$('route').innerHTML='<b class="'+(cost<60?'ok':cost<90?'warn':'no')+'">'+route+'</b>';$('why').textContent=why;$('meter').style.width=Math.min(100,cost)+'%';$('budget').textContent='想定 1 結果 '+cost+'ms / '+(1000/cost).toFixed(1)+' 結果/秒。次は実機 feature probe と result age を接続。'}document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let k=b.dataset.k;s[k]=!s[k];render()});$('probe').onclick=()=>{document.body.animate([{opacity:.55},{opacity:1}],{duration:240});render()};render()</script>
