<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transform Matrix Storyboard</title>
<style>:root{color-scheme:dark;--ink:#edf4ff;--muted:#9baecb;--line:#31425f;--cyan:#6cd8ff;--pink:#ff91c7}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:var(--ink);font:15px/1.5 system-ui,sans-serif}.wrap{max-width:980px;margin:auto;padding:28px 18px}h1{margin:0;font-size:clamp(27px,5vw,44px)}p{color:var(--muted)}.grid{display:grid;grid-template-columns:250px 1fr;gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}.panel{background:#121b2d;border:1px solid var(--line);border-radius:15px;padding:16px}label{display:block;margin-bottom:17px}output{float:right;color:var(--cyan)}input{width:100%;accent-color:var(--cyan)}button{padding:9px 12px;border:1px solid #476d98;border-radius:8px;background:#193a5d;color:var(--ink);cursor:pointer}.board{height:330px;position:relative;overflow:hidden;border-radius:11px;background:radial-gradient(circle at 50% 40%,#254e7d,#0b1425 70%)}.card{position:absolute;width:145px;height:175px;left:50%;top:50%;border:2px solid var(--pink);border-radius:48% 48% 43% 43%;transform:translate(-50%,-50%);box-shadow:0 0 30px #ff91c755}.card:before{content:'canonical face';position:absolute;top:-28px;left:8px;color:#ffb8dc;font-size:12px;white-space:nowrap}.hat{position:absolute;left:23px;top:-14px;width:96px;height:42px;border:3px solid var(--cyan);border-bottom:0;border-radius:60px 60px 0 0}.axis{position:absolute;left:50%;top:50%;width:1px;height:1px}.axis i{position:absolute;width:80px;height:2px;background:var(--cyan);transform-origin:0 50%}.axis i:nth-child(2){background:#ff91c7;transform:rotate(90deg)}.read{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.read div{border:1px solid var(--line);border-radius:9px;padding:9px;color:var(--muted)}.read b{display:block;color:var(--ink);font-size:19px}.matrix{margin-top:13px;padding:11px;border:1px solid var(--line);border-radius:8px;font:12px/1.45 ui-monospace,monospace;color:#bcd2f0;white-space:pre}.hint{margin-top:15px;padding:11px;border-left:3px solid var(--cyan);background:#10233c;color:#c6ddf8}</style>
<body><main class="wrap"><h1>Transform Matrix Storyboard</h1><p>canonical な顔座標に小さな帽子を置き、変換の平行移動・回転・拡大を一枚の自作ストーリーボードとして読む派生試作です。数値は合成値で、実モデルの行列ではありません。</p><div class="grid"><section class="panel"><label>横移動 <output id="xo"></output><input id="x" type="range" min="-120" max="120" value="0"></label><label>回転 <output id="ro"></output><input id="r" type="range" min="-35" max="35" value="0"></label><label>スケール <output id="so"></output><input id="s" type="range" min=".55" max="1.45" step=".05" value="1"></label><button id="animate">ゆっくり自動再生</button><div class="hint">実装時は、行列の座標系・鏡像化・canvas CSS倍率を明示します。行列をそのまま信用せず、表示側の契約を小さく検証するための面です。</div></section><section class="panel"><div class="board"><div class="card" id="card"><i class="hat"></i></div><div class="axis" id="axis"><i></i><i></i></div></div><div class="read"><div><b id="tx"></b>translate X</div><div><b id="rr"></b>rotate Z</div><div><b id="ss"></b>scale</div></div><div class="matrix" id="matrix"></div></section></div></main><script>const $=x=>document.getElementById(x),ids=['x','r','s'];let auto=false,t=0;function update(){const x=+$('x').value,r=+$('r').value,s=+$('s').value,c=Math.cos(r*Math.PI/180)*s,q=Math.sin(r*Math.PI/180)*s;$('xo').textContent=x+' px';$('ro').textContent=r+'°';$('so').textContent=s.toFixed(2)+'×';$('card').style.transform=`translate(calc(-50% + ${x}px),-50%) rotate(${r}deg) scale(${s})`;$('axis').style.transform=`translate(${x}px,0) rotate(${r}deg)`;$('tx').textContent=x+' px';$('rr').textContent=r+'°';$('ss').textContent=s.toFixed(2);$('matrix').textContent=`[ ${c.toFixed(2)}  ${(-q).toFixed(2)}  0  ${(x/160).toFixed(2)} ]\n[ ${q.toFixed(2)}   ${c.toFixed(2)}  0  0.00 ]\n[  0.00  0.00  1  0.00 ]\n[  0.00  0.00  0  1.00 ]`}ids.forEach(i=>$(i).oninput=update);$('animate').onclick=()=>{auto=!auto;$('animate').textContent=auto?'停止':'ゆっくり自動再生'};function loop(){if(auto){t+=.018;$('x').value=Math.round(Math.sin(t)*85);$('r').value=Math.round(Math.sin(t*.8)*22);$('s').value=(1+Math.sin(t*1.5)*.2).toFixed(2);update()}requestAnimationFrame(loop)}update();loop();</script></body></html>
