<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks Vision Import WASM Probe</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
      background: #0b0f11;
      color: #f2f7f5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0b0f11; }
    main { width: min(1180px, 100%); margin: 0 auto; padding: 22px; }
    header { display: flex; justify-content: space-between; gap: 18px; align-items: end; border-bottom: 1px solid #263236; padding-bottom: 16px; }
    h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 3rem); line-height: 1.05; letter-spacing: 0; }
    h2 { margin: 0 0 12px; font-size: 1rem; letter-spacing: 0; }
    p { color: #aebcbb; line-height: 1.65; }
    button, select {
      border: 1px solid #405157;
      background: #151d20;
      color: #f2f7f5;
      min-height: 40px;
      padding: 9px 12px;
      font: inherit;
    }
    button { cursor: pointer; }
    button:hover { border-color: #77e0be; }
    .layout { display: grid; grid-template-columns: 340px 1fr; gap: 14px; margin-top: 16px; }
    .panel { border: 1px solid #263236; background: #101619; padding: 14px; }
    .controls { display: grid; gap: 10px; }
    label { display: grid; gap: 6px; color: #dbe7e4; font-size: .92rem; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .badge { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #405157; padding: 4px 8px; color: #dbe7e4; font-size: .78rem; }
    .good { color: #77e0be; }
    .warn { color: #ffd47a; }
    .bad { color: #ff8a8a; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .metric { border: 1px solid #263236; padding: 12px; min-height: 100px; background: #0d1214; }
    .metric strong { display: block; font-size: 1.7rem; margin-top: 8px; }
    .trace { display: grid; gap: 8px; margin-top: 12px; }
    .row { display: grid; grid-template-columns: 120px 1fr 82px; gap: 10px; align-items: center; border-top: 1px solid #263236; padding-top: 8px; }
    .bar { height: 16px; border: 1px solid #405157; background: #0a0d0f; overflow: hidden; }
    .bar > span { display: block; height: 100%; width: 0%; background: #77e0be; transition: width .2s ease; }
    .bar.warn > span { background: #ffd47a; }
    .bar.bad > span { background: #ff8a8a; }
    pre { min-height: 260px; overflow: auto; margin: 0; padding: 12px; background: #070a0b; border: 1px solid #263236; color: #cde2dc; white-space: pre-wrap; }
    canvas { width: 100%; height: 230px; border: 1px solid #263236; background: #070a0b; display: block; }
    @media (max-width: 820px) {
      main { padding: 14px; }
      header, .layout { display: grid; grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Tasks Vision Import WASM Probe</h1>
      <p>MediaPipe Tasks Web の初期化前に、ESM import、named exports、WASM path、version pin の状態をブラウザ内で確認する自作の最小プローブ。</p>
    </div>
    <span class="badge" id="status">idle</span>
  </header>

  <section class="layout">
    <aside class="panel controls">
      <label>Package version
        <select id="version">
          <option value="1.0.1">1.0.1 latest</option>
          <option value="0.10.34">0.10.34 legacy stable</option>
          <option value="0.10.22">0.10.22 old demos</option>
        </select>
      </label>
      <label>Import endpoint
        <select id="endpoint">
          <option value="+esm">jsDelivr +esm</option>
          <option value="">package root</option>
        </select>
      </label>
      <label>WASM path
        <select id="wasm">
          <option value="wasm">/wasm</option>
          <option value="wasm/vision_wasm_internal.wasm">vision_wasm_internal.wasm</option>
          <option value="wasm/tasks-vision.wasm">tasks-vision.wasm guess</option>
        </select>
      </label>
      <div class="actions">
        <button id="run">Run probe</button>
        <button id="matrix">Try matrix</button>
        <button id="clear">Clear</button>
      </div>
      <p>公式READMEは named import のTaskクラスと `FilesetResolver.forVisionTasks()` を使う流れを示す。ここでは推論前の破断点だけを小さく検査する。</p>
    </aside>

    <section class="panel">
      <div class="grid">
        <div class="metric"><span>Import</span><strong id="mImport">-</strong><small id="mImportSub">未実行</small></div>
        <div class="metric"><span>WASM</span><strong id="mWasm">-</strong><small id="mWasmSub">未実行</small></div>
        <div class="metric"><span>Route</span><strong id="mRoute">-</strong><small id="mRouteSub">未実行</small></div>
      </div>
      <div class="trace" id="trace"></div>
      <canvas id="chart" width="900" height="300" aria-label="probe timeline"></canvas>
      <pre id="log"></pre>
    </section>
  </section>
</main>

<script type="module">
  const $ = (id) => document.getElementById(id);
  const state = { rows: [] };
  const requiredExports = ["FilesetResolver", "FaceDetector", "HandLandmarker", "GestureRecognizer", "ImageSegmenter", "ImageEmbedder"];

  function endpointUrl(version = $("version").value, endpoint = $("endpoint").value) {
    const suffix = endpoint ? `/${endpoint}` : "";
    return `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${version}${suffix}`;
  }

  function wasmUrl(version = $("version").value, wasm = $("wasm").value) {
    return `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${version}/${wasm}`;
  }

  function log(line) {
    $("log").textContent += `${new Date().toLocaleTimeString()}  ${line}\n`;
  }

  function setMetric(prefix, value, sub, tone = "") {
    $(`m${prefix}`).textContent = value;
    $(`m${prefix}`).className = tone;
    $(`m${prefix}Sub`).textContent = sub;
  }

  function addRow(label, score, detail, tone = "") {
    const row = { label, score, detail, tone };
    state.rows.push(row);
    renderRows();
    drawChart();
  }

  function renderRows() {
    $("trace").innerHTML = state.rows.slice(-10).map((row) => `
      <div class="row">
        <strong>${row.label}</strong>
        <div class="bar ${row.tone}"><span style="width:${Math.max(0, Math.min(100, row.score))}%"></span></div>
        <span class="${row.tone}">${row.detail}</span>
      </div>
    `).join("");
  }

  function drawChart() {
    const canvas = $("chart");
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#070a0b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "#263236";
    for (let x = 0; x <= canvas.width; x += 90) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvas.height);
      ctx.stroke();
    }
    const rows = state.rows.slice(-12);
    rows.forEach((row, i) => {
      const x = 30 + i * 70;
      const h = row.score * 2.1;
      ctx.fillStyle = row.tone === "bad" ? "#ff8a8a" : row.tone === "warn" ? "#ffd47a" : "#77e0be";
      ctx.fillRect(x, 250 - h, 42, h);
      ctx.fillStyle = "#cde2dc";
      ctx.font = "12px system-ui";
      ctx.fillText(row.label.slice(0, 8), x - 2, 276);
    });
  }

  async function fetchStatus(url) {
    try {
      const response = await fetch(url, { method: "HEAD", cache: "no-store" });
      return response.status;
    } catch {
      const response = await fetch(url, { method: "GET", cache: "no-store" });
      return response.status;
    }
  }

  async function runProbe(version = $("version").value, endpoint = $("endpoint").value, wasm = $("wasm").value) {
    $("status").textContent = "running";
    const importTarget = endpointUrl(version, endpoint);
    const wasmTarget = wasmUrl(version, wasm);
    log(`import ${importTarget}`);
    let importOk = false;
    let exportScore = 0;
    let hasDefault = false;
    try {
      const started = performance.now();
      const mod = await import(importTarget);
      const elapsed = Math.round(performance.now() - started);
      hasDefault = Object.prototype.hasOwnProperty.call(mod, "default");
      const found = requiredExports.filter((name) => Boolean(mod[name]));
      exportScore = Math.round((found.length / requiredExports.length) * 100);
      importOk = found.includes("FilesetResolver");
      setMetric("Import", importOk ? "OK" : "PARTIAL", `${found.length}/${requiredExports.length} exports, ${elapsed}ms`, importOk ? "good" : "warn");
      addRow(`${version} import`, exportScore, `${found.length}/${requiredExports.length}`, importOk ? "good" : "warn");
      log(`exports: ${found.join(", ") || "none"}`);
      log(`default export: ${hasDefault ? "present" : "absent"}`);
    } catch (error) {
      setMetric("Import", "FAIL", error.message.slice(0, 64), "bad");
      addRow(`${version} import`, 8, "fail", "bad");
      log(`import failed: ${error.message}`);
    }

    log(`wasm ${wasmTarget}`);
    let wasmOk = false;
    try {
      const status = await fetchStatus(wasmTarget);
      wasmOk = status >= 200 && status < 400;
      setMetric("Wasm", wasmOk ? "OK" : String(status), wasmTarget.split("@mediapipe/tasks-vision@")[1], wasmOk ? "good" : "warn");
      addRow(`${version} wasm`, wasmOk ? 100 : 40, String(status), wasmOk ? "good" : "warn");
      log(`wasm status: ${status}`);
    } catch (error) {
      setMetric("Wasm", "FAIL", error.message.slice(0, 64), "bad");
      addRow(`${version} wasm`, 8, "fail", "bad");
      log(`wasm failed: ${error.message}`);
    }

    const route = importOk && wasmOk ? "Use" : importOk ? "Fix WASM" : endpoint ? "Fallback" : "+esm";
    const routeTone = route === "Use" ? "good" : route === "Fallback" || route === "+esm" ? "warn" : "bad";
    setMetric("Route", route, hasDefault ? "default export present" : "named exports expected", routeTone);
    $("status").textContent = "done";
    return { importOk, wasmOk, route };
  }

  async function tryMatrix() {
    state.rows = [];
    renderRows();
    drawChart();
    $("log").textContent = "";
    const versions = ["1.0.1", "0.10.34", "0.10.22"];
    for (const version of versions) {
      await runProbe(version, "+esm", "wasm");
    }
  }

  $("run").addEventListener("click", () => runProbe());
  $("matrix").addEventListener("click", tryMatrix);
  $("clear").addEventListener("click", () => {
    state.rows = [];
    $("log").textContent = "";
    setMetric("Import", "-", "未実行");
    setMetric("Wasm", "-", "未実行");
    setMetric("Route", "-", "未実行");
    renderRows();
    drawChart();
  });
  drawChart();
</script>
</body>
</html>
