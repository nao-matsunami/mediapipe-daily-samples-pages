<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interruptible Phrase Timeline</title><style>:root{color-scheme:dark;--bg:#10101c;--ink:#f7f2ff;--muted:#b9b4ce;--violet:#c6adff;--mint:#98f5cf;--hot:#ff9ab2}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#19142a,var(--bg));color:var(--ink);font:16px/1.5 system-ui}main{max-width:1000px;margin:auto;padding:28px}.tag{font:700 12px ui-monospace;letter-spacing:.14em;color:var(--mint)}h1{font-size:clamp(38px,7vw,72px);line-height:.9;margin:12px 0}.lead,.muted{color:var(--muted)}.card{background:#191728;border:1px solid #484162;border-radius:20px;padding:18px}button{border:0;border-radius:10px;padding:10px 13px;margin:3px;background:var(--violet);font-weight:800;cursor:pointer}button.danger{background:var(--hot)}canvas{display:block;width:100%;height:auto;background:#0d0c16;border-radius:13px;margin:15px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.state{font:700 17px ui-monospace;color:var(--mint)}code{color:var(--violet)}</style><main><div class="tag">DERIVATIVE / STREAM INTERRUPTION SKETCH</div><h1>Interruptible<br>Phrase Timeline</h1><p class="lead">「新しい入力が来たら、途中の発話・表示はどこまで残すか」を粒度ごとに試す派生スケッチです。生成物そのものではなく、利用者が理解を保てる“区切り”を残すことに焦点を置きます。</p><section class="card"><div class="row"><button id="add">新しいフレーズを投入</button><button id="interrupt" class="danger">いま割り込む</button><button id="reset">最初から</button><span class="state" id="state">READY</span></div><canvas id="view" width="880" height="370"></canvas><p class="muted">紫=完了した語、緑=いま提示中、赤=割り込みで省略した末尾。次に足すなら、実TTSの語境界イベント、字幕の確定/暫定表示、音量フェード、アクセシビリティ用の操作ログをつなげます。</p></section><script>const $=s=>document.querySelector(s),c=$('#view'),g=c.getContext('2d');let phrases=[['姿勢','を','検出','しました'],['次の','操作','を','待って','います'],['右手','の','動き','を','記録','します']],pi=0,wi=0,items=[],last=0,run=false;function start(){if(!run){run=true;$('#state').textContent='PLAYING'}}function phrase(){return phrases[pi%phrases.length]}function step(t){if(run&&t-last>390){last=t;let a=phrase();if(wi<a.length){items.forEach(x=>x.type==='live'&&(x.type='done'));items.push({word:a[wi++],type:'live'});if(items.length>18)items.shift()}else{items.forEach(x=>x.type==='live'&&(x.type='done'));pi++;wi=0}}draw();requestAnimationFrame(step)}function draw(){g.fillStyle='#0d0c16';g.fillRect(0,0,880,370);g.font='13px ui-monospace';g.fillStyle='#b9b4ce';g.fillText('CURRENT PHRASE / interruption retains completed units',25,35);let x=28,y=76;items.forEach((o,i)=>{let col=o.type==='done'?'#c6adff':o.type==='live'?'#98f5cf':'#ff9ab2';g.fillStyle=col;g.beginPath();g.roundRect(x,y,64,55,12);g.fill();g.fillStyle='#151220';g.font='700 22px system-ui';g.font='700 13px system-ui';g.fillText(o.word,x+5,y+33);x+=75;if(x>790){x=28;y+=70}});g.fillStyle='#484162';g.fillRect(28,295,824,2);g.fillStyle='#b9b4ce';g.font='14px ui-monospace';g.fillText('phrase '+(pi+1)+' / unit '+wi+'   |   completed words are stable; pending tail can be cancelled',28,330)}$('#add').onclick=()=>{phrases.push(['新しい','入力','で','文脈','を','更新','します']);start()};$('#interrupt').onclick=()=>{if(items.length){items=items.filter(x=>x.type==='done');pi++;wi=0;run=false;$('#state').textContent='INTERRUPTED — completed units kept'}};$('#reset').onclick=()=>{pi=0;wi=0;items=[];run=false;$('#state').textContent='READY'};requestAnimationFrame(step);</script></main></html>
