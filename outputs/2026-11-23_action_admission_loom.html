<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Action Admission Loom</title><style>:root{color-scheme:dark;--bg:#08131c;--card:#102735;--line:#315264;--ink:#edf8fb;--muted:#9bb6c2;--a:#7af1ce;--b:#ffd27b;--bad:#ff9baa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#24485a,transparent 36%),var(--bg);color:var(--ink);font:16px/1.5 system-ui}main{max-width:1080px;margin:auto;padding:30px}.tag,label{font:700 12px ui-monospace;letter-spacing:.11em;color:var(--a)}h1{font-size:clamp(38px,7vw,70px);line-height:.92;margin:12px 0}.lead,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:270px 1fr;gap:16px}.card{background:#102735e8;border:1px solid var(--line);border-radius:20px;padding:18px}label{display:block;margin:14px 0}input{width:100%;accent-color:var(--a)}button{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#183d4d;color:var(--ink);font-weight:700;cursor:pointer}.state{font:700 23px ui-monospace;color:var(--a)}canvas{display:block;width:100%;height:auto;background:#071117;border-radius:14px;touch-action:none}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:5px 8px;border:1px solid var(--line);border-radius:999px;font:12px ui-monospace;color:var(--muted)}.chip.ok{border-color:var(--a);color:var(--a)}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><div class="tag">ORIGINAL / GESTURE RECOGNIZER ACTION POLICY</div><h1>Action Admission<br>Loom</h1><p class="lead">分類ラベルをすぐ操作にしない最小試作です。キャンバスを動かすと、確信度・結果年齢・指先の静止・再発火待ちを一枚の「入場券」として織ります。</p><section class="grid"><aside class="card"><label>確信度 <output id="co">.78</output><input id="confidence" type="range" min=".1" max="1" step=".01" value=".78"></label><label>結果年齢 <output id="ao">70</output> ms<input id="age" type="range" min="0" max="420" value="70"></label><label>静止判定の余白 <output id="so">.045</output><input id="still" type="range" min=".01" max=".20" step=".005" value=".045"></label><label>再発火待ち <output id="ro">900</output> ms<input id="rest" type="range" min="200" max="2000" step="50" value="900"></label><button id="reset">RESET EVENTS</button><p class="state" id="state">MOVE THE TOKEN</p><div class="chips" id="chips"></div><p class="muted" id="stats"></p></aside><section class="card"><canvas id="view" width="720" height="430"></canvas><p class="muted">次に足すなら、実際のGesture Recognizerのcategory score、Hand Landmarkerの指先速度、<code>detectForVideo</code>のtimestampを同じイベントに記録します。採用/不採用の理由を残すと、閾値を変えたときの誤発火も説明できます。</p></section></section><script>const $=s=>document.querySelector(s),c=$('#view'),g=c.getContext('2d');let x=.5,y=.5,px=.5,py=.5,last=0,lastFire=-9999,fires=0,events=[];c.onpointermove=e=>{const r=c.getBoundingClientRect();x=Math.max(.04,Math.min(.96,(e.clientX-r.left)/r.width));y=Math.max(.06,Math.min(.94,(e.clientY-r.top)/r.height))};c.onpointerdown=c.onpointermove;$('#reset').onclick=()=>{fires=0;events=[];lastFire=-9999};function loop(t){const conf=+$('#confidence').value,age=+$('#age').value,still=+$('#still').value,rest=+$('#rest').value;$('#co').textContent=conf.toFixed(2);$('#ao').textContent=age;$('#so').textContent=still.toFixed(3);$('#ro').textContent=rest;const speed=Math.hypot(x-px,y-py)*1000/Math.max(16,t-last);const checks=[['SCORE',conf>=.65],['FRESH',age<=160],['STILL',speed<=still],['READY',t-lastFire>=rest]];const pass=checks.every(v=>v[1]);if(pass&&t-lastFire>rest){lastFire=t;fires++;events.push({t,x,y});if(events.length>18)events.shift()}$('#chips').innerHTML=checks.map(v=>'<span class="chip '+(v[1]?'ok':'')+'">'+v[0]+'</span>').join('');$('#state').textContent=pass?'ADMIT ACTION':'HOLD RESULT';$('#state').style.color=pass?'#7af1ce':'#ff9baa';$('#stats').textContent='fires '+fires+' · fingertip speed '+speed.toFixed(3)+' · '+(pass?'all contracts met':'inspect the failing badge');g.fillStyle='#071117';g.fillRect(0,0,720,430);g.strokeStyle='#244454';for(let i=0;i<9;i++){g.beginPath();g.moveTo(50+i*78,45);g.lineTo(50+i*78,365);g.stroke()}for(let i=0;i<5;i++){g.beginPath();g.moveTo(45,70+i*66);g.lineTo(675,70+i*66);g.stroke()}g.fillStyle='rgba(122,241,206,.12)';g.beginPath();g.arc(x*620+50,y*280+65,Math.max(18,80-speed*800),0,7);g.fill();g.fillStyle=pass?'#7af1ce':'#ffd27b';g.beginPath();g.arc(x*620+50,y*280+65,20,0,7);g.fill();g.fillStyle='#071117';g.font='700 11px ui-monospace';g.textAlign='center';g.fillText(pass?'GO':'WAIT',x*620+50,y*280+69);g.textAlign='start';g.fillStyle='#edf8fb';g.font='700 15px ui-monospace';g.fillText('live candidate',48,34);g.fillStyle='#9bb6c2';g.font='12px ui-monospace';g.fillText('accepted action history →',48,403);g.strokeStyle='#bbaaff';g.lineWidth=2;g.beginPath();events.forEach((e,i)=>{const ex=48+i*34,ey=391-e.y*36;i?g.lineTo(ex,ey):g.moveTo(ex,ey)});g.stroke();px+=(x-px)*.24;py+=(y-py)*.24;last=t;requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></main></html>
