<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Model Prefetch Consent Router</title><style>
:root{color-scheme:dark;--bg:#0b1020;--card:#121c32;--line:#2d4266;--ink:#edf5ff;--muted:#9cb0cb;--go:#70e2a6;--wait:#ffc86a;--no:#ff7d91}*{box-sizing:border-box}body{margin:0;background:linear-gradient(130deg,#101c3d,#090d18 58%);color:var(--ink);font:15px/1.5 system-ui}main{max-width:900px;margin:auto;padding:32px 18px}h1{margin:0;font-size:clamp(1.8rem,5vw,3rem)}.lead{color:var(--muted);max-width:67ch}.grid{display:grid;grid-template-columns:280px 1fr;gap:16px;margin-top:22px}.card{padding:17px;border:1px solid var(--line);background:var(--card);border-radius:16px}label{display:block;margin-top:13px;color:var(--muted)}input{width:100%;accent-color:#7cb8ff}.choices{display:grid;gap:10px}.choice{padding:14px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.choice:has(input:checked){border-color:#6da9d9;background:#152943}.choice b{display:block}.decision{font-size:1.8rem;font-weight:800;padding:14px;border-radius:12px;margin-bottom:14px}.go{background:#103225;color:var(--go)}.wait{background:#382b12;color:var(--wait)}.no{background:#3a1722;color:var(--no)}.meter{height:12px;background:#07101e;border-radius:9px;overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;background:linear-gradient(90deg,#73c7ff,#b1ef7d)}.small{font-size:.88rem;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style><main><p class="small">ORIGINAL WEB ML PROTOTYPE · local decision simulator</p><h1>Model Prefetch<br>Consent Router</h1><p class="lead">「速くしたい」だけではモデル先読みを決めません。接続・保存領域・明示的な先読み同意を同時に見て、MediaPipe Tasks の asset を今取るか、利用時まで待つかを透明に選ぶ試作です。</p><div class="grid"><section class="card"><label>接続種別</label><div class="choices" id="network"><label class="choice"><input type="radio" name="n" value="wifi" checked><b>Wi‑Fi</b>無制限に近い接続</label><label class="choice"><input type="radio" name="n" value="cell"><b>モバイル回線</b>通信量の影響あり</label><label class="choice"><input type="radio" name="n" value="save"><b>Data Saver</b>節約を優先</label></div><label>空き領域 <output id="storageOut">24</output> MB</label><input id="storage" type="range" min="2" max="60" value="24"><label><input id="consent" type="checkbox"> 将来の利用を速くするため、モデル先読みを許可</label></section><section class="card"><div id="decision" class="decision"></div><div id="why"></div><p><b>予想される待機の内訳</b></p><span class="small">今の画面で取得</span><div class="meter"><i id="now"></i></div><span class="small">利用開始時に取得</span><div class="meter"><i id="later"></i></div><p class="small" id="next"></p></section></div></main><script>
const $=x=>document.getElementById(x);function render(){const n=document.querySelector('input[name=n]:checked').value, storage=+$('storage').value, consent=$('consent').checked;let mode,why;if(!consent){mode='待機';why='明示的な先読み許可がないため、必要になるまで asset を取得しません。'}else if(n==='save'){mode='待機';why='Data Saver が有効なため、利用者の節約設定を先読みより優先します。'}else if(storage<12){mode='待機';why=`空き領域 ${storage} MB は安全余白を下回るため、キャッシュを増やしません。`}else if(n==='cell'){mode='確認して先読み';why='モバイル回線です。サイズと通信量を表示した確認を挟む設計が適します。'}else{mode='先読み可';why='Wi‑Fi・同意・空き領域の条件を満たしています。バックグラウンドの低優先度取得候補です。'}const cls=mode==='先読み可'?'go':mode==='確認して先読み'?'wait':'no';$('decision').className='decision '+cls;$('decision').textContent=mode;$('why').textContent=why;const now=mode==='先読み可'?78:mode==='確認して先読み'?42:0;$('now').style.width=now+'%';$('later').style.width=(100-now)+'%';$('next').textContent=mode==='待機'?'次に足すなら: Storage API の実測値と、利用者が後で変更できる cache 管理画面。':'次に足すなら: 実際の FilesetResolver / モデル取得を低優先度キューへ接続し、取消と進捗を表示。'}$('storageOut').textContent=storage}$('storage').oninput=render;$('consent').onchange=render;document.querySelectorAll('input[name=n]').forEach(e=>e.onchange=render);render();
</script></html>
