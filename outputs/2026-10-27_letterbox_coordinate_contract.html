<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letterbox Coordinate Contract</title><style>
:root{color-scheme:dark;--bg:#08111d;--p:#122036;--line:#2d4b6a;--ink:#eff6ff;--mut:#9cb1ca;--cyan:#83dfff;--pink:#ff9fcf;--lime:#88e6af}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}.wrap{max-width:980px;margin:auto;padding:26px 16px}h1{margin:0;font-size:clamp(25px,5vw,42px)}p{color:var(--mut)}.grid{display:grid;grid-template-columns:1fr 280px;gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:16px}.stage{height:380px;position:relative;border-radius:11px;overflow:hidden;background:#060d18;touch-action:none}.source{position:absolute;background:linear-gradient(135deg,#194264,#19325e 48%,#44265a);border:2px solid #83dfff}.source:before{content:'source video';position:absolute;top:8px;left:9px;color:#bfeaff;font-size:12px}.mark{position:absolute;width:18px;height:18px;border:3px solid var(--pink);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 16px #ff9fcf}.cross{position:absolute;width:1px;height:100%;background:#ff9fcf66;left:50%}.cross:after{content:'';position:absolute;width:100%;height:1px;background:#ff9fcf66;top:50%;left:-50%}label{display:block;margin-bottom:16px}input{width:100%;accent-color:var(--cyan)}output{float:right;color:var(--cyan)}button{padding:9px 11px;border:1px solid #3c7199;background:#153b59;color:var(--ink);border-radius:8px;cursor:pointer}.rows{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font:13px ui-monospace,monospace;color:#bed0e7}.rows b{color:var(--lime)}.tip{margin-top:14px;border-left:3px solid var(--pink);padding-left:10px;color:#c8d8ea}
</style><body><main class="wrap"><h1>Letterbox Coordinate Contract</h1><p>派生試作：ポインタを動かし、CSS表示面・letterbox・正規化された推論結果の対応を確認する座標較正UIです。実カメラやモデルは使いません。</p><div class="grid"><section class="card"><div class="stage" id="stage"><div class="source" id="source"><div class="cross"></div><div class="mark" id="mark"></div></div></div><div class="rows" id="readout"></div><div class="tip">次に足すなら、MediaPipeの実landmarkとvideo要素の表示領域を結び、鏡像プレビューとreported xを別々に切り替えて記録します。</div></section><section class="card"><label>ソース比率 <output id="ratioOut">16:9</output><input id="ratio" type="range" min="0" max="2" step="1" value="0"></label><label>プレビューを鏡像化 <output id="mirrorOut">OFF</output><input id="mirror" type="checkbox"></label><button id="center">中央に戻す</button><p>黒帯の上では結果を更新しません。これは「クリック座標＝入力座標」と仮定しないための最小ルールです。</p></section></div></main><script>
const $=x=>document.getElementById(x),ratios=[[16,9,'16:9'],[4,3,'4:3'],[9,16,'9:16']];let pt={x:.5,y:.5};function layout(){const s=$('stage'),r=ratios[+$('ratio').value],sw=s.clientWidth,sh=s.clientHeight,scale=Math.min(sw/r[0],sh/r[1]),w=r[0]*scale,h=r[1]*scale,src=$('source');src.style.width=w+'px';src.style.height=h+'px';src.style.left=(sw-w)/2+'px';src.style.top=(sh-h)/2+'px';src.style.transform=$('mirror').checked?'scaleX(-1)':'none';$('ratioOut').textContent=r[2];$('mirrorOut').textContent=$('mirror').checked?'ON':'OFF';render(w,h,src.offsetLeft,src.offsetTop)}function render(w,h,l,t){const mark=$('mark'),displayX=pt.x*w,reportedX=$('mirror').checked?1-pt.x:pt.x;mark.style.left=displayX+'px';mark.style.top=(pt.y*h)+'px';$('readout').innerHTML=`<b>normalized result</b> x=${reportedX.toFixed(3)} y=${pt.y.toFixed(3)}<br>source pixel x=${Math.round(pt.x*w)} y=${Math.round(pt.y*h)}<br>CSS offset left=${Math.round(l)} top=${Math.round(t)} / black bars are ignored`;}
function hit(e){const s=$('stage'),src=$('source'),b=s.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,l=src.offsetLeft,t=src.offsetTop,w=src.clientWidth,h=src.clientHeight;if(x<l||x>l+w||y<t||y>t+h)return;let nx=(x-l)/w;if($('mirror').checked)nx=1-nx;pt={x:nx,y:(y-t)/h};layout()}$('stage').onpointerdown=e=>{e.currentTarget.setPointerCapture(e.pointerId);hit(e)};$('stage').onpointermove=e=>{if(e.buttons)hit(e)};$('ratio').oninput=layout;$('mirror').onchange=layout;$('center').onclick=()=>{pt={x:.5,y:.5};layout()};new ResizeObserver(layout).observe($('stage'));layout();
</script></body></html>
