<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Result Age Overlay Mixer</title><style>:root{color-scheme:dark;--bg:#0a0f1c;--p:#141e31;--l:#2d4568;--c:#8cd7ff;--w:#ffbd70}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf4ff;font:15px/1.5 system-ui,sans-serif}.wrap{max-width:920px;margin:auto;padding:26px 16px}h1{margin:0;font-size:clamp(25px,5vw,42px)}p{color:#9eb0ca}.grid{display:grid;grid-template-columns:1fr 290px;gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:16px}.stage{height:330px;position:relative;overflow:hidden;border-radius:12px;background:radial-gradient(circle at 35% 30%,#254364,#0d1729 62%)}.face{position:absolute;left:50%;top:52%;width:145px;height:185px;border:3px solid var(--c);border-radius:48% 48% 44% 44%;transform:translate(-50%,-50%);box-shadow:0 0 32px #61beff77}.eye{position:absolute;top:64px;width:16px;height:16px;border:2px solid var(--c);border-radius:50%}.eye:first-child{left:34px}.eye:nth-child(2){right:34px}.mouth{position:absolute;left:45px;bottom:38px;width:50px;height:22px;border-bottom:3px solid var(--c);border-radius:50%}.badge{position:absolute;top:15px;left:15px;padding:7px 10px;background:#07111dcc;border:1px solid var(--l);border-radius:20px;font-variant-numeric:tabular-nums}.agebar{position:absolute;bottom:0;left:0;height:7px;background:var(--c);transition:.1s}.controls label{display:block;margin:0 0 16px;color:#c9d8ee}.controls input{width:100%;accent-color:var(--c)}output{float:right;color:var(--c)}button{padding:9px 12px;border-radius:8px;border:1px solid var(--l);background:#193556;color:#edf4ff;cursor:pointer}.status{margin-top:16px;border-top:1px solid var(--l);padding-top:12px}.status b{display:block;font-size:21px}.tip{margin-top:15px;color:#b9cbe4;border-left:3px solid var(--w);padding-left:10px}</style><body><main class="wrap"><h1>Result Age Overlay Mixer</h1><p>派生試作：推論の新鮮さを「隠れた内部状態」にせず、overlay の彩度・破線・年齢バーとして見せるUI実験です。</p><div class="grid"><section class="card"><div class="stage" id="stage"><div class="badge" id="badge">結果年齢 0 ms</div><div class="face" id="face"><i class="eye"></i><i class="eye"></i><i class="mouth"></i></div><div class="agebar" id="bar"></div></div><div class="tip">次に足すなら、実FaceLandmarkerのtimestampとvideo.currentTimeを結び、フレーム落ち・バックグラウンド復帰も同じ表示規約で扱います。</div></section><section class="card controls"><label>新規結果の間隔 <output id="intervalOut">280 ms</output><input id="interval" type="range" min="80" max="1600" step="40" value="280"></label><label>古いと見なす年齢 <output id="staleOut">600 ms</output><input id="stale" type="range" min="200" max="2000" step="50" value="600"></label><button id="toggle">一時停止</button><button id="burst">1回だけ遅延</button><div class="status"><span>表示契約</span><b id="state">FRESH</b><span id="detail">現在の推論結果</span></div></section></div></main><script>const $=x=>document.getElementById(x);let last=performance.now(),paused=false,delay=false;function draw(now){const inter=+$('interval').value,stale=+$('stale').value;if(!paused&&now-last>inter+(delay?stale:0)){last=now;delay=false}const age=Math.round(now-last),ratio=Math.min(1,age/stale),fresh=age<stale;const f=$('face');f.style.borderColor=fresh?`hsl(${200-ratio*35} 95% ${74-ratio*18}%)`:'#ffbd70';f.style.opacity=fresh?1:.48;f.style.borderStyle=fresh?'solid':'dashed';$('bar').style.width=(ratio*100)+'%';$('bar').style.background=fresh?'#8cd7ff':'#ffbd70';$('badge').textContent='結果年齢 '+age+' ms';$('state').textContent=fresh?'FRESH':'STALE';$('state').style.color=fresh?'#8cd7ff':'#ffbd70';$('detail').textContent=fresh?'現在の推論結果':'表示中だが古い結果';requestAnimationFrame(draw)}$('interval').oninput=()=>$('intervalOut').textContent=$('interval').value+' ms';$('stale').oninput=()=>$('staleOut').textContent=$('stale').value+' ms';$('interval').oninput();$('stale').oninput();$('toggle').onclick=()=>{paused=!paused;$('toggle').textContent=paused?'再開':'一時停止'};$('burst').onclick=()=>delay=true;requestAnimationFrame(draw);</script></body></html>
