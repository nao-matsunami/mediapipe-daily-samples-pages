<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retrieval Diversity Dial</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--card:#101a2b;--line:#2b3d59;--ink:#edf3ff;--muted:#9cacbd;--violet:#bca9ff;--cyan:#7ce5ff;--pink:#ff8fbb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#242052,var(--bg) 55%);color:var(--ink);font:15px/1.5 ui-monospace,monospace}.wrap{max-width:960px;margin:auto;padding:28px}h1{font-size:clamp(24px,4vw,40px);margin:0}.lead{color:var(--muted);max-width:75ch}.grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:16px;margin-top:22px}@media(max-width:740px){.grid{grid-template-columns:1fr}}.card{background:#0c1423d9;border:1px solid var(--line);border-radius:17px;padding:17px}label{display:block;color:var(--muted);margin:8px 0 3px}input{width:100%;accent-color:var(--violet)}button{font:inherit;font-weight:800;background:var(--violet);border:0;border-radius:9px;padding:10px 13px;cursor:pointer;color:#171127;margin-top:14px}.result{border:1px solid var(--line);padding:11px;border-radius:11px;margin:8px 0;background:#101c30}.bar{height:7px;background:#202d44;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));border-radius:99px}.tag{color:var(--cyan);font-size:12px}.score{float:right;color:var(--violet)}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{border:1px solid var(--line);padding:9px;border-radius:10px;min-width:110px}.n{font-size:23px;color:var(--cyan)}code{color:var(--pink)}
</style><body><main class="wrap"><h1>Retrieval Diversity Dial</h1><p class="lead">Web の Semantic Retriever を想定し、関連度だけで上位を並べる結果と、似すぎた候補を少し避ける結果を比較する自作試作です。これは検索モデルそのものではなく、embedding の距離を受け取った後の表示方針を確かめる小さな UI です。</p><div class="grid"><section class="card"><label>多様性を優先 <output id="divOut">0.45</output></label><input id="div" type="range" min="0" max="1" step=".05" value=".45"><label>表示件数 <output id="countOut">4</output></label><input id="count" type="range" min="2" max="6" step="1" value="4"><button id="shuffle">候補の揺らぎを入れる</button><div class="stats"><div class="stat"><small>平均関連度</small><div id="rel" class="n">—</div></div><div class="stat"><small>平均重複</small><div id="dup" class="n">—</div></div><div class="stat"><small>選択 cluster</small><div id="clusters" class="n">—</div></div></div><p class="lead">多様性 0 は score 順、1 に近づくほど既選択との重複を引きます。次に足すなら <code>UniversalEmbedder</code> の実ベクトルと、ユーザーが保存した候補を接続します。</p></section><section class="card"><div id="list" aria-live="polite"></div></section></div></main><script>
const $=id=>document.getElementById(id);let docs=[['手の形を音にする',.94,'gesture'],['手の動きを粒子にする',.89,'gesture'],['姿勢で画面を切り替える',.86,'pose'],['マスクで背景をぼかす',.82,'mask'],['カメラ遅延を見せる',.79,'runtime'],['類似画像を探索する',.76,'retrieval'],['ランドマークを線にする',.73,'gesture'],['端末内で結果を保存する',.68,'privacy']].map(([name,score,cluster])=>({name,score,cluster}));
['div','count'].forEach(id=>$(id).oninput=()=>{$(id+'Out').value=$(id).value;render()});$('shuffle').onclick=()=>{docs=docs.map(d=>({...d,score:Math.max(.45,Math.min(.99,d.score+(Math.random()-.5)*.16))}));render()};function render(){const diversity=+$('div').value,n=+$('count').value,pool=[...docs],picked=[];while(picked.length<n&&pool.length){let best,bv=-9;for(const d of pool){const same=picked.filter(p=>p.cluster===d.cluster).length;const value=d.score-diversity*(same?.22*same:0);if(value>bv){bv=value;best=d}}picked.push({...best,value:bv});pool.splice(pool.indexOf(best),1)}$('list').innerHTML=picked.map((d,i)=>`<article class="result"><span class="tag">#${i+1} · ${d.cluster}</span><span class="score">${d.score.toFixed(2)}</span><br>${d.name}<div class="bar"><i style="width:${d.score*100}%"></i></div></article>`).join('');$('rel').textContent=(picked.reduce((a,d)=>a+d.score,0)/picked.length).toFixed(2);const duplicate=picked.length-[...new Set(picked.map(d=>d.cluster))].length;$('dup').textContent=duplicate;$('clusters').textContent=[...new Set(picked.map(d=>d.cluster))].length};render();
</script></body></html>
