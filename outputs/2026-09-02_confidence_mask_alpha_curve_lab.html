<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confidence Mask Alpha Curve Lab</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
      color: #f8f5ee;
      background: #11100f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(130deg, rgba(110, 135, 92, .26), transparent 42%),
        linear-gradient(310deg, rgba(95, 118, 177, .20), transparent 44%),
        #11100f;
    }
    main { width: min(1080px, 100%); margin: 0 auto; padding: 22px; display: grid; gap: 14px; }
    header, section { border: 1px solid rgba(238, 232, 218, .18); background: rgba(17, 16, 15, .82); padding: 16px; }
    header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: end; }
    h1, h2, p { margin-top: 0; }
    h1 { font-size: clamp(1.55rem, 3vw, 2.5rem); line-height: 1.08; letter-spacing: 0; margin-bottom: 8px; }
    h2 { font-size: 1rem; letter-spacing: 0; color: #b9d58e; }
    p, label, output { color: #cac6bd; line-height: 1.62; }
    button, input, select { font: inherit; color: #f8f5ee; background: #1d1d1b; border: 1px solid rgba(238, 232, 218, .24); padding: 9px 10px; }
    button { cursor: pointer; }
    button.primary { background: #4b5d35; border-color: #b9d58e; }
    .layout { display: grid; grid-template-columns: minmax(300px, 1fr) 330px; gap: 14px; }
    .stage { min-height: 390px; background: #080807; overflow: hidden; }
    canvas { width: 100%; height: 100%; min-height: 390px; display: block; }
    .row, .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 9px; border-top: 1px solid rgba(238, 232, 218, .12); padding-top: 10px; margin-top: 10px; }
    .toolbar { justify-content: flex-start; border: 0; padding: 0; margin: 0; }
    .panel { display: grid; align-content: start; gap: 14px; }
    .big { font-size: 1.9rem; color: #fff; }
    .stat { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .meter { height: 12px; background: #25251f; overflow: hidden; }
    .meter span { display: block; height: 100%; background: linear-gradient(90deg, #b9d58e, #8da8e8); }
    .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
    .swatches span { aspect-ratio: 1; border: 1px solid rgba(238, 232, 218, .22); }
    .log { min-height: 140px; white-space: pre-wrap; font: .84rem ui-monospace, SFMono-Regular, Menlo, monospace; color: #cfd3c2; }
    @media (max-width: 780px) {
      main { padding: 12px; }
      header, .layout { grid-template-columns: 1fr; }
      .stage, canvas { min-height: 300px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Confidence Mask Alpha Curve Lab</h1>
      <p>Image Segmenter の confidence mask を UI 用の半透明オーバーレイに変換する前段として、しきい値、ガンマ、輪郭強調を小さく試す派生サンプルです。</p>
    </div>
    <div class="toolbar">
      <button id="randomize" class="primary">Random mask</button>
      <button id="pulse">Pulse</button>
      <button id="reset">Reset</button>
    </div>
  </header>

  <div class="layout">
    <section>
      <div class="stage"><canvas id="canvas" width="760" height="520"></canvas></div>
      <div class="row">
        <label>Threshold <input id="threshold" type="range" min="0" max="1" step="0.01" value="0.42"></label>
        <output id="thresholdOut">0.42</output>
      </div>
      <div class="row">
        <label>Gamma <input id="gamma" type="range" min="0.35" max="2.8" step="0.05" value="1.25"></label>
        <output id="gammaOut">1.25</output>
      </div>
      <div class="row">
        <label>Edge boost <input id="edge" type="range" min="0" max="2.5" step="0.05" value="0.75"></label>
        <output id="edgeOut">0.75</output>
      </div>
    </section>

    <section class="panel">
      <div>
        <h2>Overlay summary</h2>
        <div class="big" id="summary">0% active</div>
        <p id="hint">threshold を上げると漏れが減り、gamma を上げると境界の薄い信号が控えめになります。</p>
      </div>
      <div class="stat"><span>Mean alpha</span><strong id="mean">0.00</strong></div>
      <div class="meter"><span id="meanBar" style="width: 0%"></span></div>
      <div class="stat"><span>Edge pixels</span><strong id="edges">0</strong></div>
      <div class="swatches" id="swatches"></div>
      <div>
        <h2>Transfer recipe</h2>
        <div class="log" id="recipe"></div>
      </div>
    </section>
  </div>
</main>

<script>
const els = {
  canvas: document.getElementById("canvas"),
  randomize: document.getElementById("randomize"),
  pulse: document.getElementById("pulse"),
  reset: document.getElementById("reset"),
  threshold: document.getElementById("threshold"),
  gamma: document.getElementById("gamma"),
  edge: document.getElementById("edge"),
  thresholdOut: document.getElementById("thresholdOut"),
  gammaOut: document.getElementById("gammaOut"),
  edgeOut: document.getElementById("edgeOut"),
  summary: document.getElementById("summary"),
  hint: document.getElementById("hint"),
  mean: document.getElementById("mean"),
  meanBar: document.getElementById("meanBar"),
  edges: document.getElementById("edges"),
  swatches: document.getElementById("swatches"),
  recipe: document.getElementById("recipe")
};
const ctx = els.canvas.getContext("2d");
const size = 96;
let seed = 4;
let phase = 0;
let pulsing = false;
let mask = makeMask();

function seededNoise(x, y) {
  const n = Math.sin(x * 12.9898 + y * 78.233 + seed * 41.3) * 43758.5453;
  return n - Math.floor(n);
}

function makeMask() {
  const data = new Float32Array(size * size);
  const cx = size * (0.52 + Math.sin(seed) * 0.08);
  const cy = size * (0.50 + Math.cos(seed * 1.7) * 0.08);
  for (let y = 0; y < size; y += 1) {
    for (let x = 0; x < size; x += 1) {
      const dx = (x - cx) / (size * 0.27);
      const dy = (y - cy) / (size * 0.34);
      const oval = Math.max(0, 1 - (dx * dx + dy * dy));
      const shoulder = Math.max(0, 1 - (((x - size * 0.5) / (size * 0.48)) ** 2 + ((y - size * 0.78) / (size * 0.20)) ** 2));
      const noise = (seededNoise(x, y) - 0.5) * 0.12;
      data[y * size + x] = Math.max(0, Math.min(1, oval * 0.95 + shoulder * 0.55 + noise));
    }
  }
  return data;
}

function alphaOf(conf, threshold, gamma) {
  const normalized = Math.max(0, (conf - threshold) / Math.max(0.001, 1 - threshold));
  return Math.pow(normalized, gamma);
}

function render() {
  const threshold = Number(els.threshold.value);
  const gamma = Number(els.gamma.value);
  const edgeBoost = Number(els.edge.value);
  const image = ctx.createImageData(size, size);
  let active = 0;
  let mean = 0;
  let edgePixels = 0;
  for (let y = 0; y < size; y += 1) {
    for (let x = 0; x < size; x += 1) {
      const i = y * size + x;
      const conf = Math.max(0, Math.min(1, mask[i] + Math.sin(phase + x * 0.12) * 0.025));
      const right = x < size - 1 ? mask[i + 1] : conf;
      const down = y < size - 1 ? mask[i + size] : conf;
      const edge = Math.min(1, Math.abs(conf - right) + Math.abs(conf - down));
      let alpha = alphaOf(conf, threshold, gamma);
      alpha = Math.min(1, alpha + edge * edgeBoost);
      const p = i * 4;
      image.data[p] = Math.round(115 + 95 * alpha);
      image.data[p + 1] = Math.round(150 + 70 * alpha);
      image.data[p + 2] = Math.round(210 - 90 * alpha);
      image.data[p + 3] = Math.round(alpha * 235);
      if (alpha > 0.02) active += 1;
      if (edge * edgeBoost > 0.08) edgePixels += 1;
      mean += alpha;
    }
  }
  const off = new OffscreenCanvas(size, size);
  off.getContext("2d").putImageData(image, 0, 0);
  ctx.clearRect(0, 0, els.canvas.width, els.canvas.height);
  ctx.fillStyle = "#080807";
  ctx.fillRect(0, 0, els.canvas.width, els.canvas.height);
  ctx.fillStyle = "#25221f";
  for (let i = 0; i < 7; i += 1) ctx.fillRect(90 + i * 86, 90 + (i % 2) * 24, 44, 320);
  ctx.drawImage(off, 110, 22, 540, 478);
  ctx.strokeStyle = "rgba(248, 245, 238, .68)";
  ctx.lineWidth = 2;
  ctx.strokeRect(110, 22, 540, 478);
  const activePct = active / (size * size);
  const meanAlpha = mean / (size * size);
  els.summary.textContent = `${Math.round(activePct * 100)}% active`;
  els.mean.textContent = meanAlpha.toFixed(2);
  els.meanBar.style.width = `${Math.round(meanAlpha * 100)}%`;
  els.edges.textContent = String(edgePixels);
  els.thresholdOut.value = threshold.toFixed(2);
  els.gammaOut.value = gamma.toFixed(2);
  els.edgeOut.value = edgeBoost.toFixed(2);
  els.swatches.innerHTML = Array.from({ length: 16 }, (_, index) => {
    const c = index / 15;
    const a = alphaOf(c, threshold, gamma);
    return `<span title="${c.toFixed(2)}" style="background: rgba(${Math.round(115 + 95 * a)}, ${Math.round(150 + 70 * a)}, ${Math.round(210 - 90 * a)}, ${Math.max(.08, a)})"></span>`;
  }).join("");
  els.recipe.textContent = [
    `alpha = pow(max(0, (confidence - ${threshold.toFixed(2)}) / (1 - ${threshold.toFixed(2)})), ${gamma.toFixed(2)})`,
    `alpha += edgeGradient * ${edgeBoost.toFixed(2)}`,
    "Next: feed this curve into DrawingUtils.drawConfidenceMask default/overlay textures."
  ].join("\n");
}

function animate() {
  if (!pulsing) return;
  phase += 0.18;
  render();
  requestAnimationFrame(animate);
}

els.randomize.addEventListener("click", () => {
  seed += 1;
  mask = makeMask();
  render();
});
els.pulse.addEventListener("click", () => {
  pulsing = !pulsing;
  els.pulse.textContent = pulsing ? "Stop pulse" : "Pulse";
  if (pulsing) animate();
});
els.reset.addEventListener("click", () => {
  els.threshold.value = "0.42";
  els.gamma.value = "1.25";
  els.edge.value = "0.75";
  phase = 0;
  render();
});
[els.threshold, els.gamma, els.edge].forEach((el) => el.addEventListener("input", render));
render();
</script>
</body>
</html>
