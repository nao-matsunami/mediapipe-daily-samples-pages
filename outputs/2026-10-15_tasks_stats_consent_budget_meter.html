<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasks Stats Consent Budget Meter</title><style>
:root{color-scheme:dark;font-family:Inter,"Hiragino Sans",system-ui;background:#11120e;color:#f4f7e9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 15%,#5b5820 0,transparent 26%),#11120e;min-height:100vh}main{width:min(1000px,100%);margin:auto;padding:28px}.tag{color:#e6de79;text-transform:uppercase;letter-spacing:.12em;font-size:.76rem}h1{font-size:clamp(2rem,6vw,4.3rem);line-height:.96;margin:.2em 0}p{color:#cbd1b8;line-height:1.65}.grid{display:grid;grid-template-columns:310px 1fr;gap:16px}.panel{border:1px solid #ffffff20;border-radius:15px;padding:16px;background:#171a14dc}label{display:grid;gap:7px;margin:10px 0}input,select{accent-color:#e6de79}button{width:100%;padding:11px;border:0;border-radius:9px;background:#e6de79;color:#1a1a0e;font-weight:800;cursor:pointer}.meter{height:32px;background:#ffffff10;border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#92d7a6,#e6de79,#ff877d);transition:width .25s}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.card{padding:13px;border:1px solid #ffffff18;border-radius:10px}.card span{display:block;color:#e6de79;font-size:.75rem;text-transform:uppercase}.card b{font-size:1.55rem}.events{display:grid;gap:7px}.event{display:grid;grid-template-columns:1fr 80px 65px;gap:8px;padding:9px;background:#ffffff08;border-radius:8px}.send{color:#92d7a6}.hold{color:#ffb977}.stop{color:#ff877d}@media(max-width:700px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}
</style></head><body><main><div class="tag">MediaPipe Tasks Web / stats logging / consent</div><h1>Tasks Stats<br>Consent Budget Meter</h1><p>Web Tasks の統計ログを、入力内容と混同せず、同意・保持期間・セッション予算ごとに送信 / 保留 / 停止へ分ける派生試作です。</p><section class="grid"><aside class="panel"><label><input id="consent" type="checkbox"> performance metrics に同意</label><label>Retention<select id="retention"><option value="session">session only</option><option value="day">24 hours</option><option value="none">do not retain</option></select></label><label>Session budget <input id="budget" type="range" min="3" max="24" value="12"><span id="budgetLabel"></span></label><button id="simulate">Simulate task session</button><p>次に足すなら、実アプリの consent record、data dictionary、設定画面、端末上の監査ログ export を加えます。</p></aside><section class="panel"><div class="meter"><i id="fill"></i></div><div class="cards"><div class="card"><span>sent</span><b id="sent">0</b></div><div class="card"><span>held</span><b id="held">0</b></div><div class="card"><span>stopped</span><b id="stopped">0</b></div></div><div id="events" class="events"></div></section></section></main><script>
const $=s=>document.querySelector(s);const kinds=['model warm-up','inference latency','delegate fallback','frame throughput','task error code','cache hit rate','landmark count','memory watermark'];
function render(){const c=$('#consent').checked,limit=+$('#budget').value,ret=$('#retention').value;let sent=0,held=0,stopped=0;const rows=Array.from({length:8},(_,i)=>{let route=!c?'stop':i>=limit?'hold':ret==='none'?'hold':'send';if(route==='send')sent++;if(route==='hold')held++;if(route==='stop')stopped++;return {name:kinds[i],route,value:18+i*9}});$('#sent').textContent=sent;$('#held').textContent=held;$('#stopped').textContent=stopped;$('#fill').style.width=`${Math.min(100,(sent/8)*100)}%`;$('#events').innerHTML=rows.map(x=>`<div class="event"><span>${x.name}</span><span>${x.value} ms</span><b class="${x.route}">${x.route}</b></div>`).join('')}
$('#budget').oninput=()=>{$('#budgetLabel').textContent=$('#budget').value+' events'};$('#budget').dispatchEvent(new Event('input'));for(const x of ['consent','retention','budget','simulate'])$('#'+x).addEventListener(x==='simulate'?'click':'input',render);render();
</script></body></html>
