<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Landmark Handoff Compass</title><style>:root{color-scheme:dark;--bg:#0b1020;--card:#171f38;--line:#425176;--ink:#f5f7ff;--muted:#b7c1dc;--mint:#8ff5d0;--violet:#c3adff;--amber:#ffd08a;--rose:#ff9caf}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0,#34345e,transparent 38%),var(--bg);color:var(--ink);font:16px/1.5 system-ui}main{max-width:1000px;margin:auto;padding:28px}.tag{font:700 12px ui-monospace;letter-spacing:.13em;color:var(--mint)}h1{font-size:clamp(38px,7vw,72px);line-height:.9;margin:12px 0}.lead,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:250px 1fr;gap:16px}.card{background:#171f38e8;border:1px solid var(--line);border-radius:20px;padding:17px}label{display:block;margin:16px 0;font:13px ui-monospace;color:#dbe2ff}input{width:100%;accent-color:var(--violet)}button{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#263251;color:var(--ink);font:700 13px ui-monospace;cursor:pointer}.state{font:700 21px ui-monospace;color:var(--mint)}canvas{display:block;width:100%;height:auto;background:#0b1020;border-radius:13px;touch-action:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main><div class="tag">ORIGINAL / MULTI-LANDMARK UI CONTRACT</div><h1>Landmark Handoff<br>Compass</h1><p class="lead">候補が二人ぶん現れる場面で、最もscoreが高い人へ即座に飛ばず、直前の位置に近い候補を追う小さな試作です。キャンバスを押して対象を誘導します。</p><section class="grid"><aside class="card"><label>scoreの重み <output id="scoreO">0.42</output><input id="score" type="range" min="0" max="1" step=".01" value=".42"></label><label>位置連続性の重み <output id="nearO">0.78</output><input id="near" type="range" min="0" max="1" step=".01" value=".78"></label><label>切替の余白 <output id="marginO">0.16</output><input id="margin" type="range" min="0" max=".5" step=".01" value=".16"></label><button id="reset">REACQUIRE</button><p class="state" id="state">LOCK A</p><p class="muted">点Aはポインタに追従、点Bは横切ります。</p></aside><section class="card"><canvas id="view" width="680" height="420"></canvas><p class="muted">次に足すなら、実Hand/Pose Landmarkerのランドマーク重心・handedness・presenceを候補にし、消失からの再取得とユーザー選択をログに残します。</p></section></section><script>const $=s=>document.querySelector(s),c=$('#view'),g=c.getContext('2d');let px=.3,chosen='A',track={x:.3,y:.55},switches=0;c.onpointermove=e=>{let r=c.getBoundingClientRect();px=Math.max(.06,Math.min(.94,(e.clientX-r.left)/r.width))};c.onpointerdown=c.onpointermove;$('#reset').onclick=()=>{chosen='A';track={x:px,y:.55};switches=0};function drawPerson(p,color,name,active,score){let x=p.x*680,y=p.y*420;g.strokeStyle=color;g.lineWidth=active?5:2;g.beginPath();g.arc(x,y,active?36:27,0,7);g.stroke();g.fillStyle=color;g.font='700 14px ui-monospace';g.textAlign='center';g.fillText(name+'  '+score.toFixed(2),x,y+5);g.textAlign='start'}function tick(t){let sw=+$('#score').value,nw=+$('#near').value,m=+$('#margin').value;$('#scoreO').textContent=sw.toFixed(2);$('#nearO').textContent=nw.toFixed(2);$('#marginO').textContent=m.toFixed(2);let a={x:px,y:.55,score:.56+px*.35},b={x:.5+Math.sin(t*.0011)*.34,y:.45+Math.cos(t*.0016)*.16,score:.72+Math.sin(t*.0023)*.22};let evalP=p=>sw*p.score+nw*(1-Math.min(1,Math.hypot(p.x-track.x,p.y-track.y)*1.8));let ca=evalP(a),cb=evalP(b),current=chosen==='A'?ca:cb,other=chosen==='A'?cb:ca;if(other>current+m){chosen=chosen==='A'?'B':'A';switches++}let target=chosen==='A'?a:b;track.x+= (target.x-track.x)*.09;track.y+=(target.y-track.y)*.09;g.fillStyle='#0b1020';g.fillRect(0,0,680,420);g.strokeStyle='#2e395a';for(let x=40;x<680;x+=80){g.beginPath();g.moveTo(x,0);g.lineTo(x,420);g.stroke()}for(let y=40;y<420;y+=80){g.beginPath();g.moveTo(0,y);g.lineTo(680,y);g.stroke()}g.setLineDash([5,8]);g.strokeStyle='#c3adff';g.beginPath();g.moveTo(track.x*680,track.y*420);g.lineTo(target.x*680,target.y*420);g.stroke();g.setLineDash([]);drawPerson(a,'#8ff5d0','A',chosen==='A',a.score);drawPerson(b,'#ffd08a','B',chosen==='B',b.score);g.fillStyle='#c3adff';g.beginPath();g.arc(track.x*680,track.y*420,8,0,7);g.fill();g.fillStyle='#b7c1dc';g.font='13px ui-monospace';g.fillText('A: '+ca.toFixed(2)+'   B: '+cb.toFixed(2)+'   switches: '+switches,26,392);$('#state').textContent='LOCK '+chosen+' · continuity '+(chosen==='A'?ca:cb).toFixed(2);requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></main></html>
