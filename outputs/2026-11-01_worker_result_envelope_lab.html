<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worker Result Envelope Lab</title><style>body{margin:0;background:#08111d;color:#e8f2ff;font:15px system-ui;padding:24px;max-width:900px;margin:auto}h1{margin:.2em 0}.sub{color:#9eb4cd}button,input{accent-color:#68e0b8}button{background:#18324c;color:#fff;border:1px solid #3b668c;border-radius:8px;padding:8px 12px;margin:4px}#rail{height:128px;border:1px solid #31516d;border-radius:12px;margin:18px 0;position:relative;overflow:hidden;background:linear-gradient(90deg,#10263a,#0d1727)}.card{position:absolute;top:18px;width:126px;padding:8px;border-radius:8px;font-size:12px}.source{background:#2475b8}.worker{background:#6d4cb8}.display{background:#16876d}.stale{opacity:.35;filter:grayscale(1)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{padding:12px;background:#102238;border-radius:10px}.stat b{display:block;font-size:24px;color:#7ee4ca}code{color:#f4d280}#log{white-space:pre-wrap;background:#050b12;padding:12px;border-radius:10px;min-height:80px;color:#b7cde3}</style><h1>Worker Result Envelope Lab</h1><p class="sub">MediaPipe Web Tasks の結果を「値」ではなく <code>id / timestamp / owner / transferable / freshness</code> を持つ封筒として扱う自作シミュレータ。ネットワークやモデルは不要です。</p><label>入力 FPS <input id="fps" type="range" min="5" max="60" value="30"></label><label> Worker 処理 ms <input id="cost" type="range" min="5" max="180" value="55"></label><label>鮮度上限 ms <input id="age" type="range" min="30" max="300" value="120"></label><br><button id="run">開始</button><button id="transfer">transfer を有効</button><button id="reset">リセット</button><div id="rail"></div><div class="stats"><div class="stat">生成<b id="made">0</b></div><div class="stat">表示<b id="shown">0</b></div><div class="stat">鮮度切れ<b id="dropped">0</b></div><div class="stat">コピー<b id="copies">0</b></div></div><h3>イベント台帳</h3><div id="log"></div><script>const $=id=>document.getElementById(id),s={run:false,transfer:false,n:0,made:0,shown:0,dropped:0,copies:0,timer:null};function out(m){$('log').textContent=(m+'\n'+$('log').textContent).slice(0,900)}function paint(){['made','shown','dropped','copies'].forEach(k=>$(k).textContent=s[k])}function send(){if(!s.run)return;let id=++s.n,born=performance.now(),transfer=s.transfer;s.made++;paint();let a=document.createElement('div');a.className='card source';a.style.left='2%';a.textContent='#'+id+'\nmain owns input';$('rail').append(a);setTimeout(()=>{a.className='card worker';a.style.left='39%';a.textContent='#'+id+'\nworker '+(transfer?'owns buffer':'copied buffer');if(!transfer)s.copies++;paint()},8);setTimeout(()=>{let elapsed=Math.round(performance.now()-born),fresh=elapsed<=+$('age').value;a.className='card '+(fresh?'display':'stale');a.style.left='74%';a.textContent='#'+id+'\n'+(fresh?'DISPLAY '+elapsed+'ms':'DROP '+elapsed+'ms');if(fresh)s.shown++;else s.dropped++;out('#'+id+' '+(fresh?'表示':'鮮度切れ')+' / '+(transfer?'transfer':'copy')+' / '+elapsed+'ms');paint();setTimeout(()=>a.remove(),500)},+$('cost').value)}$('run').onclick=()=>{s.run=!s.run;$('run').textContent=s.run?'停止':'開始';if(s.run){send();s.timer=setInterval(send,1000/+$('fps').value)}else clearInterval(s.timer)};$('transfer').onclick=()=>{s.transfer=!s.transfer;$('transfer').textContent=s.transfer?'transfer 有効':'transfer を有効'};$('reset').onclick=()=>{s.run=false;clearInterval(s.timer);Object.assign(s,{n:0,made:0,shown:0,dropped:0,copies:0});$('rail').innerHTML='';$('log').textContent='';$('run').textContent='開始';paint()};paint();out('準備完了: 封筒を開始してください。')</script>
