<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiteRT-LM Prompt Stream Budget</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
      background: #111213;
      color: #f3efe7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #111213; }
    main { width: min(1120px, 100%); margin: 0 auto; padding: 22px; }
    header { border-bottom: 1px solid #33383a; padding-bottom: 16px; }
    h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.9rem); line-height: 1.07; letter-spacing: 0; }
    h2 { margin: 0 0 10px; font-size: 1rem; letter-spacing: 0; }
    p, small { color: #c8c1b8; line-height: 1.65; }
    .layout { display: grid; grid-template-columns: 330px 1fr; gap: 14px; margin-top: 16px; }
    .panel { border: 1px solid #33383a; background: #171a1b; padding: 14px; }
    .controls { display: grid; gap: 13px; }
    label { display: grid; gap: 7px; color: #f3efe7; }
    input[type="range"], textarea { width: 100%; }
    input[type="range"] { accent-color: #7cd7c4; }
    textarea, select, button {
      border: 1px solid #52595c;
      background: #0d0f10;
      color: #f3efe7;
      padding: 9px 11px;
      font: inherit;
    }
    textarea { min-height: 118px; resize: vertical; }
    button { min-height: 40px; cursor: pointer; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .metric { min-height: 106px; border: 1px solid #33383a; background: #0d0f10; padding: 12px; }
    .metric strong { display: block; margin-top: 8px; font-size: 1.8rem; }
    .ok { color: #7cd7c4; }
    .warn { color: #f4c65a; }
    .bad { color: #ff9f92; }
    canvas { width: 100%; height: 285px; display: block; border: 1px solid #33383a; background: #090b0c; margin-top: 12px; }
    .stream { margin-top: 12px; min-height: 150px; border: 1px solid #33383a; background: #0d0f10; padding: 12px; white-space: pre-wrap; color: #ded7cd; }
    .bars { display: grid; gap: 8px; margin-top: 12px; }
    .barrow { display: grid; grid-template-columns: 120px 1fr 60px; gap: 10px; align-items: center; }
    .bar { height: 14px; border: 1px solid #52595c; background: #090b0c; }
    .bar span { display: block; height: 100%; background: #7cd7c4; }
    @media (max-width: 820px) {
      main { padding: 14px; }
      .layout, .metrics, .barrow { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>LiteRT-LM Prompt Stream Budget</h1>
    <p>代表サンプルの「次に足すなら」から、Engine.create の前にプロンプト量、出力上限、ストリーミング刻み、キャンセル設計を試す派生ミニサンプル。</p>
  </header>

  <section class="layout">
    <aside class="panel controls">
      <label>Model class
        <select id="model">
          <option value="e2b">Gemma 4 E2B web</option>
          <option value="e4b">Gemma 4 E4B web</option>
          <option value="small">Small local draft</option>
        </select>
      </label>
      <label>System prompt
        <textarea id="prompt">あなたはブラウザ内で動くオンデバイスAIです。短く、根拠を示して答えてください。</textarea>
      </label>
      <label>User input tokens <span id="inputValue">360</span>
        <input id="inputTokens" type="range" min="32" max="4096" value="360">
      </label>
      <label>Max output tokens <span id="outputValue">256</span>
        <input id="outputTokens" type="range" min="32" max="2048" value="256">
      </label>
      <label>Chunk size <span id="chunkValue">24</span>
        <input id="chunk" type="range" min="4" max="96" value="24">
      </label>
      <button id="simulate">Simulate stream</button>
      <button id="cancel">Cancel stream</button>
    </aside>

    <section class="panel">
      <div class="metrics">
        <div class="metric"><span>Context Use</span><strong id="context">-</strong><small id="contextSub">未計算</small></div>
        <div class="metric"><span>Latency Hint</span><strong id="latency">-</strong><small id="latencySub">未計算</small></div>
        <div class="metric"><span>Policy</span><strong id="policy">-</strong><small id="policySub">未計算</small></div>
      </div>
      <canvas id="chart" width="900" height="300" aria-label="prompt budget chart"></canvas>
      <div class="bars" id="bars"></div>
      <div class="stream" id="stream">Simulate stream を押すと、予算に応じた疑似チャンク出力を表示します。</div>
    </section>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const specs = {
    e2b: { label: "E2B", context: 8192, speed: 1.0, memory: 2.2 },
    e4b: { label: "E4B", context: 8192, speed: 1.8, memory: 4.4 },
    small: { label: "Draft", context: 4096, speed: .55, memory: 1.1 }
  };
  let abort = false;

  function values() {
    return {
      spec: specs[$("model").value],
      system: Math.ceil($("prompt").value.length / 3),
      input: Number($("inputTokens").value),
      output: Number($("outputTokens").value),
      chunk: Number($("chunk").value)
    };
  }

  function compute() {
    const v = values();
    const total = v.system + v.input + v.output;
    const contextPct = Math.min(100, Math.round(total / v.spec.context * 100));
    const chunks = Math.ceil(v.output / v.chunk);
    const latency = Math.round((v.output * v.spec.speed + chunks * 18) / 10) / 10;
    const memory = Math.round((v.spec.memory + total / 9000) * 10) / 10;
    const policy = contextPct > 86 ? "Trim" : latency > 80 ? "Stream" : "Run";
    return { ...v, total, contextPct, chunks, latency, memory, policy };
  }

  function update() {
    ["inputTokens", "outputTokens", "chunk"].forEach((id) => $(id.replace("Tokens", "") + "Value").textContent = $(id).value);
    const r = compute();
    $("context").textContent = `${r.contextPct}%`;
    $("context").className = r.contextPct < 70 ? "ok" : r.contextPct < 88 ? "warn" : "bad";
    $("contextSub").textContent = `${r.total} / ${r.spec.context} token estimate`;
    $("latency").textContent = `${r.latency}s`;
    $("latency").className = r.latency < 45 ? "ok" : r.latency < 90 ? "warn" : "bad";
    $("latencySub").textContent = `${r.chunks} chunks, ${r.memory}GB memory hint`;
    $("policy").textContent = r.policy;
    $("policy").className = r.policy === "Run" ? "ok" : r.policy === "Stream" ? "warn" : "bad";
    $("policySub").textContent = r.policy === "Trim" ? "system/input を短縮" : r.policy === "Stream" ? "cancel UI を常時表示" : "smoke test に進める";
    renderBars(r);
    draw(r);
  }

  function renderBars(r) {
    const rows = [
      ["System", r.system, r.spec.context],
      ["Input", r.input, r.spec.context],
      ["Output", r.output, r.spec.context],
      ["Chunks", r.chunks, 96]
    ];
    $("bars").innerHTML = rows.map(([label, value, max]) => {
      const pct = Math.min(100, Math.round(value / max * 100));
      return `<div class="barrow"><strong>${label}</strong><div class="bar"><span style="width:${pct}%"></span></div><span>${value}</span></div>`;
    }).join("");
  }

  function draw(r) {
    const canvas = $("chart");
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#090b0c";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "#33383a";
    for (let x = 70; x < 850; x += 78) {
      ctx.beginPath();
      ctx.moveTo(x, 34);
      ctx.lineTo(x, 268);
      ctx.stroke();
    }
    const parts = [
      { label: "system", value: r.system, color: "#7cd7c4" },
      { label: "input", value: r.input, color: "#e2d064" },
      { label: "output", value: r.output, color: "#8fb8ff" }
    ];
    let start = 70;
    parts.forEach((part) => {
      const width = Math.max(8, part.value / r.spec.context * 720);
      ctx.fillStyle = part.color;
      ctx.fillRect(start, 126, width, 54);
      ctx.fillStyle = "#f3efe7";
      ctx.font = "14px system-ui";
      ctx.fillText(part.label, start, 205);
      start += width;
    });
    ctx.fillStyle = "#c8c1b8";
    ctx.fillText(`${r.spec.label} context ${r.spec.context} tokens`, 70, 74);
    ctx.fillText(`${r.chunks} streaming chunks`, 70, 245);
  }

  async function simulate() {
    abort = false;
    const r = compute();
    $("stream").textContent = "";
    const sentence = `LiteRT-LM JS の起動前に ${r.total} token の予算を確認し、${r.chunks} 個のチャンクで応答を返す想定です。policy=${r.policy}。`;
    const pieces = sentence.match(new RegExp(`.{1,${Math.max(4, Math.floor(r.chunk / 2))}}`, "g")) || [];
    for (const piece of pieces) {
      if (abort) {
        $("stream").textContent += "\n[キャンセルされました]";
        return;
      }
      $("stream").textContent += piece;
      await new Promise((resolve) => setTimeout(resolve, 95));
    }
    $("stream").textContent += "\n[完了] 次は実 Engine.create と engine.delete() の smoke test。";
  }

  document.querySelectorAll("input, select, textarea").forEach((el) => el.addEventListener("input", update));
  $("simulate").addEventListener("click", simulate);
  $("cancel").addEventListener("click", () => { abort = true; });
  update();
</script>
</body>
</html>
