<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resolution Switch Smoothing Lab</title><style>
:root{color-scheme:dark;--bg:#09111e;--p:#121f33;--line:#294564;--ink:#edf5ff;--mut:#9bb0c9;--cyan:#80dbff;--lime:#88e6b2;--orange:#ffb86e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}.wrap{max-width:1020px;margin:auto;padding:26px 16px}h1{font-size:clamp(26px,5vw,43px);margin:0}p{color:var(--mut);margin:6px 0 20px}.grid{display:grid;grid-template-columns:280px 1fr;gap:16px}@media(max-width:720px){.grid{grid-template-columns:1fr}}.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:16px}label{display:block;margin:0 0 16px;color:#d4e2f4}input{width:100%;accent-color:var(--cyan)}output{float:right;color:var(--cyan);font-variant-numeric:tabular-nums}button{background:#163b58;border:1px solid #39709b;color:var(--ink);border-radius:8px;padding:9px 11px;cursor:pointer;margin:0 5px 5px 0}.stage{height:330px;border-radius:11px;overflow:hidden;position:relative;background:radial-gradient(circle at 70% 25%,#244969,#0b1728 65%)}canvas{width:100%;height:100%;display:block}.badge{position:absolute;left:12px;top:12px;border:1px solid var(--line);background:#08121fdd;border-radius:20px;padding:5px 10px;font-variant-numeric:tabular-nums}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.metric{border:1px solid var(--line);border-radius:9px;padding:9px;color:var(--mut)}.metric b{display:block;font-size:18px;color:var(--ink)}.legend{display:flex;gap:15px;flex-wrap:wrap;color:var(--mut);margin-top:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.tip{margin-top:16px;padding-left:10px;border-left:3px solid var(--orange);color:#c6d8ed}
</style><body><main class="wrap"><h1>Resolution Switch Smoothing Lab</h1><p>解像度が切り替わる合成映像で、ピクセル距離のまま平滑化した軌跡と、正規化座標で平滑化した軌跡を比較する自作検証面です。MediaPipe・カメラ・ネットワークは読み込みません。</p><div class="grid"><section class="card"><label>平滑化の追従率 <output id="followOut">18%</output><input id="follow" type="range" min="4" max="70" value="18"></label><label>解像度切替タイミング <output id="switchOut">3.2 s</output><input id="sw" type="range" min="1" max="7" step=".2" value="3.2"></label><label>再生速度 <output id="speedOut">1.0×</output><input id="speed" type="range" min=".4" max="2" step=".1" value="1"></label><button id="pause">一時停止</button><button id="reset">先頭へ</button><button id="flip">今すぐ切替</button><div class="tip">実装では landmark を表示ピクセルに変換する前に平滑化し、入力サイズ変更時は座標契約・状態の引き継ぎ・timestampをまとめて検査します。</div></section><section class="card"><div class="stage"><canvas id="c"></canvas><span class="badge" id="badge"></span></div><div class="metrics"><div class="metric"><b id="res">640 × 360</b>入力解像度</div><div class="metric"><b id="jump">0 px</b>不連続量（橙）</div><div class="metric"><b id="time">0 ms</b>単調timestamp</div></div><div class="legend"><span><i class="dot" style="background:#80dbff"></i>入力ランドマーク</span><span><i class="dot" style="background:#88e6b2"></i>正規化平滑化</span><span><i class="dot" style="background:#ffb86e"></i>ピクセル平滑化（比較用）</span></div></section></div></main><script>
const $=x=>document.getElementById(x),c=$('c'),ctx=c.getContext('2d');let run=true,t=0,last=0,force=false,nx=.5,ny=.5,px=320,py=180,prevOrange={x:0,y:0};
function v(id){return +$(id).value}function labels(){$('followOut').textContent=v('follow')+'%';$('switchOut').textContent=v('sw').toFixed(1)+' s';$('speedOut').textContent=v('speed').toFixed(1)+'×'}['follow','sw','speed'].forEach(id=>$(id).oninput=labels);labels();
function dot(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}function line(a,b,color){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke()}
function frame(now){if(!last)last=now;const dt=(now-last)*v('speed');last=now;if(run)t+=dt;const W=c.width=c.clientWidth*devicePixelRatio,H=c.height=c.clientHeight*devicePixelRatio;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);const switched=force||((t/1000)%8>=v('sw'));const iw=switched?1280:640,ih=switched?720:360;const raw={x:.5+.32*Math.sin(t/850)+.035*Math.sin(t/101),y:.5+.25*Math.cos(t/1110)};const a=v('follow')/100;nx+=(raw.x-nx)*a;ny+=(raw.y-ny)*a;const sx=W/iw,sy=H/ih;px+=(raw.x*iw-px)*a;py+=(raw.y*ih-py)*a;const input={x:raw.x*W,y:raw.y*H},norm={x:nx*W,y:ny*H},pixel={x:px*sx,y:py*sy};ctx.fillStyle='#0b1a2d';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#1f4764';ctx.lineWidth=1;for(let i=1;i<5;i++){ctx.beginPath();ctx.moveTo(i*W/5,0);ctx.lineTo(i*W/5,H);ctx.stroke()}line(input,norm,'#80dbff55');line(norm,pixel,'#ffb86e55');dot(input.x,input.y,9,'#80dbff');dot(norm.x,norm.y,8,'#88e6b2');dot(pixel.x,pixel.y,8,'#ffb86e');ctx.fillStyle='#d9e9fa';ctx.font=`${13*devicePixelRatio}px system-ui`;ctx.fillText('正規化',norm.x+12,norm.y-12);ctx.fillText('pixel',pixel.x+12,pixel.y+18);const j=Math.hypot(pixel.x-prevOrange.x,pixel.y-prevOrange.y);prevOrange=pixel;$('res').textContent=iw+' × '+ih;$('jump').textContent=Math.round(j/devicePixelRatio)+' px';$('time').textContent=Math.round(t)+' ms';$('badge').textContent=(switched?'HD':'SD')+' 入力 / '+(run?'RUN':'PAUSE');requestAnimationFrame(frame)}
$('pause').onclick=()=>{run=!run;$('pause').textContent=run?'一時停止':'再開'};$('reset').onclick=()=>{t=0;nx=.5;ny=.5;px=320;py=180;force=false};$('flip').onclick=()=>force=!force;requestAnimationFrame(frame);
</script></body></html>
