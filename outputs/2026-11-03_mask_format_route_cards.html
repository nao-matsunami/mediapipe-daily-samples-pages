<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mask Format Route Cards</title>
<style>*{box-sizing:border-box}body{margin:0;background:#11151d;color:#e9edf4;font:15px/1.55 system-ui,sans-serif}main{max-width:980px;margin:auto;padding:28px}h1{font-size:clamp(30px,5vw,54px);line-height:1.05;margin:8px 0;color:#ffd580}.sub{color:#b8c5d2;max-width:720px}.controls,.cards{display:grid;gap:14px}.controls{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(3,1fr);margin-top:18px}@media(max-width:680px){.controls,.cards{grid-template-columns:1fr}}button,.card{border:1px solid #3c4757;border-radius:18px;background:#1a222d;color:inherit;padding:18px;text-align:left}button{cursor:pointer;font:inherit}.card{min-height:190px}.card.active{border-color:#ffd580;background:#382f1e;box-shadow:0 0 0 2px #ffcf6a44}.badge{display:inline-block;border-radius:99px;padding:3px 8px;background:#2a3440;color:#bcd0df;font-size:12px}.active .badge{background:#ffd580;color:#30230b}h2{margin:12px 0 6px;font-size:22px}.meter{height:9px;background:#2e3a48;border-radius:8px;overflow:hidden}.meter i{display:block;height:100%;background:#ffd580}footer{margin-top:20px;color:#9eafbd}code{color:#ffd580}</style>
<main><div class="badge">自作・オフライン / capability → intent → format の小さなルータ</div><h1>Mask Format<br>Route Cards</h1><p class="sub">精度を常に最大にするのでなく、端末能力と表現目的を明示して出力形式を選ぶ試作です。F16 ImageFrame 対応を、UI側で「なぜこのルートか」説明するためのカードに翻訳します。</p><div class="controls"><button data-mode="preview">📱 ライブプレビュー<br><small>遅延を優先</small></button><button data-mode="keying">🎬 キーイング<br><small>境界を優先</small></button><button data-mode="archive">🧪 計測保存<br><small>分析を優先</small></button></div><p>利用可能な経路: <label><input id="f16" type="checkbox" checked> F16 ImageFrame</label>　<label><input id="gpu" type="checkbox" checked> GPU</label>　<label><input id="meter" type="checkbox"> 低電力</label></p><section class="cards" id="cards"></section><footer>次に足すなら: 実タスクの mask 型、フレーム時間、メモリ使用量を計測し、この選択理由を session log として保存する。</footer></main>
<script>const $=id=>document.getElementById(id);let mode='preview';const specs={preview:{title:'8-bit category mask',why:'表示の即応性を優先',cost:35},keying:{title:'F16 confidence mask',why:'半透明の境界を優先',cost:72},archive:{title:'F16 + 時刻つき要約',why:'後で比較できる連続値を優先',cost:88}};function render(){let f16=$('f16').checked,gpu=$('gpu').checked,low=$('meter').checked,prefer=specs[mode],fallback=mode==='preview'||!f16?'8-bit category mask':low?'8-bit + 間引き':prefer.title;let cards=[['選択',fallback,prefer.why],['能力',f16?'F16 利用可':'F16 なし',gpu?'GPU 経路あり':'CPU 経路'],['理由',low?'低電力のため容量を抑制':'目的と能力が一致',gpu?'フレーム予算を監視':'更新頻度を下げる']];$('cards').innerHTML=cards.map((a,i)=>`<article class="card ${i===0?'active':''}"><span class="badge">${a[0]}</span><h2>${a[1]}</h2><p>${a[2]}</p><div class="meter"><i style="width:${i===0?(fallback.includes('F16')?prefer.cost:35):55}%"></i></div></article>`).join('')}document.querySelectorAll('button[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()})}['f16','gpu','meter'].forEach(id=>$(id).onchange=render);render();</script></html>
