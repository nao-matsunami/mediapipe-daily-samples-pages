<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session Boundary Reset Lab</title><style>:root{color-scheme:dark;--b:#081321;--p:#a98bff;--m:#79e8c4;--l:#274158}*{box-sizing:border-box}body{margin:0;background:linear-gradient(130deg,#101634,#081321);font:16px system-ui;color:#eef5ff}main{max-width:920px;margin:auto;padding:28px}h1{font-size:clamp(28px,5vw,46px);margin:0}.layout{display:grid;grid-template-columns:1fr 310px;gap:18px}@media(max-width:700px){.layout{grid-template-columns:1fr}}.card{padding:18px;border:1px solid var(--l);background:#0b1b2b;border-radius:16px}button{background:#172747;color:white;border:1px solid var(--p);padding:10px 12px;border-radius:9px;cursor:pointer;margin:0 7px 8px 0}.feed{height:310px;overflow:auto;font-family:ui-monospace,monospace}.event{border-left:4px solid var(--m);padding:9px;margin:8px 0;background:#0e2535}.stale{border-color:#ff7792;color:#ffbcc8}.ok{color:var(--m)}.stat{padding:12px 0;border-bottom:1px solid var(--l)}small,p{color:#b5c4d8}</style><main><small>自作・合成セッション / 実カメラ・実モデルなし</small><h1>Session Boundary Reset Lab</h1><p>映像源を切り替えるとき、古い非同期結果を新しいセッションに混ぜないための generation token を可視化します。</p><div class="layout"><section class="card"><button id="frame">旧セッションの遅い結果を投入</button><button id="swap">映像源を切替・reset</button><button id="fresh">新セッションの結果を投入</button><div class="feed" id="feed" aria-live="polite"></div></section><aside class="card"><div class="stat">現在セッション <b id="gen" class="ok">1</b></div><div class="stat">採用結果 <b id="accepted">0</b></div><div class="stat">破棄した古い結果 <b id="dropped">0</b></div><p>次に足すなら、実 FaceLandmarker の video 要素差替え、タスク close/create の計測、AbortController とロード状態を同じ時系列に載せます。</p></aside></div></main><script>let g=1,a=0,d=0;const f=document.querySelector('#feed'),show=(msg,bad=false)=>{f.insertAdjacentHTML('afterbegin',`<div class="event ${bad?'stale':''}">${new Date().toLocaleTimeString()} — ${msg}</div>`)};const sync=()=>{gen.textContent=g;accepted.textContent=a;dropped.textContent=d};frame.onclick=()=>{let sent=g;show(`frame を session ${sent} で送信。620ms 後に到着予定`);setTimeout(()=>{if(sent!==g){d++;show(`session ${sent} の結果を破棄（現在は ${g}）`,true)}else{a++;show(`session ${sent} の結果を採用`)}sync()},620)};swap.onclick=()=>{g++;show(`映像源を切替。session ${g} を開始し、前セッションの結果を無効化`);sync()};fresh.onclick=()=>{let sent=g;setTimeout(()=>{if(sent===g){a++;show(`session ${sent} の最新結果を採用`);sync()}},150);show(`session ${sent} の新しい frame を送信。150ms 後に到着予定`)};show('session 1 を開始。遅い結果を投入してから切替を試してください。');sync()</script></html>
