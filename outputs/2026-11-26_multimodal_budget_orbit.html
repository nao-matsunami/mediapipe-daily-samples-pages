<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multimodal Budget Orbit</title><style>:root{color-scheme:dark;--b:#0b1020;--c:#161e39;--l:#3b4d7a;--t:#eef4ff;--m:#aab9d7;--a:#78f0cc;--p:#c8a5ff;--o:#ffbd7a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#283778,transparent 40%),var(--b);color:var(--t);font:16px/1.5 system-ui}main{max-width:1110px;margin:auto;padding:30px}.tag,label{font:700 12px ui-monospace;letter-spacing:.1em;color:var(--a)}h1{font-size:clamp(39px,7vw,70px);line-height:.9;margin:12px 0}.lead,.note{color:var(--m)}.grid{display:grid;grid-template-columns:285px 1fr;gap:16px}.card{background:#161e39e8;border:1px solid var(--l);border-radius:20px;padding:18px}label{display:block;margin:12px 0}input{width:100%;accent-color:var(--a)}button{width:100%;padding:11px;margin:5px 0;border:1px solid var(--l);border-radius:10px;background:#293863;color:var(--t);font-weight:800;cursor:pointer}.state{font:800 17px ui-monospace;color:var(--a)}canvas{width:100%;height:auto;display:block;border-radius:14px;background:#090e1b}.log{height:92px;overflow:auto;margin-top:12px;border-top:1px solid var(--l);padding-top:8px;color:var(--m);font:12px/1.55 ui-monospace}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><div class="tag">ORIGINAL / TASKS GENAI INPUT SCHEDULING</div><h1>Multimodal<br>Budget Orbit</h1><p class="lead">テキスト・画像・音声を同時に受けるローカル推論を想定し、1ターンの待機予算に収まる入力だけを透明に採用します。実モデル、カメラ、音声は起動しません。</p><section class="grid"><aside class="card"><label>待機予算 <output id="bo">900</output> ms<input id="budget" type="range" min="300" max="2000" step="50" value="900"></label><label>音声区間 <output id="ao">360</output> ms<input id="audio" type="range" min="80" max="1200" step="20" value="360"></label><label>画像の解像度 <output id="io">640</output> px<input id="image" type="range" min="160" max="1280" step="80" value="640"></label><button id="text">TEXT を投入</button><button id="photo">IMAGE を投入</button><button id="voice">AUDIO を投入</button><button id="clear">TURN をクリア</button><p class="state" id="state">READY · 0 / 900 ms</p></aside><section class="card"><canvas id="view" width="760" height="420"></canvas><div class="log" id="log"></div><p class="note">次に足すなら、実際のTasks GenAI入力（テキスト、画像、音声）ごとに計測した前処理・生成待機時間を記録し、ユーザーの許諾、モデル/デリゲート、キャンセル理由も同じturn台帳に結びます。</p></section></section><script>const $=s=>document.querySelector(s),c=$('#view'),g=c.getContext('2d');let items=[],logs=[];const palette={TEXT:'#78f0cc',IMAGE:'#c8a5ff',AUDIO:'#ffbd7a'};function log(s){logs.unshift(new Date().toLocaleTimeString('ja-JP')+' '+s);logs=logs.slice(0,6);$('#log').innerHTML=logs.join('<br>')}function cost(kind){if(kind==='TEXT')return 140+Math.round(Math.random()*100);if(kind==='IMAGE')return Math.round(+$('#image').value*.72);return Math.round(+$('#audio').value*.62)}function add(kind){let n=cost(kind),b=+$('#budget').value,used=items.reduce((s,x)=>s+x.cost,0);if(used+n>b){log(kind+' '+n+'ms は残り '+Math.max(0,b-used)+'ms を超えたため保留');return}items.push({kind,cost:n,phase:0});log(kind+' '+n+'ms を採用（端末内の入力予算を想定）')}function draw(t){let b=+$('#budget').value,used=items.reduce((s,x)=>s+x.cost,0);$('#bo').textContent=b;$('#ao').textContent=$('#audio').value;$('#io').textContent=$('#image').value;$('#state').textContent=(used>b?'OVER':'READY')+' · '+used+' / '+b+' ms';g.clearRect(0,0,760,420);g.fillStyle='#aab9d7';g.font='13px ui-monospace';g.fillText('one local inference turn — synthetic timing only',30,33);let cx=380,cy=225;g.strokeStyle='#3b4d7a';g.lineWidth=2;[58,116,174].forEach(r=>{g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.stroke()});g.fillStyle='#eef4ff';g.font='700 17px ui-monospace';g.fillText('TURN',cx-25,cy-4);g.fillStyle='#aab9d7';g.font='13px ui-monospace';g.fillText(used+'ms / '+b+'ms',cx-42,cy+20);items.forEach((x,i)=>{let r=58+i*58,a=t/1100*(i%2?-.8:1)+i*2.1,xp=cx+Math.cos(a)*r,yp=cy+Math.sin(a)*r;x.phase+=.04;g.fillStyle=palette[x.kind];g.beginPath();g.arc(xp,yp,25+Math.sin(x.phase)*2,0,7);g.fill();g.fillStyle='#0b1020';g.font='700 11px ui-monospace';g.fillText(x.kind.slice(0,3),xp-11,yp+4);g.fillStyle=palette[x.kind];g.font='12px ui-monospace';g.fillText(x.cost+'ms',xp-17,yp+43)});g.fillStyle='#3b4d7a';g.fillRect(30,370,700,10);g.fillStyle=used>b?'#ff8296':'#78f0cc';g.fillRect(30,370,700*Math.min(1,used/b),10);requestAnimationFrame(draw)}$('#text').onclick=()=>add('TEXT');$('#photo').onclick=()=>add('IMAGE');$('#voice').onclick=()=>add('AUDIO');$('#clear').onclick=()=>{items=[];log('turn を破棄：入力参照を保持しない')};requestAnimationFrame(draw);</script></main></html>
